<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>律协面试 · 刷题宝</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f6fb;color:#26303f;min-height:100vh}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 40px}
/* 顶部 */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-size:20px;font-weight:800;color:#1e3a8a}
.logo small{font-weight:400;color:#8b96a9;font-size:12px}
.tabs{display:flex;gap:6px;margin-left:auto}
.tab{padding:8px 18px;border-radius:20px;border:1px solid #d6dbe8;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:#5a6577}
.tab.active{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.tab .cnt{font-weight:400;opacity:.8;font-size:12px;margin-left:2px}
/* 进度 */
.prog{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pill{background:#fff;border:1px solid #e3e7f1;border-radius:8px;padding:6px 12px;font-size:13px;color:#465066}
.pill b{color:#1e3a8a}
.pill .g{color:#1a9b5c}.pill .r{color:#d64545}
/* 筛选 */
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.flabel{font-size:12px;color:#8b96a9;margin-right:4px}
.fbtn{padding:5px 12px;border-radius:14px;border:1px solid #d6dbe8;background:#fff;cursor:pointer;font-size:13px;color:#5a6577}
.fbtn.active{background:#eef2ff;border-color:#1e3a8a;color:#1e3a8a;font-weight:600}
.fbtn.danger{color:#d64545;border-color:#f3c8c8}
/* 卡片 */
.card{background:#fff;border:1px solid #e3e7f1;border-radius:12px;padding:18px 20px;box-shadow:0 1px 3px rgba(30,58,138,.06)}
.qmeta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.qtag{font-size:12px;color:#8b96a9}
.qno{background:#eef2ff;color:#1e3a8a;font-weight:700;font-size:12px;padding:3px 10px;border-radius:12px}
.qtext{font-size:16px;line-height:1.75;margin-bottom:16px;font-weight:500;white-space:pre-wrap}
/* 选项 */
.opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid #d6dbe8;border-radius:10px;padding:11px 14px;margin-bottom:9px;cursor:pointer;transition:.12s;font-size:14.5px;line-height:1.55}
.opt:hover{border-color:#1e3a8a;background:#f7f9ff}
.opt .ol{width:22px;height:22px;border-radius:50%;border:1.5px solid #c3cad9;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#5a6577;flex-shrink:0;margin-top:1px}
.opt.selected{border-color:#1e3a8a;background:#eef2ff}
.opt.selected .ol{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.opt.right{border-color:#1a9b5c;background:#eef9f2}
.opt.right .ol{background:#1a9b5c;color:#fff;border-color:#1a9b5c}
.opt.wrong{border-color:#d64545;background:#fdeef0}
.opt.wrong .ol{background:#d64545;color:#fff;border-color:#d64545}
.opt.dim{opacity:.5;pointer-events:none}
/* 反馈 */
.fb{margin-top:14px;border-radius:10px;padding:13px 15px;font-size:14px;line-height:1.6;display:none}
.fb.show{display:block}
.fb.correct{background:#eef9f2;border:1px solid #bce3cc;color:#1a5c38}
.fb.wrong{background:#fdeef0;border:1px solid #f3c8c8;color:#8c2b2b}
.fb .ans{font-weight:700}
.fb .src{margin-top:6px;color:#465066;font-size:13px}
/* 简答 */
.essay-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600}
.btn.primary{background:#1e3a8a;color:#fff}
.btn.primary:hover{background:#17306d}
.btn.gray{background:#eef1f6;color:#465066}
.btn.green{background:#1a9b5c;color:#fff}
.btn.amber{background:#e8a13c;color:#fff}
.btn.red{background:#d64545;color:#fff}
.mem{margin-top:12px;background:#fbf8f1;border:1px solid #efe4c9;border-radius:10px;padding:12px 14px;display:none}
.mem.show{display:block}
.mem .mt{font-size:12px;color:#9a8442;font-weight:700;margin-bottom:6px}
.mem .mk{font-size:14px;line-height:1.7;color:#6b5a26}
.mem .mm{font-size:13.5px;color:#a0863d;margin-top:6px}
/* 底部固定导航 */
.foot{position:sticky;bottom:0;background:#f4f6fb;z-index:5;margin-top:16px;padding-top:2px}
.nav{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav button{padding:9px 20px;border-radius:8px;border:1px solid #d6dbe8;background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:#465066}
.nav button:hover{border-color:#1e3a8a;color:#1e3a8a}
.nav button:disabled{opacity:.4;cursor:not-allowed}
.nav input{width:80px;padding:8px 6px;border:1px solid #d6dbe8;border-radius:8px;font-size:13px;text-align:center;outline:none}
.nav input:focus{border-color:#1e3a8a}
.pos{font-size:13px;color:#8b96a9}
/* 题号导航条（固定高度可滚动，不撑满页面） */
.strip{display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow-y:auto;padding:6px 2px 10px}
/* 宽屏：题号放左侧固定边栏（加宽，与主内容比例协调） */
@media (min-width:1100px){
  .foot .strip{position:fixed;left:0;top:0;bottom:0;width:216px;max-height:none;overflow-y:auto;background:#eef1f7;border-right:1px solid #e3e7f1;padding:14px 12px;z-index:6;align-content:flex-start}
  .foot .strip .cell{width:42px;height:34px;font-size:13px;border-radius:6px}
  .wrap{margin:18px 16px 40px 236px;max-width:920px}
}
.cell{width:26px;height:26px;border-radius:5px;border:1px solid #d6dbe8;display:flex;align-items:center;justify-content:center;font-size:11px;color:#7a8496;cursor:pointer;background:#fff}
.cell.cur{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.cell.right{background:#1a9b5c;color:#fff;border-color:#1a9b5c}
.cell.wrong{background:#d64545;color:#fff;border-color:#d64545}
.cell.done{background:#eef2ff;color:#1e3a8a}
.cell.jdone{background:#eef9f2;color:#1a9b5c}
.cell.jreview{background:#fdf3e3;color:#b5791f}
.hint{font-size:12px;color:#8b96a9;margin-top:6px}
/* 工具箱：统计/错题本/进度 */
.tools{display:flex;gap:6px;margin-left:8px;flex-wrap:wrap}
.tbtn{padding:8px 14px;border-radius:20px;border:1px solid #d6dbe8;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#5a6577;white-space:nowrap}
.tbtn:hover{border-color:#1e3a8a;color:#1e3a8a}
.mask{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,28,45,.45);z-index:80;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto}
.mask.show{display:flex}
.panel{background:#fff;border-radius:14px;max-width:720px;width:100%;padding:18px 22px 22px;box-shadow:0 10px 40px rgba(20,28,45,.25)}
.panel h3{font-size:17px;color:#1e3a8a;margin-bottom:2px}
.panel .close{float:right;border:none;background:none;font-size:22px;cursor:pointer;color:#8b96a9;line-height:1;margin-left:10px}
.panel .close:hover{color:#d64545}
.panel .psub{font-size:12px;color:#8b96a9;margin-bottom:12px}
.panel h4{font-size:13px;color:#465066;margin:16px 0 6px}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.smetric{background:#f7f9ff;border:1px solid #e3e7f1;border-radius:10px;padding:10px 6px;text-align:center}
.smetric b{display:block;font-size:18px;color:#1e3a8a}
.smetric span{font-size:11px;color:#8b96a9}
.stable{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.stable th,.stable td{border-bottom:1px solid #eef1f6;padding:6px 8px;text-align:left;vertical-align:middle}
.stable th{color:#8b96a9;font-weight:600;font-size:12px}
.stable td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chapname{max-width:240px}
.mutedsrc{color:#8b96a9;font-size:11px}
.tagq{color:#b5791f;font-size:11px;white-space:nowrap}
.tagw{color:#d64545;font-size:11px;white-space:nowrap}
.clk{cursor:pointer}
.clk:hover td{background:#f7f9ff}
.barrow{display:flex;align-items:center}
.bar{height:6px;background:#eef1f6;border-radius:3px;overflow:hidden;min-width:80px;flex:1}
.bar i{display:block;height:100%;background:#1e3a8a;border-radius:3px}
.bar i.g{background:#1a9b5c}
.bar i.r{background:#d64545}
.barnum{font-size:11px;color:#8b96a9;margin-left:6px;white-space:nowrap}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel input[type=file]{font-size:12px;color:#5a6577}
.mt6{margin-top:6px}
/* 番茄钟 */
/* 番茄钟 */
#pomoBall{margin-left:8px;padding:8px 14px;border-radius:20px;border:1px solid #d6dbe8;background:#fff;cursor:pointer;font-size:13px;font-weight:700;color:#1e3a8a;white-space:nowrap}
#pomoBall.run{background:#1e3a8a;color:#fff;border-color:#1e3a8a;animation:pulse 2s infinite}
#pomoBall.break{background:#1a9b5c;color:#fff;border-color:#1a9b5c}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(30,58,138,.30)}50%{box-shadow:0 0 0 6px rgba(30,58,138,.10)}}
#pomoPanel{display:none;position:fixed;top:64px;right:16px;z-index:60;background:#fff;border:1px solid #e3e7f1;border-radius:14px;padding:16px 18px;box-shadow:0 6px 24px rgba(30,58,138,.18);width:230px}
#pomoPanel.show{display:block}
#pomoTime{font-size:34px;font-weight:800;color:#26303f;text-align:center;font-variant-numeric:tabular-nums}
#pomoState{text-align:center;font-size:12px;color:#8b96a9;margin:2px 0 10px}
#pomoCount{text-align:center;font-size:12px;color:#1e3a8a;margin-bottom:10px}
.pomoRow{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pomoRow button{padding:7px 12px;border-radius:8px;border:1px solid #d6dbe8;background:#fff;cursor:pointer;font-size:12px;font-weight:600;color:#465066}
.pomoRow button:hover{border-color:#1e3a8a;color:#1e3a8a}
.pomoRow .pri{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
#pomoNote{font-size:11px;color:#8b96a9;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">律协面试 · 刷题宝<small> 共511题 · 单选/多选/简答</small></div>
    <div class="tabs">
      <div class="tab" data-k="danxuan">单选</div>
      <div class="tab" data-k="duoxuan">多选</div>
      <div class="tab" data-k="jianda">简答</div>
      <div class="tab" data-k="today">今日<span class="cnt" id="todayCnt"></span></div>
    </div>
  </div>

  <div class="prog">
    <span class="pill">今日待复习 <b id="pToday">0</b></span>
    <span class="pill">已做 <b id="pDone">0</b>/<span id="pTotal">0</span></span>
    <span class="pill">正确率 <b class="g" id="pAcc">--</b></span>
    <span class="pill">错题 <b class="r" id="pWrong">0</b></span>
    <span class="pill" id="pEssay" style="display:none">待复习 <b id="pReview">0</b></span>
  </div>

  <div class="filters" id="filters"></div>

  <div class="card">
    <div class="qmeta">
      <span class="qno" id="qno">—</span>
      <span class="qtag" id="qtag"></span>
      <span class="qtag" id="qtype"></span>
    </div>
    <div class="qtext" id="qtext"></div>
    <div id="options"></div>
    <div class="fb" id="fb"></div>
    <div class="essay-actions" id="essayActions" style="display:none"></div>
  </div>

  <div class="foot">
    <div class="nav">
      <button id="prev">上一题</button>
      <span class="pos" id="pos"></span>
      <input id="jump" type="number" min="1" placeholder="跳题号" title="输入题号后回车跳转">
      <button id="next">下一题</button>
    </div>
    <div class="strip" id="strip"></div>
  </div>
  <div class="hint" id="hint"></div>
</div>

<script>
const DATA = {"danxuan":[{"id":1,"q":"根据《宪法》的规定，以下机构中，哪个机构可以行使“国家立法权”？","options":{"A":"全国人民代表大会和全国人民代表大会常务委员会","B":"最高人民法院","C":"最高人民检察院","D":"国务院"},"answer":"A","sources":["宪法第58条"],"note":"宪法第58条"},{"id":2,"q":"根据《宪法》的规定，超市怀疑客户偷拿商品，询问客户近5小时是否合法？","options":{"A":"合法，因为怀疑客户偷拿商品","B":"不合法，因为禁止非法拘禁和以其他方法非法剥夺或者限制公民的人身自由","C":"合法，因为客户在超市内","D":"不合法，因为客户有权拒绝询问"},"answer":"B","sources":["宪法第37条"],"note":"宪法第37条"},{"id":3,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》，律师同时在律师事务所和其他法律服务机构执业，以下哪种说法是正确的？","options":{"A":"此行为是合规的，不需要受到处分","B":"此行为是违规的，但只会受到轻微警告","C":"此行为是违规的，可能受到训诫、通报批评、公开谴责的处分","D":"此行为虽然违规，但不会被公开谴责"},"answer":"C","sources":["规则第37条"],"note":"规则第37条"},{"id":4,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第二十条的规定，下列哪一行为不属于律师“煽动、教唆当事人采取扰乱公共秩序、危害公共安全等非法手段解决争议的”违法行为：","options":{"A":"煽动当事人采取非法集会的非法手段抗拒执法活动","B":"教唆当事人采取游行示威的非法手段抗拒执法活动","C":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","D":"利用媒体煽动当事人以扰乱公共秩序的手段干扰诉讼活动正常进行"},"answer":"C","sources":["办法第20条"],"note":"办法第20条"},{"id":5,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师庭审体态语态规范要求的？","options":{"A":"律师的庭审发言用词不得随意使用黑话、脏话或社会流行的切口话","B":"律师的庭审发言不得发表与司法人员任职资格和品行有关的轻率言论","C":"律师的庭审发言不得发布任何可能被合理地认为损害司法公正的言论","D":"律师的庭审发言应当文明、得体，表达意见应当选用规范语言，不得辅以形体动作"},"answer":"D","sources":["规范第124、125、126、127条"],"note":"规范第124、125、126、127条"},{"id":6,"q":"在同一案件中为双方当事人担任代理人，或者代理与本人及其近亲属有利益冲突的法律事务，情节严重的最高可以给予停止执业（）月？","options":{"A":"三个月","B":"六个月","C":"九个月","D":"十二个月"},"answer":"A","sources":["律师法第47条"],"note":"律师法第47条"},{"id":7,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师收费应当考虑的合理因素？","options":{"A":"国家行政管理部门、律师协会制定的相关规定","B":"同一区域相似法律服务通常所收取的费用","C":"律师与当事人关系的性质以及交往时间的长短","D":"律师与当事人争议的权益之间所产生经济上的联系"},"answer":"D","sources":["规范第47、48条"],"note":"规范第47、48条"},{"id":8,"q":"律师的违法行为导致律师事务所承担赔偿责任后，律师事务所有权如何处理？","options":{"A":"律师事务所应自行承担全部赔偿责任","B":"律师事务所可以向有故意或重大过失的律师追偿","C":"律师事务所应解除与该律师的合同","D":"律师事务所应公开道歉并赔偿受损方。"},"answer":"B","sources":["《律师和律师事务所违法行为处罚办法》第46条"],"note":"《律师和律师事务所违法行为处罚办法》第46条"},{"id":9,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师和律师事务所在与社会公众的接触中，采用不正当手段与同行进行业务竞争？","options":{"A":"承诺给介绍人提取案件介绍费","B":"采用委托方具体办事人员提取案件介绍费的方式争揽业务","C":"散布炫耀自己，贬低、排斥同行的言论","D":"律师以自己或者其任职的律师事务所名义参加各种社会公益活动的"},"answer":"D","sources":["规范第107条"],"note":"规范第107条"},{"id":10,"q":"以下哪项不属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"拟接受委托人委托的律师已经明知诉讼相对方或利益冲突方已委聘的律师是自己的近亲属或其他利害关系人，仍然继续代理，且未取得双方同意的","B":"陪同当事人一起与主审法官私下沟通案件的处理","C":"在非诉讼业务中，同一律师事务所的律师同时担任彼此有利害关系的各方当事人的代理人","D":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的"},"answer":"D","sources":["规则第21、31、20条"],"note":"规则第21、31、20条"},{"id":11,"q":"依据全国律协《律师协会会员违规行为处分规则》，下列哪项不属于不正当竞争行为？","options":{"A":"捏造、散布虚假事实，损害、诋毁其他律师、律师事务所声誉的","B":"哄骗、唆使当事人提起诉讼，制造、扩大矛盾，影响社会稳定的","C":"利用与司法机关、行政机关或其他具有社会管理职能组织的关系，进行不正当竞争的","D":"对本人或者其他律师正在办理的案件进行歪曲、有误导性的宣传和评论，恶意炒作案件的"},"answer":"D","sources":["规则第29、30条ABC是不正当竞争行为，D是其他不正当行为"],"note":"规则第29、30条ABC是不正当竞争行为，D是其他不正当行为"},{"id":12,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，惩戒委员会会议作出决定后，应当制作书面决定书。决定书中无需载明的事项？","options":{"A":"投诉人的基本信息","B":"投诉的基本事实和诉求","C":"被调查会员的答辩意见","D":"投诉人的工作单位"},"answer":"D","sources":["规则第65条"],"note":"规则第65条"},{"id":13,"q":"根据《律师法》的规定，关于律师可以从事的业务，以下哪个选项是错误的？","options":{"A":"接受自然人、法人或者其他组织的委托，担任法律顾问","B":"接受民事案件、行政案件当事人的委托，担任代理人，参加诉讼","C":"接受刑事案件犯罪嫌疑人、被告人的委托或者依法接受法律援助机构的指派，担任辩护人，接受自诉案件自诉人、公诉案件被害人或者其近亲属的委托，担任代理人，参加诉讼","D":"接受具有对抗关系的双方当事人委托，为其之间存在的争议进行调解并分别收取费用"},"answer":"D","sources":["律师法第28条"],"note":"律师法第28条"},{"id":14,"q":"在我国，哪一项制度被确立为国家的根本政治制度？","options":{"A":"社会主义制度","B":"人民代表大会制度","C":"民族区域自治制度","D":"基层群众自治制度"},"answer":"B","sources":[],"note":""},{"id":15,"q":"以下哪些组织和个人必须遵守宪法和法律？","options":{"A":"国家机关","B":"各政党和各社会团体","C":"各企业事业组织","D":"以上所有选项"},"answer":"D","sources":["宪法第5、53条"],"note":"宪法第5、53条"},{"id":16,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师和律师事务所相互之间采用手段排挤竞争对手的公平竞争，损害其他律师的利益或者社会公共利益?","options":{"A":"律师和律师事务所进行律师之间或律师事务所之间的比较宣传的","B":"以诉讼结果或其他法律服务结果作为律师收费依据的","C":"为低价收费，不正当获取其他律师和律师事务所收费报价或者其他提供法律服务的条件的","D":"串通其他律师事务所抬高收费的"},"answer":"B","sources":["规范第45、111条"],"note":"规范第45、111条"},{"id":17,"q":"根据《律师法》的规定，下述行为哪一个不属于律师申请律师执业应当具备的条件？","options":{"A":"拥护中华人民共和国宪法","B":"在律师事务所实习满一年","C":"品行良好","D":"无任何犯罪记录"},"answer":"D","sources":["律师法第5条"],"note":"律师法第5条"},{"id":18,"q":"下列哪个行为不属于律师无正当理由拒绝接受法律援助案件的？","options":{"A":"无正当理由拒绝接受律师事务所指派的法律援助案件","B":"无正当理由拒绝接受法律援助机构指派的法律援助案件","C":"接受指派后，懈怠履行或者擅自停止履行法律援助职责","D":"拒绝接受当事人或者犯罪嫌疑人的法律援助申请"},"answer":"D","sources":["《律师和律师事务所违法行为处罚办法》第9条"],"note":"《律师和律师事务所违法行为处罚办法》第9条"},{"id":19,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师和律师事务所在与行政机关或行业管理部门接触中，采用不正当手段与同行进行业务竞争？","options":{"A":"借助行业管理部门的权力，对某一类的法律服务事务进行垄断的方式争揽业务的","B":"发现行政机关人员的活动违反法律规定，通过合法有效途径告知有关管理部门的","C":"没有法律依据地要求行政机关超越行政职权的","D":"限定当事人接受其指定的律师或律师事务所提供的法律服务的"},"answer":"B","sources":["规范第108条"],"note":"规范第108条"},{"id":20,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"在名片上印有各种学术、学历、非律师业职称、社会职务以及所获荣誉","B":"律师和律师事务所受到通告批评处分未满一年，发布律师广告","C":"律师私下接受当事人报酬","D":"以上均是"},"answer":"D","sources":["A选项出自《关于反对律师行业不正当竞争行为的若干规定》第4条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项出自规则第27条"],"note":"A选项出自《关于反对律师行业不正当竞争行为的若干规定》第4条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项出自规则第27条"},{"id":21,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"贬低同行的专业能力和水平等方式，招揽业务","B":"利用媒体、广告或者其他方式进行不真实或者不适当宣传的","C":"明显低于同业的收费水平竞争某项法律事务","D":"以上均是"},"answer":"D","sources":["A选项出自《上海市律师协会律师执业行为规范》第33、102、107条B选项出自规则第29条C选项出自《上海市律师协会律师执业行为规范》第106条"],"note":"A选项出自《上海市律师协会律师执业行为规范》第33、102、107条B选项出自规则第29条C选项出自《上海市律师协会律师执业行为规范》第106条"},{"id":22,"q":"关于全国人民代表大会，下述说法错误的是？","options":{"A":"全国人民代表大会是最高国家权力机关","B":"全国人民代表大会常务委员会是另一个具有独立地位的国家立法机关","C":"全国人民代表大会是我国最高立法机关","D":"全国人民代表大会会议每年举行一次，由全国人民代表大会常务委员会召集"},"answer":"B","sources":["宪法第57、58、61条"],"note":"宪法第57、58、61条"},{"id":23,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“向法官、检察官、仲裁员以及其他有关工作人员行贿，介绍贿赂或者指使、诱导当事人行贿”的违法行为对应的罚款标准是?","options":{"A":"五千元以上一万元以下","B":"三万元以下","C":"十万元以下","D":"五万元以下"},"answer":"D","sources":["办法第15条、律师法第49条"],"note":"办法第15条、律师法第49条"},{"id":24,"q":"下列关于宗教信仰自由的说法，哪一项是正确的？","options":{"A":"宗教信仰自由仅适用于成年人，未成年人不得享有此权利","B":"宗教信仰自由意味着公民可以在任何场合、任何时间、以任何方式进行宗教活动","C":"政府可以干预公民选择信仰何种宗教，以确保社会的和谐稳定","D":"公民有信仰宗教的自由，也有不信仰宗教的自由"},"answer":"D","sources":["宪法第36条"],"note":"宪法第36条"},{"id":25,"q":"律师积极参与法律援助、社会公益活动，是（）的执业根本宗旨之体现。","options":{"A":"为人民服务","B":"执业为民","C":"努力维护人民群众的根本利益","D":"维护公民、法人和其他组织的合法权益 注意单多选"},"answer":"B","sources":["《律师执业道德基本准则》序章"],"note":"《律师执业道德基本准则》序章"},{"id":26,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，下列哪种情形属于惩戒委员会应当作出不予立案决定的？","options":{"A":"已经提供相关证据材料的","B":"证据材料与投诉事实有联系的","C":"匿名投诉或者投诉人身份无法核实，导致相关事实无法查清的","D":"投诉人就被投诉会员的违规行为尚未提起诉讼、仲裁等司法程序案件的"},"answer":"C","sources":["规则第49条"],"note":"规则第49条"},{"id":27,"q":"根据我国宪法规定，国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行（）","options":{"A":"无偿征收或者征用","B":"征收或者征用并给予赔偿","C":"有偿征收或者征用","D":"征收或者征用并给予补偿"},"answer":"D","sources":["宪法第13条"],"note":"宪法第13条"},{"id":28,"q":"根据《宪法》的规定，我国国家机构的运行实行民主集中制。以下不属于民主集中制体现的是？","options":{"A":"全国人民代表大会和地方各级人民代表大会都由民主选举产生，对人民负责，受人民监督","B":"国家行政机关、监察机关、审判机关、检察机关都由人民代表大会产生，对它负责，受它监督","C":"中央和地方的国家机构职权的划分，遵循在中央的统一领导下，充分发挥地方的主动性、积极性的原则","D":"中华人民共和国各民族一律平等"},"answer":"D","sources":["宪法第3条"],"note":"宪法第3条"},{"id":29,"q":"下列哪一选项不属于对律师执业行为的外部监督","options":{"A":"公众通过司法局的意见箱投诉违反职业道德的律师","B":"律师事务所对所内律师的不当行为及时进行纠正","C":"县级人民政府司法行政部门认为律师的违法行为应当给予行政处罚，向上级司法行政部门提出处罚建议","D":"对于因故意犯罪受到刑事处罚的律师，省、自治区、直辖市人民政府司法行政部门吊销其律师执业证书"},"answer":"B","sources":["律师法第3、52、49条"],"note":"律师法第3、52、49条"},{"id":30,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，下述行为哪一个属于违规行为？","options":{"A":"在同一案件中为双方当事人担任代理人，或者代理与本人及其近亲属有利益冲突的法律事务","B":"担任法律顾问期间，为顾问单位提供法律服务","C":"曾担任法官、检察官的律师，以代理人、辩护人的身份承办原任职法院、检察院之外的案件","D":"同一律师事务所的两位律师经犯罪嫌疑人同意后，在同一刑事案件中分别担任不同被告人的辩护人"},"answer":"A","sources":["办法第7条"],"note":"办法第7条"},{"id":31,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"在非诉讼业务中，同一律师事务所的律师同时担任彼此有利害关系的各方当事人的代理人","B":"律师和律师事务所受到通告批评处分未满一年，发布律师广告","C":"律师私下接受当事人报酬","D":"以上均是"},"answer":"D","sources":["A选项出自规则第20条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项出自规则第27条"],"note":"A选项出自规则第20条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项出自规则第27条"},{"id":32,"q":"根据《宪法》的规定，全国人民代表大会任期届满的两个月以前，全国人民代表大会常务委员会必须完成下届全国人民代表大会代表的选举。如果遇到不能进行选举的非常情况，在什么条件下可以推迟选举？","options":{"A":"全国人民代表大会常务委员会以全体组成人员的三分之二以上的多数通过","B":"全国人民代表大会常务委员会以全体组成人员的三分之一以上的多数通过","C":"全国人民代表大会常务委员会以全体组成人员的二分之一以上的多数通过","D":"全国人民代表大会常务委员会以全体组成人员的四分之三以上的多数通过"},"answer":"A","sources":["宪法第60条"],"note":"宪法第60条"},{"id":33,"q":"根据《宪法》的规定，以下哪个选项是全国人民代表大会常务委员会具有的职权?","options":{"A":"制定和修改刑事、民事、国家机构的和其他的基本法律","B":"选举中华人民共和国主席、副主席","C":"选举最高人民检察院检察长","D":"决定全国或者个别省、自治区、直辖市进入紧急状态"},"answer":"D","sources":["宪法第67条"],"note":"宪法第67条"},{"id":34,"q":"根据现行宪法规定，没有附加剥夺政治权利的犯罪分子正在服刑期间","options":{"A":"准予行使选举权","B":"停止行使选举权","C":"经有关机关批准可以行使选举权","D":"没有选举权"},"answer":"A","sources":["宪法第34条"],"note":"宪法第34条"},{"id":35,"q":"根据《宪法》的规定，各级检察院向什么机关负责？","options":{"A":"最高人民检察院对全国人民代表大会负责。地方各级人民检察院对上级人民检察院负责","B":"最高人民检察院对全国人民代表大会负责。地方各级人民检察院对产生它的国家权力机关负责","C":"最高人民检察院对全国人民代表大会和全国人民代表大会常务委员会负责。地方各级人民检察院对上级人民检察院负责","D":"最高人民检察院对全国人民代表大会和全国人民代表大会常务委员会负责。地方各级人民检察院对产生它的国家权力机关和上级人民检察院负责"},"answer":"D","sources":["宪法第138条"],"note":"宪法第138条"},{"id":36,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，哪些阶段不可以进行调解？","options":{"A":"调差","B":"听证","C":"处分","D":"复查"},"answer":"D","sources":["规则第90条"],"note":"规则第90条"},{"id":37,"q":"根据《宪法》的规定，下列哪一项正确描述了我国对社会主义公共财产的规定？","options":{"A":"社会主义的公共财产可以在特定情况下被侵犯","B":"国家不对社会主义的公共财产提供保护","C":"任何组织或者个人都不得用任何手段侵占或者破坏国家的和集体的财产","D":"个人在某些情况下可以侵占公共财产"},"answer":"C","sources":["宪法第12条"],"note":"宪法第12条"},{"id":38,"q":"根据《宪法》的规定，以下哪个选项是全国人民代表大会常务委员会具有的职权?","options":{"A":"选举最高人民检察院检察长","B":"选举最高人民法院院长","C":"解释宪法，监督宪法的实施","D":"批准省、自治区和直辖市的建置"},"answer":"C","sources":["宪法第67条"],"note":"宪法第67条"},{"id":39,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为不属于违规行为的是？","options":{"A":"为承揽业务，向委托人作虚假承诺","B":"向当事人明示或者暗示与办案机关、政府部门及其工作人员有特殊关系的","C":"以支付介绍费等不正当手段争揽业务","D":"通过发表学术论文、案例分析、专题解答、授课、普及法律等活动，宣传自己的专业领域"},"answer":"D","sources":["规则第29条"],"note":"规则第29条"},{"id":40,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为应当给予“停止执业六个月以上一年以下的处罚”：","options":{"A":"无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的","B":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的","C":"向法律援助受援人索要费用或者接受受援人的财物或者其他利益的","D":"向对方当事人或者第三人提供不利于委托人的信息或者证据材料的"},"answer":"D","sources":["办法第18条A,B均出自办法第9条；C出自办法第10条"],"note":"办法第18条A,B均出自办法第9条；C出自办法第10条"},{"id":41,"q":"根据《宪法》的规定，下列哪一项正确描述了我国对公民合法私有财产的规定？","options":{"A":"公民的合法私有财产可以在任何情况下被侵犯","B":"国家不保护公民的私有财产权和继承权","C":"公民合法的私有财产不受侵犯，国家依照法律规定保护公民的私有财产权和继承权","D":"国家可以在不需要补偿的情况下征收或征用公民的私有财产"},"answer":"C","sources":["宪法第13条"],"note":"宪法第13条"},{"id":42,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，请选择说下列四种情形中不属于直接的利益冲突的情形","options":{"A":"律师事务所与当事人存在法律服务关系，在某一对抗性案件中该当事人未要求该律师事务所担任其代理人，而该律师事务所其他律师担任该当事人在该案件中对方当事人的代理人","B":"曾经处理或审理过某一案件、政府官员、审判员、仲裁员，成为律师后又代理同一案件的诉讼、仲裁、执行、申诉、再审","C":"在刑事案件中，同一律师事务所的律师同时担任共同犯罪案件两个或两个以上利益冲突的、罪嫌疑人（被告人）的辩护人","D":"在民事诉讼仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中的对方当事人"},"answer":"A","sources":["19年规则第5、6条如按照23年规则，则应选A,C"],"note":"19年规则第5、6条如按照23年规则，则应选A,C"},{"id":43,"q":"根据《房地产买卖合同》约定，双方交易资金由律师事务所监管。随后，买方将购房款打入律师事务所服务费常用收支账户。律师该如何处理这笔款项？","options":{"A":"该约定违反相关规定应属无效，应当将该笔资金转回当事人账户","B":"应通知并经当事人书面同意后，将购房款转入事务所在信用良好的金融机构开设的独立账户内进行监管","C":"将该笔款项转入律师个人账户","D":"将该笔费用存入律师事务所其他账户"},"answer":"B","sources":["《上海市律师协会律师执业行为规范(试行)》第97条第九十七条　律师事务所受委托保管当事人财产时，应将当事人财产与律师事务所的财产严格分离。当事人的资金应保存在律师事务所所在地信用良好的金融机构的独立账号内，或保存在当事人指定的独立开设的银行账号内。当事人其他财物的保管方法应当经其书面认可。"],"note":"《上海市律师协会律师执业行为规范(试行)》第97条第九十七条　律师事务所受委托保管当事人财产时，应将当事人财产与律师事务所的财产严格分离。当事人的资金应保存在律师事务所所在地信用良好的金融机构的独立账号内，或保存在当事人指定的独立开设的银行账号内。当事人其他财物的保管方法应当经其书面认可。"},{"id":44,"q":"根据司法部《律师和律师事务所违法行为处罚办法》的规定，律师从事以下哪种违法行为的，将会受到由司法行政机关给予停止执业六个月以上，一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任。","options":{"A":"私自接受委托、收取费用，接受委托人财物或者其他利益的","B":"违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案","C":"利用提供法律服务的便利牟取当事人争议的权益","D":"从人民法院、人民检察院离任后二年内担任诉讼代理人或者辩护人的"},"answer":"B","sources":["A选项出自办法第10条B选项出自办法第14条C选项出自办法第12条D选项出自办法第8条"],"note":"A选项出自办法第10条B选项出自办法第14条C选项出自办法第12条D选项出自办法第8条"},{"id":45,"q":"根据《中华人民共和国宪法》的规定，下述行为哪一个属于违法行为？","options":{"A":"邮政局以客户信件中含色情刊物，拆开信件进行检查","B":"公安机关或者检察机关因国家安全或者追查刑事犯罪的需要，依照法律规定的程序对通信进行检查","C":"年满18周岁，未被剥夺政治权的中国公民行使选举权","D":"国家为了公共利益的需要，依照法律规定对公民的私有财产实行征收或者征用并给予补偿"},"answer":"A","sources":["宪法第40条"],"note":"宪法第40条"},{"id":46,"q":"根据《律师法》的规定，下列哪个不是律师担任辩护人的职责？","options":{"A":"根据事实和法律，提出犯罪嫌疑人无罪、罪轻的材料和意见","B":"根据事实和法律，提出被告人免除其刑事责任的材料和意见","C":"维护被害人的诉讼权利和其他合法权益","D":"维护被告人的诉讼权利和其他合法权益"},"answer":"C","sources":["律师法第31条"],"note":"律师法第31条"},{"id":47,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，捏造、散布虚假事实，损害、诋毁其他律师、律师事务所声誉的，将可能会受到何种处分？","options":{"A":"警告","B":"训诫","C":"公开谴责","D":"罚款"},"answer":"C","sources":["规则第30条"],"note":"规则第30条"},{"id":48,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第二十一条的规定，下列哪一行为属于律师“发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序的言论的”违法行为：","options":{"A":"在执业期间，制作危害国家安全的音像制品","B":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","C":"阻止委托人或者其他诉讼参与人出庭，致使诉讼、仲裁活动不能正常进行的","D":"与对方当事人或者第三人恶意串通、暗中配合，妨碍委托人合法行使权利的"},"answer":"A","sources":["办法第21条"],"note":"办法第21条"},{"id":49,"q":"根据全国律协《律师职业道德和执业纪律规范》的规定，律师不应通过哪一途径宣传自己的业务领域和专业特长？","options":{"A":"投身于法律援助相关的公益活动","B":"将从事法律工作的经验撰写成书","C":"参与法律界热点话题的圆桌论坛","D":"利用与执法人员的关系招揽业务"},"answer":"D","sources":["规范第37条"],"note":"规范第37条"},{"id":50,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，复查委员会对于下列情况不予复查：","options":{"A":"不符合申请人主体资格","B":"申请复查在规定期限内","C":"申请复查的事项属于原决定书的范围","D":"申请复查的事实和理由充分"},"answer":"A","sources":["规则第81条"],"note":"规则第81条"},{"id":51,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“给予吊销其律师执业证书的处罚”：","options":{"A":"在律师事务所执业的同时又在其他律师事务所或者社会法律服务机构执业的","B":"以支付介绍费、给予回扣、许诺提供利益等方式承揽业务的","C":"担任法律顾问期间，为与顾问单位有利益冲突的当事人提供法律服务的","D":"阻止委托人或者其他诉讼参与人出庭，致使诉讼、仲裁活动不能正常进行的"},"answer":"D","sources":["A选项出自办法第5条，属于“同时在2个以上律所执业”B选项出自办法第6条，属于“以不正当手段承揽业务”C选项出自办法第7条，属于“违反利冲规则”D选项出自办法第19条，属于“扰乱法庭秩序，干扰诉讼活动的正常进行”"],"note":"A选项出自办法第5条，属于“同时在2个以上律所执业”B选项出自办法第6条，属于“以不正当手段承揽业务”C选项出自办法第7条，属于“违反利冲规则”D选项出自办法第19条，属于“扰乱法庭秩序，干扰诉讼活动的正常进行”"},{"id":52,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“构成犯罪，依法追究刑事责任”：","options":{"A":"无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的","B":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的","C":"向法律援助受援人索要费用或者接受受援人的财物或者其他利益的","D":"接受对方当事人财物或者其他利益，故意延误、懈怠或者不依法履行代理、辩护职责，给委托人及委托事项的办理造成不利影响和损失的"},"answer":"D","sources":["A,B选项出自办法第9条，属于“拒绝履行法律援助义务”C选项出自办法第10条，属于“私自接受委托、收取费用”D选项出自办法第18条，属于”接受对方当事人财物或者其他利益”"],"note":"A,B选项出自办法第9条，属于“拒绝履行法律援助义务”C选项出自办法第10条，属于“私自接受委托、收取费用”D选项出自办法第18条，属于”接受对方当事人财物或者其他利益”"},{"id":53,"q":"律师在为某公司担任法律顾问时，同时又为该公司的对方当事人提供了法律服务，这种行为将可能受到哪种处分？","options":{"A":"吊销律师执照","B":"刑事拘留","C":"公开谴责","D":"罚款"},"answer":"C","sources":["A,B,D均为“处罚”，并非“处分”"],"note":"A,B,D均为“处罚”，并非“处分”"},{"id":54,"q":"根据《律师法》的规定，关于设立合伙制律师事务所的条件以下哪个选项是错误的？","options":{"A":"有自己的名称、住所和章程","B":"有符合本法规定的律师","C":"设立人应当是具有一定的执业经历，且五年内未受过停止执业处罚的律师","D":"有符合国务院司法行政部门规定数额的资产，有三名以上合伙人，设立人应当是具有三年以上执业经历的律师。"},"answer":"C","sources":["律师法第3条"],"note":"律师法第3条"},{"id":55,"q":"在同一案件中为双方当事人担任代理人，或者代理与本人及其近亲属有利益冲突的法律事务，最高可以罚款（）元？","options":{"A":"2000元","B":"5000元","C":"10000元","D":"50000元"},"answer":"B","sources":["律师法第47条"],"note":"律师法第47条"},{"id":56,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的","B":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","C":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的","D":"在名片上印有各种学术、学历、非律师业职称、社会职务以及所获荣誉"},"answer":"D","sources":["《律师职业道德和执业纪律规范》第44条"],"note":"《律师职业道德和执业纪律规范》第44条"},{"id":57,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为应当给予“停止执业六个月以上一年以下的处罚”：","options":{"A":"无正当理由拒绝接受律师事务所或法律援助机构指派的法律援助案件的","B":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的","C":"向法律援助受援人索要费用或者接受受援人的财物或者其他利益的","D":"教唆当事人采取非法集会、游行示威的非法手段抗拒执法活动"},"answer":"D","sources":["A,B选项出自办法第9条，属于“拒绝履行法律援助义务”C选项出自办法第10条，属于“私自接受委托、收取费用”D选项出自办法第20条，属于”煽动、教唆当事人扰乱公共秩序”"],"note":"A,B选项出自办法第9条，属于“拒绝履行法律援助义务”C选项出自办法第10条，属于“私自接受委托、收取费用”D选项出自办法第20条，属于”煽动、教唆当事人扰乱公共秩序”"},{"id":58,"q":"根据《宪法》的规定，全国人民代表大会代表涉嫌受贿案件，监察机关拟进行逮捕，下列哪一项是正确的程序？","options":{"A":"直接进行逮捕，无需任何许可","B":"先取得全国人民代表大会会议主席团或全国人民代表大会常务委员会的许可","C":"在全国人民代表大会闭会期间，直接由监察机关决定是否逮捕","D":"只需通知全国人民代表大会代表本人即可逮捕"},"answer":"B","sources":["宪法第74条"],"note":"宪法第74条"},{"id":59,"q":"下列何种情况不属于律师利用提供法律服务的便利牟取当事人争议的权益的违法行为？","options":{"A":"采用诱导、欺骗手段获取当事人与他人争议的房产","B":"指使、诱导当事人将争议的股权以明显低于市场的价格出售给自己","C":"指使、诱导当事人将争议的房产租赁给他人，并从中获取利益","D":"参与涉案财产法院拍卖"},"answer":"D","sources":["《律师和律师事务所违法行为处罚办法》第12条"],"note":"《律师和律师事务所违法行为处罚办法》第12条"},{"id":60,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，律师惩戒委员会日常工作机构为设在律师协会秘书处的投诉受理查处中心，其主要职责有哪些？","options":{"A":"参与起草投诉受理查处相关规则和制度","B":"责令会员向委托人返还违规收取的律师服务费及其他费用","C":"责令会员返还违规占有的委托人提供的原始材料或者实物","D":"责令会员因利益冲突退出代理或者辞去委托"},"answer":"A","sources":["规则第14条"],"note":"规则第14条"},{"id":61,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“向司法行政部门提供虚假材料或者有其他弄虚作假行为”的违法行为对应的处罚规定有什么？","options":{"A":"由司法行政机关给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任","B":"由司法行政机关给予停止执业三个月以上六个月以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任","C":"由司法行政机关给予停止执业六个月以上一年以下的处罚，可以处五万元以上的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任","D":"由司法行政机关给予停止执业一个月以上三个月以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任。"},"answer":"A","sources":["办法第16条，律师法第49条"],"note":"办法第16条，律师法第49条"},{"id":62,"q":"律师的下列行为中，哪项属于不正当竞争？","options":{"A":"通过运营自媒体平台账号，利用互联网招揽案源","B":"在名片上展示自己的社会职务，获取当事人信任","C":"在合理的收费范围内，以相对低的报价竞争业务","D":"参加与同行的交流活动，争取与同行的合作机会"},"answer":"B","sources":["《律师职业道德和执业纪律规范》第44条"],"note":"《律师职业道德和执业纪律规范》第44条"},{"id":63,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，各省、自治区、直辖市律师协会应设立会员处分复查委员会，复查委员会应当履行下列职责","options":{"A":"受理复查申请","B":"审查申请复查事项","C":"作出复查决定","D":"提出复查申请"},"answer":"D","sources":["规则第74，77条本题答案有问题，应当为A,B,C"],"note":"规则第74，77条本题答案有问题，应当为A,B,C"},{"id":64,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，会员有以下哪些情况，不属于应当对其违法行为进行从重处分的情形？","options":{"A":"违规行为未造成严重后果的","B":"逃避、抵制和阻挠调查的","C":"对投诉人、证人和有关人员打击报复的","D":"曾因违规行为受过行业处分或受过司法行政机关行政处罚的"},"answer":"A","sources":["规则第19条"],"note":"规则第19条"},{"id":65,"q":"曾经担任法官、检察官的律师，从人民法院、人民检察院离任后（）内，不得担任诉讼代理人或者辩护人。","options":{"A":"一年","B":"二年","C":"三年","D":"五年"},"answer":"B","sources":["律师法第41条"],"note":"律师法第41条"},{"id":66,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为应当给予“停止执业六个月以上一年以下的处罚”：","options":{"A":"无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的","B":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的","C":"向法律援助受援人索要费用或者接受受援人的财物或者其他利益的","D":"在承办代理业务期间，发表、散步危害国家安全，严重扰乱法庭秩序的言论的"},"answer":"D","sources":["A,B选项出自办法第9条，属于“拒绝履行法律援助义务”C选项出自办法第10条，属于“私自接受委托、收取费用”D选项出自办法第21条，属于”发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序”"],"note":"A,B选项出自办法第9条，属于“拒绝履行法律援助义务”C选项出自办法第10条，属于“私自接受委托、收取费用”D选项出自办法第21条，属于”发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序”"},{"id":67,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，以下不属于司法行政机关对律师的违法行为从重处罚情形的是：","options":{"A":"给当事人、第三人或者社会公共利益造成重大损失的","B":"违法行为性质、情节恶劣，严重损害律师行业形象，造成恶劣社会影响的","C":"同时有两项以上违法行为或者违法涉案金额巨大的","D":"受他人胁迫实施违法行为的"},"answer":"D","sources":["办法第39条"],"note":"办法第39条"},{"id":68,"q":"我国的国旗和国歌是？我国的国徽包括什么？","options":{"A":"国旗是五星红旗，国歌是《义勇军进行曲》；国徽是镰刀锤子下的天安门，周围是谷索和齿轮","B":"国旗是五星红旗，国歌是《义勇军进行曲》；国徽是中间是五星照耀下的天安门,周围是红旗和镰刀","C":"国旗是五星红旗，国歌是《义勇军进行曲》；国徽是中间是五星照耀下的天安门，周围是谷穗和齿轮","D":"国旗是五星红旗，国歌是《义勇军进行曲》；国徽是中间是五星照耀下的天安门，周围是齿轮和镰刀"},"answer":"C","sources":["宪法第141、142条"],"note":"宪法第141、142条"},{"id":69,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪个行为属于“在同一案件中为双方当事人担任代理人，或者代理与本人及其近亲属有利益冲突的法律事务”的违法行为？","options":{"A":"同一律师事务所的两位律师经犯罪嫌疑人同意后，在同一刑事案件中分别担任不同被告人的辩护人","B":"在担任法律顾问期间，为顾问单位的控制公司提供法律服务的","C":"曾担任法官、检察官的律师，以代理人、辩护人的身份承办原任职法院、检察院之外的案件","D":"曾经担任仲裁员或者仍在担任仲裁员的律师、以代理人身份承办本人原任职或者现任职的仲裁机构办理的案件的"},"answer":"D","sources":["办法第7条"],"note":"办法第7条"},{"id":70,"q":"根据《宪法》的规定，全国人民代表大会任期届满的（）以前，全国人民代表大会常务委员会必须完成下届全国人民代表大会代表的选举？","options":{"A":"1个月","B":"2个月","C":"3个月","D":"6个月"},"answer":"B","sources":["宪法第60条"],"note":"宪法第60条"},{"id":71,"q":"全国人民代表大会任期届满的两个月以前，全国人民代表大会常务委员会必须完成下届全国人民代表大会代表的选举。如果遇到不能进行选举的非常情况，由全国人民代表大会常务委员会以全体组成人员的三分之二以上的多数通过，可以推迟选举，延长本届全国人民代表大会的任期。在非常情况结束后（）内，必须完成下届全国人民代表大会代表的选举？","options":{"A":"2年内","B":"3个月","C":"6个月","D":"1年内"},"answer":"D","sources":["宪法第60条"],"note":"宪法第60条"},{"id":72,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“向法官、检察官、仲裁员以及其他有关工作人员行贿，介绍贿赂或者指使、诱导当事人行贿”的违法行为对应的处罚规定是什么？","options":{"A":"由司法行政机关给予停止执业三个月以上六个月以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销律师执业证书；构成犯罪的，依法追究刑事责任","B":"由司法行政机关给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任","C":"由司法行政机关给予停止执业六个月以上一年以下的处罚，可以处三万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任","D":"由司法行政机关给予停止执业六个月以上一年以下的处罚，可以处十万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任"},"answer":"B","sources":["办法第15条，律师法第49条"],"note":"办法第15条，律师法第49条"},{"id":73,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，以下哪种情况不属于复查机构可以作出的复查决定？","options":{"A":"复查庭认为原处分决定认定事实清楚，责任区分适当，适用依据正确，程序合法的，应当作出维持原处分决定","B":"复查庭认为原处分决定认定事实清楚，调查、作出决定程序正当，但适用依据不当，作出的惩戒措施应予变更的；或者原处分决定存在明显笔误的，应当作出变更原处分决定","C":"复查庭认为原处分决定事实认定不清，或者调查、作出决定的程序不当的，应当作出撤销原处分决定，并发回原惩戒委员会重新作出决定","D":"复查庭认为原处分决定认定事实清楚，复查申请人提起复查申请没有事实和法律依据，应当撤销复查人的复查申请"},"answer":"D","sources":["规则第84条"],"note":"规则第84条"},{"id":74,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十一条的规定，哪一项并不属于司法行政机关对律师违法行为所实施的处罚范畴？","options":{"A":"警告","B":"行政拘留","C":"停止执业","D":"没收违法所得"},"answer":"B","sources":["办法第31条"],"note":"办法第31条"},{"id":75,"q":"根据《律师法》第五十五条的规定，没有取得律师执业证书的人员以律师名义从事法律服务业务的，应受到下列何种处罚？","options":{"A":"由所在地的市级以上地方人民政府司法行政部门责令停止非法执业，没收违法所得，处违法所得一倍以上五倍以下的罚款","B":"由所在地的省级地方人民政府司法行政部门责令停止非法执业，没收违法所得，处违法所得三倍以上五倍以下的罚款","C":"由所在地的县级以上地方人民政府司法行政部门责令停止非法执业，没收违法所得，处违法所得一倍以上五倍以下的罚款","D":"由所在地的市级以上地方人民政府司法行政部门责令停止非法执业，没收违法所得，处违法所得三倍以上五倍以下的罚款"},"answer":"C","sources":["律师法第55条"],"note":"律师法第55条"},{"id":76,"q":"根据司法部《律师和律师事务所违法行为处罚办法》的规定，律师从事以下哪种违法行为的，将会受到由司法行政机关给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚？","options":{"A":"以不正当手段承揽业务的","B":"向司法行政部门提供虚假材料或者有其他弄虚作假行为的","C":"利用提供法律服务的便利牟取当事人争议的权益","D":"拒绝履行法律援助义务的"},"answer":"C","sources":["A选项出自办法第6条、律师法第47条B选项出自办法第16条，律师法第49条C选项出自办法第12条，律师法第48条D选项出自办法第9挑，律师法第47条"],"note":"A选项出自办法第6条、律师法第47条B选项出自办法第16条，律师法第49条C选项出自办法第12条，律师法第48条D选项出自办法第9挑，律师法第47条"},{"id":77,"q":"根据《律师法》的规定，律师担任辩护人的，会见在押或者被监视居住的犯罪嫌疑人、被告人时，下列哪个材料不需要携带？","options":{"A":"身份证","B":"律师执业证书","C":"律师事务所证明和委托书","D":"法律援助公函"},"answer":"A","sources":["律师法第33条"],"note":"律师法第33条"},{"id":78,"q":"根据司法部《律师和律师事务所违法行为处罚办法》的规定，存在下列哪项情形可以不予行政处罚：","options":{"A":"受他人胁迫实施违法行为的","B":"主动消除或者减轻违法行为危害后果的","C":"主动报告，积极配合司法行政机关查处违法行为的","D":"违法行为轻微并及时纠正，没有造成危害后果的"},"answer":"D","sources":["办法第38条"],"note":"办法第38条"},{"id":79,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"在非诉讼业务中，同一律师事务所的律师同时担任彼此有利害关系的各方当事人的代理人","B":"律师和律师事务所受到通告批评处分未满一年，发布律师广告","C":"陪同当事人一起与主审法官私下沟通案件的处理","D":"以上均是"},"answer":"D","sources":["A选项出自规则第20条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项规则第31条"],"note":"A选项出自规则第20条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项规则第31条"},{"id":80,"q":"根据《律师法》的规定，关于专业法律知识人员满足哪些条件可以申请专职律师执业的回答，以下哪条是不正确的？","options":{"A":"具有高等院校本科以上学历","B":"在法律服务人员紧缺领域从事专业工作满十年","C":"具有高级职称或者同等专业水平并具有相应的专业法律知识","D":"经国务院司法行政部门考核合格"},"answer":"B","sources":["律师法第8条，需要满15年"],"note":"律师法第8条，需要满15年"},{"id":81,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，在间接利益冲突情形中，会员在收到拒绝豁免通知时已经完成了绝大部分委托业务，如果终止委托关系将造成委托人重大损失的，下列哪个选项是正确做法？","options":{"A":"与委托人沟通争取获得有效豁免","B":"实施完毕委托业务，同时确保不发生损害利益冲突当事人的后果","C":"仍继续终止委托关系","D":"停止实施委托，赔偿委托人损失"},"answer":"B","sources":["规则第8条"],"note":"规则第8条"},{"id":82,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"律师不按规定与委托人签订书面委托合同的","B":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的","C":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","D":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的"},"answer":"A","sources":["规则第27条"],"note":"规则第27条"},{"id":83,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，哪个不属于律师事务所疏于管理的情形？","options":{"A":"不按规定建立健全执业管理和其他各项内部管理制度，规范本所律师执业行为，履行监管职责，对本所律师遵守法律、法规、规章及行业规范、遵守职业道德和执业纪律的情况不予监督，发现问题未及时纠正的；受到停业整顿处罚后拒不改正，或者在停业整顿期间继续执业","B":"聘用律师或者其他工作人员，不按规定与应聘者签订聘用合同，不为其办理社会统筹保险的","C":"受到停业整顿处罚后拒不改正，或者在停业整顿期间继续执业的","D":"经批准后，擅自在住所以外的地方设立办公点、接待室"},"answer":"D","sources":["规则第39条"],"note":"规则第39条"},{"id":84,"q":"律师私自接受委托、收取费用的，情节严重的最高可以给予停止执业（）月？","options":{"A":"三个月","B":"六个月","C":"九个月","D":"十二个月"},"answer":"B","sources":["《律师和律师事务所违法行为处罚办法》第10条、律师法第48条"],"note":"《律师和律师事务所违法行为处罚办法》第10条、律师法第48条"},{"id":85,"q":"根据《宪法》的规定，下述哪一项不是中华人民共和国主席的职权？","options":{"A":"根据全国人民代表大会的决定和全国人民代表大会常务委员会的决定，公布法律;","B":"任免国务院总理、副总理、国务委员、各部部长、各委员会主任、审计长、秘书长;。","C":"派遣和召回驻外全权代表;","D":"批准和废除同外国缔结的条约和重要协定。"},"answer":"C","sources":["宪法第80、81条本题答案有问题，应当为B,C,D。A,B均需要全人大和全人常的决定；C,D均需要全人常的决定。"],"note":"宪法第80、81条本题答案有问题，应当为B,C,D。A,B均需要全人大和全人常的决定；C,D均需要全人常的决定。"},{"id":86,"q":"2014年至2015年期间，李律师在本市A律师事务所实习，并顺利取得了律师执业证。2016年，李律师跳槽到本市B律师事务所工作，并办理完毕了全部转所手续。此时，李律师发现合伙人交办的一件案件（执行程序）的委托人恰好是实习期间曾经协助处理的某件案件（一审程序）的对方当事人。根据《律师法》《律师执业管理办法》《上海律师执业利益冲突认定和处理规则》等法律规范中规定律师执业利益冲突，李律师是否能够接受该委托？","options":{"A":"李律师可在取得当事人豁免后承办该案件","B":"李律师不得承办该案件","C":"该类情况不属于法律规范中规定律师执业利益冲突，李律师可承办该案件","D":"李律师可在合伙人同意后承办该案件"},"answer":"B","sources":["23年利冲规则第10条"],"note":"23年利冲规则第10条"},{"id":87,"q":"根据《宪法》的规定，我国基本经济制度是什么？","options":{"A":"私有制为主体，多种所有制经济共同发展","B":"公有制和私有制并重，但私有制为主","C":"公有制为主体，多种所有制经济共同发展","D":"国家控制所有经济活动，不允许私有经济存在"},"answer":"C","sources":["宪法第6条"],"note":"宪法第6条"},{"id":88,"q":"根据《宪法》的规定，对于国家机关和国家工作人员的违法失职行为，我国公民可以行使哪些权利？","options":{"A":"有向有关国家机关提出申诉、控告或者检举的权利，但是不得捏造或者歪曲事实进行诬告陷害","B":"有依照法律规定取得赔偿的权利","C":"批评和建议的权利","D":"批评或检举的权利 注意单多选"},"answer":"A","sources":["宪法第41条"],"note":"宪法第41条"},{"id":89,"q":"根据宪法和法律的规定，享有人身特别保护权的人大代表包括","options":{"A":"各级人大代表","B":"全国人大代表","C":"省级以上人大代表","D":"县级以上人大代表"},"answer":"B","sources":["宪法第74条"],"note":"宪法第74条"},{"id":90,"q":"根据全国律协《律师职业道德和执业纪律规范》的规定，律师可以在名片上印有以下哪项内容？","options":{"A":"律师业职称","B":"社会职务","C":"学术成果","D":"曾获荣誉"},"answer":"A","sources":["规范第44条"],"note":"规范第44条"},{"id":91,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第二十条的规定，下列哪一行为属于律师“煽动、教唆当事人采取扰乱公共秩序、危害公共安全等非法手段解决争议的”违法行为：","options":{"A":"教唆当事人采取非法集会、游行示威的非法手段抗拒执法活动","B":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","C":"阻止委托人或者其他诉讼参与人出庭，致使诉讼、仲裁活动不能正常进行的","D":"与对方当事人或者第三人恶意串通、暗中配合，妨碍委托人合法行使权利的"},"answer":"A","sources":["A选项出自规范第20条B选项出自规范第19条，属于“扰乱法庭秩序”的行为C选项出自规范第19条，属于“扰乱法庭秩序”的行为D选项出自规范第18条，属于”与对方当事人或第三方恶意串通“的行为"],"note":"A选项出自规范第20条B选项出自规范第19条，属于“扰乱法庭秩序”的行为C选项出自规范第19条，属于“扰乱法庭秩序”的行为D选项出自规范第18条，属于”与对方当事人或第三方恶意串通“的行为"},{"id":92,"q":"以下哪项不属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"拟接受委托人委托的律师已经明知诉讼相对方或利益冲突方已委聘的律师是自己的近亲属或其他利害关系人，仍然继续代理，且未取得双方豁免","B":"隐瞒代理工作的进展情况","C":"明显低于同业的收费水平竞争某项法律事务","D":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的"},"answer":"D","sources":["A选项出自规则第21条B选项可能出自律师法原则的引申（未找到条文）C选项出自《上海市律师协会律师执业行为规范》第106条"],"note":"A选项出自规则第21条B选项可能出自律师法原则的引申（未找到条文）C选项出自《上海市律师协会律师执业行为规范》第106条"},{"id":93,"q":"关于民族自治地方的自治机关，下列哪项说法是错误的？","options":{"A":"民族自治地方的自治机关在执行上级国家机关的决议时，如有不适合民族自治地方实际情况的，可以变通执行或者停止执行","B":"自治区主席、自治州州长、自治县县长由实行区域自治的民族的公民担任","C":"民族自治地方的自治机关可以自主制定具有法律效力的民族自治条例","D":"民族自治地方的自治机关在国家计划的指导下，自主地安排和管理地方性的经济建设事业"},"answer":"C","sources":["选项A出自《中华人民共和国民族区域自治法》第20条选项B出自宪法第114条选项C出自宪法第116条，需批准后生效选项D出自宪法第118条"],"note":"选项A出自《中华人民共和国民族区域自治法》第20条选项B出自宪法第114条选项C出自宪法第116条，需批准后生效选项D出自宪法第118条"},{"id":94,"q":"根据《宪法》的规定，以下机构中，哪个机构可以“选举最高人民法院院长、最高人民检察院检察长”？","options":{"A":"最高人民检察院","B":"全国人民代表大会","C":"最高人民法院","D":"国务院"},"answer":"B","sources":["宪法第62条"],"note":"宪法第62条"},{"id":95,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“给予吊销其律师执业证书的处罚”：","options":{"A":"在律师事务所执业的同时又在其他律师事务所或者社会法律服务机构执业的","B":"以支付介绍费、给予回扣、许诺提供利益等方式承揽业务的","C":"担任法律顾问期间，为与顾问单位有利益冲突的当事人提供法律服务的","D":"与对方当事人或者第三人恶意串通、暗中配合，妨碍委托人合法行使权利的"},"answer":"D","sources":["选项A出自办法第5条选项B出自办法第6条选项C出自办法第7条选项D出自办法第18条"],"note":"选项A出自办法第5条选项B出自办法第6条选项C出自办法第7条选项D出自办法第18条"},{"id":96,"q":"以下哪项不属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"对本人或者其他律师正在办理的案件进行歪曲、有误导性的宣传和评论，恶意炒作案件","B":"贬低同行的专业能力和水平等方式，招揽业务","C":"明显低于同业的收费水平竞争某项法律事务","D":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的"},"answer":"D","sources":["A选项出自规则第34条B选项出自《上海市律师协会律师执业行为规范》第107条C选项出自《上海市律师协会律师执业行为规范》第106条"],"note":"A选项出自规则第34条B选项出自《上海市律师协会律师执业行为规范》第107条C选项出自《上海市律师协会律师执业行为规范》第106条"},{"id":97,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，在参加律师执业年度考核、执业评价、评先创优活动中，提供不实、虚假、伪造的材料或者有其他弄虚作假行为的，属于哪种违法行为？","options":{"A":"“利用提供法律服务的便利牟取当事人争议的权益的”违法行为","B":"“向司法行政部门提供虚假材料或者有其他弄虚作假行为”的违法行为","C":"私自接受委托、收取费用，接受委托人财物或者其他利益的”违法行为","D":"“以不正当手段承揽业务”的违法行为"},"answer":"B","sources":["办法第16条"],"note":"办法第16条"},{"id":98,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的","B":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","C":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的","D":"贬低同行的专业能力和水平等方式，招揽业务"},"answer":"D","sources":["D选项出自《上海市律师协会律师执业行为规范》第107条"],"note":"D选项出自《上海市律师协会律师执业行为规范》第107条"},{"id":99,"q":"根据《律师法》的规定，律师协会章程应报以下哪一个部门备案：","options":{"A":"全国人民代表大会","B":"国务院司法行政部门","C":"国务院或同级司法行政部门","D":"全国律师协会"},"answer":"C","sources":["律师法第44条"],"note":"律师法第44条"},{"id":100,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"通过发表学术论文、案例分析、专题解答、授课、普及法律等活动，宣传自己的专业领域","B":"私自向委托人收取费用","C":"不泄露当事人的商业秘密或者个人隐私","D":"不对当事人作出承诺"},"answer":"B","sources":["规则第27条"],"note":"规则第27条"},{"id":101,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》，律师在担任法律顾问期间，下列哪种行为是违规的？","options":{"A":"为顾问单位提供法律咨询","B":"代理顾问单位进行诉讼","C":"为顾问单位的对方当事人代理、辩护","D":"帮助顾问单位审查合同"},"answer":"C","sources":["规则第20条"],"note":"规则第20条"},{"id":102,"q":"以下哪一项不属于司法部《律师和律师事务所违法行为处罚办法》中规定的律师事务所“从事法律服务以外的经营活动的”违法行为？","options":{"A":"以独资方式兴办企业，并委派律师担任企业法定代表人","B":"为客户提供法律咨询的同时，也为客户就基础的税务问题进行解答","C":"与他人合资兴办企业，并委派律师担任总经理职务","D":"律师事务所投资开设餐厅，并由律师负责日常管理"},"answer":"B","sources":["办法第25条"],"note":"办法第25条"},{"id":103,"q":"以下哪一条不属于全国律协《律师职业道德和执业纪律规范》规定的律师职业道德的基本准则？","options":{"A":"应当珍视和维护律师职业声誉，模范遵守社会公德，注重陶冶品行和职业道德修养","B":"应当尊重同行，同业互助，公平竞争，共同提高执业水平","C":"应当积极参加社会公益活动","D":"应当遵守诉讼规则和法庭纪律"},"answer":"D","sources":["出自规范第7、9、12条"],"note":"出自规范第7、9、12条"},{"id":104,"q":"以下哪项不属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"拟接受委托人委托的律师已经明知诉讼相对方或利益冲突方已委聘的律师是自己的近亲属或其他利害关系人，仍然继续代理，且未取得双方豁免","B":"在名片上印有各种学术、学历、非律师业职称、社会职务以及所获荣誉","C":"在非诉讼业务中，同一律师事务所的律师同时担任彼此有利害关系的各方当事人的代理人","D":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的"},"answer":"D","sources":["A选项出自规则第21条B选项出自《律师执业道德和执业纪律规范》第44条C选项出自规则第20条D选项出自规则第27条"],"note":"A选项出自规则第21条B选项出自《律师执业道德和执业纪律规范》第44条C选项出自规则第20条D选项出自规则第27条"},{"id":105,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“给予吊销其律师执业证书的处罚”：","options":{"A":"在律师事务所执业的同时又在其他律师事务所或者社会法律服务机构执业的","B":"在承办代理、辩护业务期间，恶意诽谤法官及第三人，严重扰乱法庭秩序的言论的","C":"以支付介绍费、给予回扣、许诺提供利益等方式承揽业务的","D":"担任法律顾问期间，为与顾问单位有利益冲突的当事人提供法律服务的"},"answer":"B","sources":["A选项出自办法第5条，属于“同时在2个以上律所执业”B选项出自办法第21条，属于“发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序”C选项出自办法第6条，属于“以不正当手段承揽业务”D选项出自办法第7条，属于“违反利冲”"],"note":"A选项出自办法第5条，属于“同时在2个以上律所执业”B选项出自办法第21条，属于“发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序”C选项出自办法第6条，属于“以不正当手段承揽业务”D选项出自办法第7条，属于“违反利冲”"},{"id":106,"q":"根据我国宪法和法律，下列关于全国人民代表大会代表权利与义务的表述，错误的有","options":{"A":"全国人大代表有义务模范地遵守宪法和法律，协助宪法和法律的实施","B":"全国人大闭会期间，监察机关无需经全国人大常委会许可，即可逮捕全国人大代表","C":"全国人大代表执行代表职务时，国家根据需要给予其适当的补贴和物质上的便利","D":"全国人大代表应同原选举单位和人民保持密切联系，可列席原选举单位的人民代表大会会议"},"answer":"B","sources":["A选项出自宪法第76条B选项出自宪法第74条C选项出自《代表法》第34条（代表法现有修正草案（2024年11月公布，未落地），第34条改为第40条，本题选项为草案原文）D选项出自《全国人民代表大会组织法》第44条"],"note":"A选项出自宪法第76条B选项出自宪法第74条C选项出自《代表法》第34条（代表法现有修正草案（2024年11月公布，未落地），第34条改为第40条，本题选项为草案原文）D选项出自《全国人民代表大会组织法》第44条"},{"id":107,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十九条的规定，下列哪一行为不属于律师“扰乱法庭、仲裁庭秩序，干扰诉讼、仲裁活动的正常进行”的违法行为？","options":{"A":"在法庭、仲裁庭上发表或者指使、诱导委托人发表扰乱诉讼、仲裁活动正常进行的言论的","B":"阻止委托人或者其他诉讼参与人出庭，致使诉讼、仲裁活动不能正常进行的","C":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","D":"故意向司法机关、行政机关或者仲裁机构提交虚假证据，或者指使、威胁、利诱他人提供虚假证据的"},"answer":"D","sources":["D选项出自办法第17条，属于“故意提供虚假证据”"],"note":"D选项出自办法第17条，属于“故意提供虚假证据”"},{"id":108,"q":"根据司法部《律师和律师事务所违法行为处罚办法》的规定，律师“泄漏商业秘密或者个人隐私”的违法行为对应的处罚规定是什么？","options":{"A":"由司法行政机关给予警告，可以处五千元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以下的处罚","B":"由司法行政机关给予警告，可以处二万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业六个月以上一年以下的处罚","C":"由司法行政机关给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚","D":"由司法行政机关给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任。"},"answer":"C","sources":["办法第13条，律师法第48条"],"note":"办法第13条，律师法第48条"},{"id":109,"q":"关于我国宪法的修改，下列哪一说法是正确的？","options":{"A":"宪法修改的通过和公布程序与普通法律的制定程序相同","B":"宪法修正案应由全国人民代表大会常务委员会公布施行","C":"宪法的修改必须由全国人民代表大会以全体代表的三分之二以上的多数通过","D":"宪法的修改草案在提请全国人民代表大会审议通过后，即具有法律效力"},"answer":"C","sources":["宪法第64条"],"note":"宪法第64条"},{"id":110,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"隐瞒代理工作的进展情况","B":"利用媒体、广告或者其他方式进行不真实或者不适当宣传的","C":"陪同当事人一起与主审法官私下沟通案件的处理","D":"以上均是"},"answer":"D","sources":["A选项可能出自律师法原则的引申（未找到条文）B选项出自规则第29条C选项出自《律师执业道德和执业纪律规范》第20条"],"note":"A选项可能出自律师法原则的引申（未找到条文）B选项出自规则第29条C选项出自《律师执业道德和执业纪律规范》第20条"},{"id":111,"q":"客户委托李律师代理一起房屋买卖纠纷案，在代理过程中，李律师发现客户很难胜诉，并将事实及法律依据告知了客户。客户得知该情况后，表示希望李律师继续为其代理此案件并且答应李律师在取得了该争议房屋所有权后将房屋便宜转卖给李律师。按照《律师执业行为规范》的规定，该情形李律师应该如何处理？","options":{"A":"李律师告知客户在执业的过程中，律师不得与委托人争议的权益产生经济上的联系，不得与委托人约定胜诉后将争议标的物出售给自己，并表示自己不会接受此房屋的转让","B":"向客户表示愿意接受房屋","C":"向客户保证案件可以胜诉","D":"拒绝客户的所有要求"},"answer":"A","sources":["规范第46条"],"note":"规范第46条"},{"id":112,"q":"律师与委托人之间，下列哪个说法是错误的？","options":{"A":"律师不应接受自己不能办理的法律事务","B":"律师应当遵循诚实守信的原则，客观地告知委托人所委托事项可能出现的法律风险，不得故意对可能出现的风险做不恰当的表述或做虚假承诺","C":"为维护委托人的合法权益，律师有权根据法律的要求和道德的标准，选择完成或实现委托目的的方法","D":"对委托人拟委托的事项或者要求属于法律或律师执业规范所禁止的，律师应告知委托人并提出修改建议，但不得予以拒绝"},"answer":"D","sources":["无具体法律条文"],"note":"无具体法律条文"},{"id":113,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"隐瞒代理工作的进展情况","B":"利用媒体、广告或者其他方式进行不真实或者不适当宣传的","C":"拟接受委托人委托的律师已经明知诉讼相对方或利益冲突方已委聘的律师是自己的近亲属或其他利害关系人，仍然继续代理，且未取得双方豁免","D":"以上均是"},"answer":"D","sources":["A选项可能出自律师法原则的引申（未找到条文）B选项出自规则第29条C选项出自规则第21条"],"note":"A选项可能出自律师法原则的引申（未找到条文）B选项出自规则第29条C选项出自规则第21条"},{"id":114,"q":"下列哪一选项不属于全国律协《律师职业道德和执业纪律规范》规定的监督律师执业行为的主体？","options":{"A":"司法行政机关","B":"律师协会","C":"人民法院及人民检察院","D":"社会公众"},"answer":"C","sources":["出自规范第3条"],"note":"出自规范第3条"},{"id":115,"q":"以下哪项不属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"对本人或者其他律师正在办理的案件进行歪曲、有误导性的宣传和评论，恶意炒作案件","B":"隐瞒代理工作的进展情况","C":"明显低于同业的收费水平竞争某项法律事务","D":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的"},"answer":"D","sources":["A选项出自规则第34条B选项可能出自律师法原则的引申（未找到条文）C选项出自《上海市律师协会律师执业行为规范》第106条"],"note":"A选项出自规则第34条B选项可能出自律师法原则的引申（未找到条文）C选项出自《上海市律师协会律师执业行为规范》第106条"},{"id":116,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“构成犯罪，依法追究刑事责任”：","options":{"A":"无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的","B":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的","C":"向法律援助受援人索要费用或者接受受援人的财物或者其他利益的","D":"在执业期间，支持、参与、实施以危害国家安全为目的的活动的"},"answer":"D","sources":["A选项出自办法第9条B选项出自办法第9条C选项出自办法第10条D选项出自办法第21条"],"note":"A选项出自办法第9条B选项出自办法第9条C选项出自办法第10条D选项出自办法第21条"},{"id":117,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师哪些行为不属于“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案”的违法行为？","options":{"A":"在承办代理、辩护业务期间，以影响案件办理结果为目的，在非工作时间、非工作场所会见法官、检察官、仲裁员或者其他有关工作人员的","B":"利用与法官、检察官、仲裁员或者其他有关工作人员的特殊关系，影响依法办理案件的","C":"以对案件进行歪曲、不实、有误导性的宣传或者诋毁有关办案机关和工作人员以及对方当事人声誉等方式，影响依法办理案件的","D":"在承办代理、辩护业务期间，因法官、检察官、仲裁员与律师存在亲属关系，主动向人民法院、人民检察院或仲裁委员会申请回避的"},"answer":"D","sources":["A、B、C选项出自办法第14条"],"note":"A、B、C选项出自办法第14条"},{"id":118,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师庭审仪表规范要求的？","options":{"A":"律师担任辩护人参加法庭审理，必须按照中华全国律师协会的规定着律师袍","B":"律师担任代理人参加法庭审理，必须按照中华全国律师协会的规定着律师袍","C":"在出庭时，女律师禁止佩戴首饰","D":"在出庭时，男律师禁止留披肩长发"},"answer":"C","sources":["A、B出自规范第121条C、D出自规范第123条"],"note":"A、B出自规范第121条C、D出自规范第123条"},{"id":119,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十八条的规定，下列哪一行为不属于律师“接受对方当事人财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人权益的”违法行为","options":{"A":"向对方当事人或者第三人提供不利于委托人的信息或者证据材料的","B":"与对方当事人或者第三人恶意串通、暗中配合，妨碍委托人合法行使权利的","C":"接受对方当事人财物或者其他利益，故意延误、懈怠或者不依法履行代理、辩护职责，给委托人及委托事项的办理造成不利影响和损失的","D":"教唆对方当事人与现任律师解除委托关系的"},"answer":"D","sources":["A、B、C均出自第18条D选项为合法行为"],"note":"A、B、C均出自第18条D选项为合法行为"},{"id":120,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，在申请变更执业机构、办理执业终止、注销等手续时，提供不实、虚假、伪造的材料的，属于哪种违法行为？","options":{"A":"“私自接受委托、收取费用，接受委托人财物或者其他利益的”违法行为","B":"“以不正当手段承揽业务”的违法行为","C":"“利用提供法律服务的便利牟取当事人争议的权益的”违法行为","D":"“向司法行政部门提供虚假材料或者有其他弄虚作假行为”的违法行为"},"answer":"D","sources":["办法第16条"],"note":"办法第16条"},{"id":121,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，以装修住宅、报销个人费用、资助旅游娱乐等方式向法官、检察官、仲裁员以及其他工作人员行贿的，属于《律师法》规定的何种违法行为？","options":{"A":"“扰乱法庭、仲裁庭秩序，干扰诉讼、仲裁活动的正常进行”的违法行为","B":"“向法官、检察官、仲裁员以及其他有关工作人员行贿，介绍贿赂或者指使、诱导当事人行贿”的违法行为","C":"“律师以不正当手段承揽业务”的违法行为","D":"“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案”的违法行为"},"answer":"B","sources":["办法第15条"],"note":"办法第15条"},{"id":122,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第二十一条的规定，下列哪一行为属于律师“发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序的言论的”违法行为：","options":{"A":"在承办代理、辩护业务期间，恶意诽谤法官及第三人，严重扰乱法庭秩序的言论的","B":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","C":"阻止委托人或者其他诉讼参与人出庭，致使诉讼、仲裁活动不能正常进行的","D":"向对方当事人或者第三人提供不利于委托人的信息或者证据材料的"},"answer":"A","sources":["A选项出自办法第21条B选项出自办法第19条C选项出自办法第19条D选项出自办法第18条"],"note":"A选项出自办法第21条B选项出自办法第19条C选项出自办法第19条D选项出自办法第18条"},{"id":123,"q":"根据《律师法》的规定，申请人具有以下哪个情形，不属于司法行政部门不予颁发律师执业证书的范畴？","options":{"A":"无民事行为能力或者限制民事行为能力的","B":"受过刑事处罚的，但过失犯罪的除外","C":"被开除公职或者被吊销律师执业证书的","D":"因轻微违法行为曾接受过行政处罚的"},"answer":"D","sources":["律师法第7条"],"note":"律师法第7条"},{"id":124,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十九条的规定，下列哪一行为不属于律师“扰乱法庭、仲裁庭秩序，干扰诉讼、仲裁活动的正常进行”的违法行为？","options":{"A":"在法庭、仲裁庭上发表或者指使、诱导委托人发表扰乱诉讼、仲裁活动正常进行的言论的","B":"阻止委托人或者其他诉讼参与人出庭，致使诉讼、仲裁活动不能正常进行的","C":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","D":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的"},"answer":"D","sources":["A、B、C出自办法第19条D选项出自办法第9条"],"note":"A、B、C出自办法第19条D选项出自办法第9条"},{"id":125,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，下列哪种情形不属于间接的利益冲突？","options":{"A":"在刑事案件中，律师事务所律师担任犯罪嫌疑人(被告人)的辩护人，而同一律师事务所的其他律师是该案件被害人的近亲属","B":"在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中对方当事人的近亲属","C":"在刑事案件中，律师事务、律师担任犯罪嫌疑人（被告人）的辩护人，而同一律师事务所的其他律师是该案件的被害人","D":"同一律师事务所代理当事人的对抗性案件或非诉讼业务，又违反与当事人的约定代理该当事人主要竞争对手的对抗性案件或非诉讼业务"},"answer":"C","sources":["根据19年规则，C选项为直接利冲根据23年规则，A、B、D选项为相对利冲，C为绝对利冲"],"note":"根据19年规则，C选项为直接利冲根据23年规则，A、B、D选项为相对利冲，C为绝对利冲"},{"id":126,"q":"在没有金融产品经营资质的情况下，客户要求李律师、张律师对于客户与消费者签订的金融产品销售合同提供律师见证服务，且客户与消费者均书面同意在见证书中明确写明律师见证仅就签署合同的行为进行见证，不要求律师对交易的实质承担审查义务。按照《律师见证业务工作细则》和《上海市律师见证业务操作指引》，该情形李律师、张律师应该如何处理？","options":{"A":"按照客户要求，仅就签署合同的行为进行见证","B":"对交易的实质承担审查义务","C":"不予见证，且报律师事务所批准，拒绝出具法律见证书","D":"在法律见证书中写明免责条款"},"answer":"C","sources":["细则第18条"],"note":"细则第18条"},{"id":127,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第二十一条的规定，下列哪一行为属于律师“发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序的言论的”违法行为：","options":{"A":"在承办代理业务期间，发表、散播危害国家安全，严重扰乱法庭秩序的言论的","B":"教唆当事人采取游行示威的非法手段抗拒执法活动","C":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","D":"利用媒体煽动当事人以扰乱公共秩序的手段干扰诉讼活动正常进行"},"answer":"A","sources":["A选项出自办法第21条B选项出自办法第20条C选项出自办法第19条D选项出自办法第20条"],"note":"A选项出自办法第21条B选项出自办法第20条C选项出自办法第19条D选项出自办法第20条"},{"id":128,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的","B":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","C":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的","D":"拟接受委托人委托的律师已经明知诉讼相对方或利益冲突方已委聘的律师是自己的近亲属或其他利害关系人，仍然继续代理，且未取得双方豁免"},"answer":"D","sources":["规则第6条"],"note":"规则第6条"},{"id":129,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪一行为不属于“向司法行政部门提供虚假材料或者有其他弄虚作假行为”的违法行为？","options":{"A":"在参加律师执业年度考核、执业评价、评先创优活动中，提供不实、虚假、伪造的材料或者有其他弄虚作假行为的","B":"在司法行政机关实施检查、监督工作中，向其隐瞒真实情况，拒不提供或者提供不实、虚假材料，或者隐匿、毁灭、伪造证据材料的","C":"在律师事务所执业的同时又在其他律师事务所或者社会法律服务机构执业的","D":"在申请变更执业机构、办理执业终止、注销等手续时，提供不实、虚假、伪造的材料的"},"answer":"C","sources":["C选项出自办法第5条，属于“同时在2个律所职业”"],"note":"C选项出自办法第5条，属于“同时在2个律所职业”"},{"id":130,"q":"关于公共财产，下列说法不符合我国《宪法》规定的是","options":{"A":"社会主义的公共财产神圣不可侵犯，国家保护社会主义的公共财产","B":"国家为了需要，可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿","C":"公民的合法的私有财产不受侵犯，国家依照法律规定保护公民的私有财产权和继承权","D":"中华人民共和国公民必须遵守宪法和法律，保守国家秘密，爱护公共财产"},"answer":"B","sources":["宪法第13条"],"note":"宪法第13条"},{"id":131,"q":"以下哪项不属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"拟接受委托人委托的律师已经明知诉讼相对方或利益冲突方已委聘的律师是自己的近亲属或其他利害关系人，仍然继续代理，且未取得双方豁免","B":"律师和律师事务所受到通告批评处分未满一年，发布律师广告","C":"在非诉讼业务中，同一律师事务所的律师同时担任彼此有利害关系的各方当事人的代理人","D":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的"},"answer":"D","sources":["A选项出自规则第21条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项出自规则第20条"],"note":"A选项出自规则第21条B选项出自《上海市律师协会律师执业行为规范(试行)》第37条C选项出自规则第20条"},{"id":132,"q":"根据《宪法》的规定，由于国家机关和国家工作人员侵犯公民权利而受到损失的公民，拥有什么权利？","options":{"A":"有依照法律规定取得赔偿的权利","B":"批评和建议的权利","C":"申诉、控告或者检举的权利","D":"不被压制和打击报复的权利"},"answer":"A","sources":["宪法第41条"],"note":"宪法第41条"},{"id":133,"q":"律师私自接受委托、收取费用的，最高可以罚款（）元？","options":{"A":"2000元","B":"5000元","C":"10000元","D":"50000元"},"answer":"C","sources":["《律师和律师事务所违法行为处罚办法》第10条、律师法第48条"],"note":"《律师和律师事务所违法行为处罚办法》第10条、律师法第48条"},{"id":134,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的","B":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","C":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的","D":"在非诉讼业务中，同一律师事务所的律师同时担任彼此有利害关系的各方当事人的代理人"},"answer":"D","sources":["规则第20条"],"note":"规则第20条"},{"id":135,"q":"根据《宪法》的规定，下列哪一项不一定属于我国人大代表实施直接选举的范围?","options":{"A":"县人民代表大会","B":"市人民代表大会","C":"市辖区人民代表大会","D":"乡、镇人民代表大会"},"answer":"B","sources":["宪法第97条因为不设区的市才是直接选举，设区的市是间接选举"],"note":"宪法第97条因为不设区的市才是直接选举，设区的市是间接选举"},{"id":136,"q":"下列哪一选项属于全国律协《律师职业道德和执业纪律规范》规定的律师在执业机构中的纪律？","options":{"A":"律师不得以个人名义私自接受委托，不得私自收取费用","B":"律师不得在同一案件中为双方当事人担任代理人。同一律师事务所不得代理诉讼案件的双方当事人，偏远地区只有一律师事务所的除外","C":"律师不得从对方当事人处接受利益或向其要求或约定利益","D":"律师应当合理开支办案费用，注意节约"},"answer":"A","sources":["规范第16条其他3个也出自这个规范，但不属于“在执业机构中的纪律”"],"note":"规范第16条其他3个也出自这个规范，但不属于“在执业机构中的纪律”"},{"id":137,"q":"根据《宪法》的规定，劳动者有休息的权利。以下关于休息权的体现，错误的是？","options":{"A":"国家发展劳动者休息和休养的设施","B":"国家规定职工的工作时间","C":"国家通过各种途径，改善劳动条件","D":"国家规定职工的休假制度"},"answer":"C","sources":["宪法第43条"],"note":"宪法第43条"},{"id":138,"q":"根据司法部《律师和律师事务所违法行为处罚办法》的规定，律师从事以下哪种违法行为的，将会受到由司法行政机关给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚？","options":{"A":"同时在两个以上律师事务所执业的","B":"向法官、检察官、仲裁员以及其他有关工作人员行贿，介绍贿赂或者指使、诱导当事人行贿的","C":"扰乱法庭、仲裁庭秩序，干扰诉讼、仲裁活动的正常进行的","D":"泄漏商业秘密或者个人隐私"},"answer":"D","sources":["A选项出自办法第5条B选项出自办法第15条C选项出自办法第19条D选项出自办法第13条"],"note":"A选项出自办法第5条B选项出自办法第15条C选项出自办法第19条D选项出自办法第13条"},{"id":139,"q":"王律师担任甲公司的常年法律顾问。后甲公司因拖欠货款被起诉后，要委托王律师作代理人。同时甲公司的主要竞争对手乙公司也想请王律师担任常年法律顾问，该情形王律师应该如何处理？","options":{"A":"同时接受两家公司的委托","B":"在征得甲乙公司的书面同意后，接受委托","C":"只能接受其中一家公司的委托","D":"不得接受甲乙公司任意一方的委托"},"answer":"B","sources":["“主要竞争对手”这一概念已被23年利冲规则舍弃，故本题使用的是19年规则，系间接利冲。根据23年规则，要看乙公司与甲公司是否有利益冲突，如果有则为绝对利冲，如果没有则为相对利冲"],"note":"“主要竞争对手”这一概念已被23年利冲规则舍弃，故本题使用的是19年规则，系间接利冲。根据23年规则，要看乙公司与甲公司是否有利益冲突，如果有则为绝对利冲，如果没有则为相对利冲"},{"id":140,"q":"根据我国宪法规定，公民的（）私有财产不受侵犯","options":{"A":"合法的","B":"个人","C":"一切","D":"非法的"},"answer":"A","sources":["宪法第13条"],"note":"宪法第13条"},{"id":141,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十七条的规定，下列哪一行为不属于律师“故意提供虚假证据或者威胁、利诱他人提供虚假证据，妨碍对方当事人合法取得证据的”违法行为：","options":{"A":"故意向司法机关、行政机关或者仲裁机构提交虚假证据，或者指使、威胁、利诱他人提供虚假证据的","B":"指示或者帮助委托人或者他人伪造、隐匿、毁灭证据，指使或者帮助犯罪嫌疑人、被告人串供，威胁、利诱证人不作证或者作伪证的","C":"妨碍对方当事人及其代理人、辩护人合法取证的，或者阻止他人向案件承办机关或者对方当事人提供证据的","D":"以支付介绍费、给予回扣、许诺提供利益等方式承揽业务的"},"answer":"D","sources":["A、B、C出自办法第17条D选项出自办法第6条，属于“以不正当手段承揽业务”"],"note":"A、B、C出自办法第17条D选项出自办法第6条，属于“以不正当手段承揽业务”"},{"id":142,"q":"根据《宪法》的规定，下列哪一项正确反映了法律的平等性？","options":{"A":"只有部分中华人民共和国公民在法律面前平等","B":"只有特定群体才能在法律面前享有平等权利","C":"凡具有中华人民共和国国籍的人都是中华人民共和国公民，中华人民共和国公民在法律面前一律平等","D":"外国人在法律面前与中华人民共和国公民享有同等权利"},"answer":"C","sources":[],"note":""},{"id":143,"q":"根据《宪法》的规定，我国国家机构的运行实行什么原则？","options":{"A":"民主集中制","B":"社会主义法治","C":"依法治国","D":"为人民服务"},"answer":"A","sources":["宪法第3条"],"note":"宪法第3条"},{"id":144,"q":"根据《宪法》的规定，下列哪一项描述了宪法的崇高地位？","options":{"A":"地方性法规可以与宪法有小部分不一致之处","B":"国家机关和武装力量、各政党和各社会团体、各企业事业组织都必须遵守宪法和法律","C":"某些组织可以拥有超越宪法和法律的特权","D":"只有法律行为才必须遵守宪法，不包括行政法规。"},"answer":"B","sources":[],"note":""},{"id":145,"q":"根据《宪法》的规定，国家发展劳动者休息和休养的设施。这体现的是劳动者的什么权利？","options":{"A":"平等就业的权利","B":"休息的权利","C":"退休的权利","D":"获得物质帮助的权利"},"answer":"B","sources":[],"note":""},{"id":146,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十八条的规定，下列哪一行为属于律师“接受对方当事人财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人权益的”违法行为：","options":{"A":"向对方当事人或者第三人提供不利于委托人的信息或者证据材料的","B":"故意向司法机关、行政机关或者仲裁机构提交虚假证据，或者指使、威胁、利诱他人提供虚假证据的","C":"在申请变更执业机构、办理执业终止、注销等手续时，提供不实、虚假、伪造的材料的","D":"利用与法官、检察官、仲裁员或者其他有关工作人员的特殊关系，影响依法办理案件的"},"answer":"A","sources":["A选项出自办法第18条B选项出自办法第17条C选项出自办法第16条D选项出自办法第14条"],"note":"A选项出自办法第18条B选项出自办法第17条C选项出自办法第16条D选项出自办法第14条"},{"id":147,"q":"根据《律师法》《律师执业管理办法》《上海律师执业利益冲突认定和处理规则》等法律规范中规定律师执业利益冲突，下列行为属于法律规定的利益冲突情形的是？","options":{"A":"在某一非诉案件中，在各方当事人均同意的情况下，委托李律师为各方的代理人","B":"某企业向李律师发出招标文件，邀请李律师参与投标企业新一年度常年法律顾问。而李律师所在律所的张律师是该企业以往的常年法律顾问","C":"陈律师在结束代理当事人的对抗性案件或非诉讼委托业务后两年后，担任该当事人在对抗性案件或非诉讼业务中对方当事人的代理人","D":"李律师正代表一名员工与某企业进行一起劳动争议诉讼案件，而某企业委托与李律师同所的张律师作为发行企业债券的律师"},"answer":"D","sources":[],"note":""},{"id":148,"q":"根据《宪法》，如果出现违反宪法和法律的行为，应该如何处理？","options":{"A":"视情况而定","B":"必须予以追究","C":"某些组织可以由当事人自行处理","D":"可以不予处理"},"answer":"B","sources":[],"note":""},{"id":149,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的","B":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","C":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的","D":"律师和律师事务所受到通告批评处分未满一年，发布律师广告"},"answer":"D","sources":["D选项出自《上海市律师协会律师执业行为规范(试行)》第37条"],"note":"D选项出自《上海市律师协会律师执业行为规范(试行)》第37条"},{"id":150,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“构成犯罪，依法追究刑事责任”：","options":{"A":"无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的","B":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的","C":"向法律援助受援人索要费用或者接受受援人的财物或者其他利益的","D":"教唆当事人采取游行示威的非法手段抗拒执法活动"},"answer":"D","sources":["A选项出自办法第9条B选项出自办法第9条C选项出自办法第10条D选项出自办法第20条"],"note":"A选项出自办法第9条B选项出自办法第9条C选项出自办法第10条D选项出自办法第20条"},{"id":151,"q":"我国宪法规定了“年满十八周岁的公民，不分民族、种族、性别、职业、家庭出身、宗教信仰、教育程度、财产状况、居住期限，都有选举权和被选举权；但是依照法律被剥夺政治权利的人除外”。根据材料回答：这句话体现了我国：","options":{"A":"人权内容的广泛性","B":"人权主体的广泛性","C":"人权的真实性","D":"人权的平等性"},"answer":"D","sources":[],"note":""},{"id":152,"q":"根据《宪法》的规定，下列一类人员不是国务院常务会议的组成人员？","options":{"A":"总理","B":"副总理","C":"国务委员","D":"国务秘书"},"answer":"D","sources":[],"note":""},{"id":153,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"隐瞒代理工作的进展情况","B":"利用媒体、广告或者其他方式进行不真实或者不适当宣传的","C":"明显低于同业的收费水平竞争某项法律事务","D":"以上均是"},"answer":"D","sources":["A选项可能出自律师法原则的引申（未找到条文）B选项出自规则第29条C选项出自《上海市律师协会律师执业行为规范》第106条"],"note":"A选项可能出自律师法原则的引申（未找到条文）B选项出自规则第29条C选项出自《上海市律师协会律师执业行为规范》第106条"},{"id":154,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"在非诉讼业务中，同一律师事务所的律师同时担任彼此有利害关系的各方当事人的代理人","B":"利用媒体、广告或者其他方式进行不真实或者不适当宣传的","C":"陪同当事人一起与主审法官私下沟通案件的处理","D":"以上均是"},"answer":"D","sources":["A选项出自规则第20条B选项出自规则第29条C选项出自规则第31条"],"note":"A选项出自规则第20条B选项出自规则第29条C选项出自规则第31条"},{"id":155,"q":"2014年至2015年期间，李律师在本市A律师事务所实习，并顺利取得了律师执业证。2016年，李律师跳槽到本市B律师事务所工作，并办理完毕了全部转所手续。此时，李律师发现合伙人交办的一件案件（执行程序）的委托人恰好是实习期间曾经协助处理的某件案件（一审程序）的对方当事人。根据《律师法》《律师执业管理办法》《上海律师执业利益冲突认定和处理规则》等法律规范中规定律师执业利益冲突，李律师的上述行为属于？","options":{"A":"李律师可在取得当事人豁免后承办该案件","B":"相对禁止的利益冲突","C":"该类情况不属于法律规范中规定律师执业利益冲突","D":"绝对禁止的利益冲突"},"answer":"D","sources":["利冲规则第十条第四项"],"note":"利冲规则第十条第四项"},{"id":156,"q":"根据《宪法》的规定，“根据宪法和法律，规定行政措施，制定行政法规，发布决定和命令”是属于哪个国家机关的职权？","options":{"A":"国务院","B":"全国人民代表大会","C":"全国人民代表大会常务委员会","D":"中华人民共和国主席"},"answer":"A","sources":[],"note":""},{"id":157,"q":"律师“拒绝履行法律援助义务”的违法行为，最高可以罚款多少元？","options":{"A":"2000元","B":"5000元","C":"10000元","D":"50000元"},"answer":"B","sources":["律师法第47条"],"note":"律师法第47条"},{"id":158,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"担任法律顾问期间，为顾问单位进行案件代理、辩护","B":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","C":"同时在两个以上律师事务所执业","D":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的"},"answer":"C","sources":["规则第37条"],"note":"规则第37条"},{"id":159,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪一行为不属于“故意提供虚假证据或者威胁、利诱他人提供虚假证据，妨碍对方当事人合法取得证据”的违法行为？","options":{"A":"故意向司法机关、行政机关或者仲裁机构提交虚假证据，或者指使、威胁、利诱他人提供虚假证据的","B":"妨碍对方当事人及其代理人、辩护人合法取证的，或者阻止他人向案件承办机关或者对方当事人提供证据的","C":"在申请变更执业机构、办理执业终止、注销等手续时，提供不实、虚假、伪造的材料的","D":"指示或者帮助委托人或者他人伪造、隐匿、毁灭证据，指使或者帮助犯罪嫌疑人、被告人串供，威胁、利诱证人不作证或者作伪证的"},"answer":"C","sources":["A、B、D出自办法第17条C选项出自办法第16条"],"note":"A、B、D出自办法第17条C选项出自办法第16条"},{"id":160,"q":"根据律师在执业机构中的纪律，下列做法不正确的是?","options":{"A":"同在一个律师事务所和一个法律服务所执业的视同在两个律师事务所执业","B":"律师作为辅庭律师（非代理人）可以私下与法院参与该案记录的办案人员谈论该案所涉法律问题","C":"律师不得违反律师事务所收费制度和财务纪律，挪用、私分、侵占业务收费","D":"律师因执业过错给律师事务所造成损失的，应当承担相应责任"},"answer":"B","sources":["A选项出自《律师职业道德和职业纪律规范》第15条C选项出自规范17条D选项出自规范第18条"],"note":"A选项出自《律师职业道德和职业纪律规范》第15条C选项出自规范17条D选项出自规范第18条"},{"id":161,"q":"下列关于全国人民代表大会代表的说法中，哪一项是正确的？","options":{"A":"全国人民代表大会代表不得同时担任国家行政机关、监察机关、审判机关、检察机关的职务社会主义制度","B":"全国人民代表大会代表有权直接决定国家的重大事务","C":"全国人民代表大会代表享有不受法律追究的特权","D":"全国人民代表大会代表由各省、自治区、直辖市人民代表大会和中国人民解放军在全国人民代表大会常务委员会的主持下选举产生"},"answer":"A","sources":[],"note":""},{"id":162,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师因违法执业受到行政处罚，且其违法行为对当事人造成了损害，律师应该如何承担责任？","options":{"A":"仅承担行政责任，无需对当事人进行赔偿","B":"仅需对当事人进行象征性赔偿","C":"依法承担相应的民事责任，对受损的当事人进行赔偿","D":"由律师事务所承担全部赔偿责任"},"answer":"C","sources":["办法第46条"],"note":"办法第46条"},{"id":163,"q":"根据《宪法》的规定，以下机构中，哪个机构可以“批准省、自治区和直辖市的建置”？","options":{"A":"最高人民检察院","B":"最高人民法院","C":"全国人民代表大会","D":"国务院"},"answer":"C","sources":[],"note":""},{"id":164,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十八条的规定，下列哪一行为属于律师“接受对方当事人财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人权益的”违法行为：","options":{"A":"采用诱导、欺骗、胁迫、敲诈等手段获取当事人与他人争议的财物、权益的","B":"与对方当事人或者第三人恶意串通、暗中配合，妨碍委托人合法行使权利的","C":"违反统一接受委托规定或者在被处以停止执业期间，私自接受委托，承办法律事务的","D":"在律师事务所统一收费外又向委托人索要其他费用、财物或者获取其他利益的"},"answer":"B","sources":["A选项出自办法第12条，属于“利用提供法律服务的便利牟取当事人争议的权益”C、D选项出自办法第10条，属于“私自接受委托、收取费用，接受委托人财物或者其他利益”"],"note":"A选项出自办法第12条，属于“利用提供法律服务的便利牟取当事人争议的权益”C、D选项出自办法第10条，属于“私自接受委托、收取费用，接受委托人财物或者其他利益”"},{"id":165,"q":"根据《宪法》的规定，国家规定职工的工作时间和休假制度。这体现的是劳动者的什么权利？","options":{"A":"劳动的权利","B":"退休的权利","C":"获得物质帮助的权利","D":"休息的权利"},"answer":"D","sources":[],"note":""},{"id":166,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，以下不属于律师协会作出的处分种类的是：","options":{"A":"公开谴责","B":"训诫","C":"警告","D":"通报批评"},"answer":"C","sources":["本体根据14年规则作出，现无正确选项"],"note":"本体根据14年规则作出，现无正确选项"},{"id":167,"q":"根据《律师法》《律师执业管理办法》《上海律师执业利益冲突认定和处理规则》等法律规范中规定律师执业利益冲突，下列行为不属于法律规定的利益冲突情形的是？","options":{"A":"共同犯罪案件中，同一律师事务所的李律师以及张律师分别同时担任两个利益冲突的犯罪嫌疑人（被告人）的辩护人","B":"某企业向李律师发出招标文件，邀请李律师参与投标企业新一年度常年法律顾问。而李律师所在律所的张律师是该企业以往的常年法律顾问","C":"陈律师在结束代理当事人的对抗性案件或非诉讼委托业务后半年之内，又担任该当事人在对抗性案件或非诉讼业务中对方当事人的代理人","D":"陈律师系某企业的常年法律顾问，与陈律师同一律师事务所的李律师在某一对抗性案件中担任该企业对方当事人的代理人"},"answer":"B","sources":[],"note":""},{"id":168,"q":"根据《宪法》的规定，以下哪个选项是全国人民代表大会常务委员会具有的职权?","options":{"A":"选举国家监察委员会主任","B":"解释法律","C":"批准省、自治区和直辖市的建置","D":"决定战争和和平的问题"},"answer":"B","sources":[],"note":""},{"id":169,"q":"根据司法部《律师和律师事务所违法行为处罚办法》的规定，以下说法正确的是：","options":{"A":"律师受到停止执业处罚期限未满的，不得申请变更执业机构","B":"受到三个月以上停止执业处罚的，不得担任合伙人","C":"执行处罚期满未愈五年的，不得担任合伙人","D":"律师受到停止执业处罚期满未愈三年的，不得申请变更执业机构"},"answer":"A","sources":["办法第47条B选项应当为6个月C选项应当为3年D选项不需要3年"],"note":"办法第47条B选项应当为6个月C选项应当为3年D选项不需要3年"},{"id":170,"q":"根据《宪法》的规定，公民取得选举权和被选举权的条件包括以下哪些？","options":{"A":"年满十六周岁","B":"年满十八周岁","C":"年满二十周岁","D":"年满二十二周岁"},"answer":"B","sources":[],"note":""},{"id":171,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“给予吊销其律师执业证书的处罚”：","options":{"A":"在律师事务所执业的同时又在其他律师事务所或者社会法律服务机构执业的","B":"以支付介绍费、给予回扣、许诺提供利益等方式承揽业务的","C":"担任法律顾问期间，为与顾问单位有利益冲突的当事人提供法律服务的","D":"利用媒体煽动当事人以扰乱公共秩序的手段干扰诉讼活动正常进行"},"answer":"D","sources":["A选项出自办法第5条B选项出自办法第6条C选项出自办法第7条D选项出自办法第20条"],"note":"A选项出自办法第5条B选项出自办法第6条C选项出自办法第7条D选项出自办法第20条"},{"id":172,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十九条的规定，下列哪一行为不属于律师“扰乱法庭、仲裁庭秩序，干扰诉讼、仲裁活动的正常进行”的违法行为？","options":{"A":"在法庭、仲裁庭上发表或者指使、诱导委托人发表扰乱诉讼、仲裁活动正常进行的言论的","B":"无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的","C":"无正当理由，当庭拒绝辩护、代理，拒绝签收司法文书或者拒绝在有关诉讼文书上签署意见的","D":"煽动、教唆他人扰乱法庭、仲裁庭秩序的"},"answer":"B","sources":["B选项出自办法第9条，属于“拒绝履行法律援助义务”"],"note":"B选项出自办法第9条，属于“拒绝履行法律援助义务”"},{"id":173,"q":"应客户要求事务所需要立即出具一份正式的法律见证书，最后需要律师签名和盖章（律师印及事务所各类印章均保存在办公室），但是其中一名经办律师恰巧不在办公室，根据《律师见证业务工作细则》和《上海市律师见证业务操作指引》的有关规定，该情形应该如何处理？","options":{"A":"由其他律师代签字","B":"仅加盖律师印即可","C":"等待经办律师方便时亲自签章","D":"用其他事务所印章代替"},"answer":"C","sources":[],"note":""},{"id":174,"q":"根据《律师法》的规定，律师事务所拟设立分所有哪些条件？","options":{"A":"成立三年以上并具有三十名以上执业律师的合伙律师事务所","B":"成立三年以上并具有二十名以上执业律师的合伙律师事务所","C":"成立五年以上并具有二十名以上执业律师的合伙律师事务所","D":"成立五年以上并具有三十名以上执业律师的合伙律师事务所"},"answer":"B","sources":[],"note":""},{"id":175,"q":"依据宪法规定，审计机关由谁负责领导？","options":{"A":"国务院分管副总理","B":"审计署长","C":"国务委员","D":"国务院总理"},"answer":"D","sources":[],"note":""},{"id":176,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，下列哪一违法行为可能“构成犯罪，依法追究刑事责任”：","options":{"A":"无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的","B":"接受指派后，懈怠履行或者擅自停止履行法律援助职责的","C":"向法律援助受援人索要费用或者接受受援人的财物或者其他利益的","D":"在法庭、仲裁庭上发表或者指使、诱导委托人发表扰乱诉讼、仲裁活动正常进行的言论的"},"answer":"D","sources":["A选项出自办法第9条B选项出自办法第9条C选项出自办法第10条D选项出自办法第19条"],"note":"A选项出自办法第9条B选项出自办法第9条C选项出自办法第10条D选项出自办法第19条"},{"id":177,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪一个属于违规行为？","options":{"A":"作为律师在法庭上客观公正地代理案件，不偏袒任何一方的","B":"作为律师在承办案件时，按照法律规定进行调查和收集证据，但某些证据最终未被法庭采纳的","C":"作为律师按照律师事务所的名义统一接受委托，并签订正式的委托代理协议的","D":"陪同当事人一起与主审法官私下沟通案件的处理"},"answer":"D","sources":["D选项规则第31条"],"note":"D选项规则第31条"},{"id":178,"q":"下列哪个行为不属于律师属于律师“私自接受委托、收取费用，接受委托人财物或者其他利益的”违法行为","options":{"A":"在被处以停止执业期间，私自接受委托，承办法律事务","B":"在律师事务所统一收费外又向委托人索要其他费用、财物或者获取其他利益","C":"向法律援助受援人索要费用或接受受援人的财物或其他利益","D":"因承接的案件在异地，在委托合作中与委托人约定异地办案差旅费用"},"answer":"D","sources":[],"note":""},{"id":179,"q":"根据《宪法》的规定，“批准省、自治区、直辖市的区域划分，批准自治州、县、自治县、市的建置和区域划分”属于哪个国家机关的职权？","options":{"A":"全国人民代表大会","B":"全国人民代表大会常务委员会","C":"国务院","D":"国家发展和改革委员会"},"answer":"C","sources":[],"note":""},{"id":180,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第二十条的规定，下列哪一行为属于律师““煽动、教唆当事人采取扰乱公共秩序、危害公共安全等非法手段解决争议的”违法行为：","options":{"A":"利用媒体煽动当事人以扰乱公共秩序的手段干扰诉讼活动正常进行","B":"煽动、教唆他人扰乱法庭、仲裁庭秩序的","C":"阻止委托人或者其他诉讼参与人出庭，致使诉讼、仲裁活动不能正常进行的","D":"向对方当事人或者第三人提供不利于委托人的信息或者证据材料的"},"answer":"A","sources":["B、C选项出自第19条，属于“扰乱法庭秩序”的行为D选项出自第18条，属于“接受对方当事人财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人权益”的行为"],"note":"B、C选项出自第19条，属于“扰乱法庭秩序”的行为D选项出自第18条，属于“接受对方当事人财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人权益”的行为"},{"id":181,"q":"根据《律师法》的规定，下述行为哪一个属于违规行为？","options":{"A":"律师承办案件时经委托人同意和授权变更委托事项、权限的","B":"因律师代理意见未被法庭采纳，原告要求律师就其损失承担赔偿责任，律师事务所拒绝的","C":"律师承办案件时提示当事人向法官送礼的","D":"律师承办业务经由律师事务所统一接受委托的"},"answer":"C","sources":[],"note":""},{"id":182,"q":"根据《律师法》第五十一条的规定，律师在受到警告处罚后一年内又发生应当给予警告处罚情形的，应如何处罚？","options":{"A":"由设区的市级或者直辖市的区人民政府司法行政部门给予停止执业一个月以上三个月以下的处罚","B":"由设区的县级或者直辖市的区人民政府司法行政部门给予停止执业三个月以上六个月以下的处罚","C":"由设区的市级或者直辖市的区人民政府司法行政部门给予停止执业六个月以上一年以下的处罚","D":"由设区的市级或者直辖市的区人民政府司法行政部门给予停止执业三个月以上一年以下的处罚"},"answer":"D","sources":[],"note":""},{"id":183,"q":"根据全国律协《律师执业道德基本准则》的规定，律师执业的根本宗旨是？","options":{"A":"为人民服务","B":"执业为民","C":"努力维护人民群众的根本利益","D":"维护公民、法人和其他组织的合法权益"},"answer":"B","sources":[],"note":""},{"id":184,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，申请人申请复查，下列哪项条件不是必须的？","options":{"A":"所申请复查的决定应当是本省、自治区、直辖市律师协会惩戒委员会或者设区的市律师协会惩戒委员会作出的","B":"申请复查的决定必须是尚未实际执行的","C":"申请复查应包括具体的复查请求、事实和证据","D":"复查申请必须在规定的期限内提出"},"answer":"B","sources":[],"note":""},{"id":185,"q":"根据《律师法》的规定，设立个人律师事务所的条件有以下哪些？","options":{"A":"有自己的名称、住所和章程","B":"有符合本法规定的律师","C":"设立人应当是具有一定的执业经历，且三年内未受过停止执业处罚的律师","D":"有符合国务院司法行政部门规定数额的资产，设立人具有五年以上执业经历的律师，设立人对律师事务所的债务承担无限责任"},"answer":"D","sources":["本题答案有问题，应当为ABCD"],"note":"本题答案有问题，应当为ABCD"},{"id":186,"q":"根据司法部《律师和律师事务所违法行为处罚办法》的规定，律师“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案”的违法行为对应的处罚规定是什么？","options":{"A":"由司法行政机关给予警告，可以处五千元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以下的处罚","B":"由司法行政机关给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚","C":"由司法行政机关给予警告，可以处二万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业六个月以上一年以下的处罚","D":"由司法行政机关给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任"},"answer":"D","sources":["律师法第49条"],"note":"律师法第49条"},{"id":187,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师和律师事务所在广告或宣传中，采用不正当手段与同行进行业务竞争？","options":{"A":"对律师或律师事务所进行不符合实际的宣传的","B":"刊印有可能被认为利用律师兼有的其他身份影响所承办业务正常处理和司法公正审理的内容的","C":"与其他律师或律师事务所的法律服务质量和收费进行比较的","D":"律师和律师事务所依法以广告方式宣传律师和律师事务所以及自己的业务领域和专业特长的"},"answer":"D","sources":["规范第105条"],"note":"规范第105条"},{"id":188,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“指示或者帮助委托人或者他人伪造、隐匿、毁灭证据，指使或者帮助犯罪嫌疑人、被告人串供，威胁、利诱证人不作证或者作伪证”，属于哪种违法行为？","options":{"A":"律师“私自接受委托、收取费用，接受委托人财物或者其他利益的”违法行为","B":"“利用提供法律服务的便利牟取当事人争议的权益的”违法行为","C":"“以不正当手段承揽业务”的违法行为","D":"“故意提供虚假证据或者威胁、利诱他人提供虚假证据，妨碍对方当事人合法取得证据”的违法行为"},"answer":"D","sources":["办法第17条"],"note":"办法第17条"},{"id":189,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师和律师事务所在广告或宣传中，采用不正当手段与同行进行业务竞争？","options":{"A":"无正当理由，以在规定收费标准以下收费为条件吸引客户的","B":"向当事人明示或暗示律师或律师事务所与司法机关、政府机关、社会团体及其工作人员具有特殊关系的","C":"律师和律师事务所在广告或宣传中表明只从事某一专业法律服务领域的","D":"就法律服务结果或司法诉讼的结果随意作出承诺的"},"answer":"C","sources":["规范第105条"],"note":"规范第105条"},{"id":190,"q":"下列选项中，违反我国宪法平等权要求的情形是","options":{"A":"自治县县长由实行区域自治的民族公民担任","B":"某大学将“具有博士学位”作为招聘教师条件","C":"某中央国家机关将“具有北京户口”作为招录公务员条件","D":"某民营饭店在门口贴出通告“本店谢绝公款消费”"},"answer":"C","sources":[],"note":""},{"id":191,"q":"根据《宪法》的规定，“领导和管理国防建设事业”属于哪个国家机关的职权？","options":{"A":"全国人民代表大会常务委员会","B":"国务院","C":"中央军事委员会","D":"中央军事委员会主席"},"answer":"B","sources":[],"note":""},{"id":192,"q":"赵律师担任了某公司的法律顾问，该公司有一劳动争议案件要求赵律师代理仲裁，赵律师就以该公司员工的名义代理了仲裁。事后，顾问单位以工资形式给了赵律师代理费 5000 元。问：赵律师的行为违反了全国律协《律师职业道德和执业纪律规范》中的哪条规定？","options":{"A":"律师事务所是律师的执业机构，律师的执业活动必须接受律师事务所的监督和管理","B":"律师不得以个人名义私自接受委托，不得私自收取费用","C":"律师不得违反律师事务所收费制度和财务纪律，挪用、私分、侵占业务收费","D":"律师应当诚实守信，勤勉尽责，尽职尽责地维护委托人的合法利益"},"answer":"A","sources":[],"note":"“员工的名义”"},{"id":193,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“向司法行政部门提供虚假材料或者有其他弄虚作假行为”的违法行为对应的罚款标准是?","options":{"A":"五千元以上一万元以下","B":"三万元以下","C":"十万元以下","D":"五万元以下"},"answer":"D","sources":["办法第16条"],"note":"办法第16条"},{"id":194,"q":"下列关于宪法的说法，哪个是错误的？","options":{"A":"宪法的修改提案权可以由国务院单独行使","B":"我国的第一部宪法是由全国人民代表大会制定的","C":"宪法具有最高的法律效力，任何法律都不得与宪法相抵触","D":"宪法修正案草案经全国人大表决通过后，还需要经过全国人大常委会的公布程序才能正式生效"},"answer":"A","sources":[],"note":""},{"id":195,"q":"律师担任某刑事案件犯罪嫌疑人的辩护人，根据《律师法》的规定，何时起有权查阅、摘抄、复制案件的案卷材料？","options":{"A":"自公安机关立案之日起","B":"自人民检察院对犯罪嫌疑人批准逮捕之日起","C":"自人民检察院对案件审查起诉之日起","D":"自犯罪嫌疑人被公安机关拘留之日起"},"answer":"C","sources":["律师法第34条"],"note":"律师法第34条"},{"id":196,"q":"以下哪项属于违反《律师协会会员违规行为处分规则（试行）》的违规行为？","options":{"A":"对本人或者其他律师正在办理的案件进行歪曲、有误导性的宣传和评论，恶意炒作案件","B":"利用媒体、广告或者其他方式进行不真实或者不适当宣传的","C":"即曾经担任法官、检察官，从人民法院、人民检察院离任后二年内，担任诉讼代理人或者辩护人","D":"以上均是"},"answer":"D","sources":["A选项出自规则第34条B选项出自规则第29条C选项出自规则第20条"],"note":"A选项出自规则第34条B选项出自规则第29条C选项出自规则第20条"},{"id":197,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条的规定，律师的行为属于“接受对方当事人财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人权益的”，可能给予以下哪一项处罚：","options":{"A":"给予停止执业三个月以下的处罚","B":"给予停止执业三个月以上六个月以下的处罚","C":"给予停止执业六个月以上一年以下的处罚","D":"情节特别严重的，吊销律师事务所执业许可证书"},"answer":"C","sources":[],"note":""},{"id":198,"q":"《宪法》规定的“管理对外事务，同外国缔结条约和协定”属于我国哪个国家机关的职权？","options":{"A":"外交部","B":"国务院","C":"全国人民代表大会常务委员会","D":"中华人民共和国主席"},"answer":"B","sources":[],"note":""},{"id":199,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，投诉人不可以采用以下哪种方式对律师及律师事务所进行投诉？","options":{"A":"信函","B":"邮件","C":"直接来访","D":"匿名电话投诉"},"answer":"D","sources":["规则第43、49条"],"note":"规则第43、49条"},{"id":200,"q":"根据《宪法》的规定，哪个不是中华人民共和国主席、副主席候选人的资格条件?","options":{"A":"有选举权","B":"被选举权","C":"年满四十五周岁","D":"必须是出生在中国的中国公民"},"answer":"D","sources":[],"note":""},{"id":201,"q":"根据《宪法》的规定，我国实行的基本分配制度是什么?","options":{"A":"完全按资本分配","B":"完全按需要分配","C":"按劳分配为主体，多种分配方式并存","D":"仅按政府计划分配"},"answer":"C","sources":[],"note":""},{"id":202,"q":"下列哪一选项属于违反律师或公证有关制度及执业规范规定的情形？","options":{"A":"刘律师受当事人甲委托为其追索1万元欠款，因该事项与另一委托事项时间冲突，经甲同意后另交本所律师办理，但未告知其支出增加","B":"李律师承办当事人乙的继承纠纷案，李律师在分析案情时表示乙依法可以继承2套不动产，并作为代理意见提交法庭，但其主张并未被合议庭采纳，乙仅分得5万元存款","C":"韩律师在担任人大常委会组成人员期间，从事各种讼诉代理或者辩护业务","D":"委托人故意隐瞒与案件有关的重要事实的，李律师有权拒绝代理、或以其他方式终止委托，并有权就已经履行事务取得律师费"},"answer":"A","sources":["《中华全国律师协会律师执业行为规范》第57条，非经委托人的同意，不能因转委托而增加委托人的费用支出。"],"note":"《中华全国律师协会律师执业行为规范》第57条，非经委托人的同意，不能因转委托而增加委托人的费用支出。"},{"id":203,"q":"根据《上海市律师协会律师执业行为规范》规定，下述行为哪一个不属于律师和律师事务所在与司法机关及司法人员接触中，采用不正当手段与同行进行业务竞争？","options":{"A":"与司法人员交换电话、电子邮箱或微信联系方式的","B":"在司法机关内设立律师事务所广告牌的","C":"在司法机关附近200米范围内采用一般商业广告的艺术夸张手段制作广告的","D":"向司法机关和司法人员散发附带律师的姓名、学历、专业职称、联系方法等内容的物品的"},"answer":"A","sources":["规范第109条"],"note":"规范第109条"},{"id":204,"q":"下列人员中不享有宪法规定的选举权的是","options":{"A":"受到刑事处罚者","B":"旅居国外的我国公民","C":"依法被剥夺政治权利者","D":"受到行政拘留处罚者"},"answer":"C","sources":[],"note":""},{"id":205,"q":"根据我国宪法规定，中华人民共和国公民在（）面前一律平等","options":{"A":"宪法","B":"法律","C":"法庭","D":"纪律"},"answer":"B","sources":[],"note":""},{"id":206,"q":"根据《律师法》的规定，曾经担任法官、检察官的律师，是否可以担任诉讼代理人或者辩护人？有什么限制？","options":{"A":"可以，但是需要满足从人民法院、人民检察院离任二年后这个条件","B":"可以，但是需要满足从人民法院、人民检察院离任五年后这个条件","C":"可以，但是需要满足从人民法院、人民检察院离任三年后这个条件","D":"不可以"},"answer":"A","sources":["律师法第41条"],"note":"律师法第41条"},{"id":207,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，以提供交通工具、通讯工具、住房或者其他物品等方式向法官、检察官、仲裁员以及其他工作人员行贿的，属于以下哪种违法行为？","options":{"A":"“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案”的违法行为","B":"“律师以不正当手段承揽业务”的违法行为","C":"“向法官、检察官、仲裁员以及其他有关工作人员行贿，介绍贿赂或者指使、诱导当事人行贿”的违法行为","D":"“扰乱法庭、仲裁庭秩序，干扰诉讼、仲裁活动的正常进行”的违法行为"},"answer":"C","sources":["办法第15条"],"note":"办法第15条"},{"id":208,"q":"根据《律师法》的规定， 全国律师协会章程的制定主体是：","options":{"A":"全国人民代表大会","B":"国务院司法行政部门","C":"全国会员代表大会","D":"全国律师协会"},"answer":"C","sources":["律师法第44条"],"note":"律师法第44条"},{"id":209,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》，以下哪个选项不属于直接利益冲突？","options":{"A":"在刑事案件中，律师事务所律师担任犯罪嫌疑人（被告人）的辩护人，而同一律师事务所的其他律师是该案件的被害人","B":"在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中的对方当事人","C":"曾经处理或审理过某一案件的政府官员、审判员、仲裁员，成为律师后又代理同一案件的诉讼、仲裁、执行、申诉、再审","D":"在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中对方当事人的近亲属"},"answer":"D","sources":["根据19年规则，D选项为间接利冲，A、B、C为直接利冲根据23年规则，D选项为相对利冲，A、B、C为绝对利冲"],"note":"根据19年规则，D选项为间接利冲，A、B、C为直接利冲根据23年规则，D选项为相对利冲，A、B、C为绝对利冲"},{"id":210,"q":"根据《宪法》的规定，各级法院向什么机关负责？","options":{"A":"最高人民法院对全国人民代表大会负责；地方各级人民法院对上级人民法院负责","B":"最高人民法院对全国人民代表大会常务委员会负责；地方各级人民法院对产生它的国家权力机关负责","C":"最高人民法院对全国人民代表大会和全国人民代表大会常务委员会负责。地方各级人民法院对产生它的国家权力机关负责","D":"最高人民法院对全国人民代表大会和全国人民代表大会常务委员会负责。地方各级人民法院对产生它的国家权力机关负责和上级人民法院负责"},"answer":"C","sources":[],"note":""},{"id":211,"q":"2014年至2015年期间，李律师在本市A律师事务所实习，并顺利取得了律师执业证。2016年，李律师跳槽到本市B律师事务所工作，并办理完毕了全部转所手续。此时，李律师发现合伙人交办的一件案件（执行程序）的委托人恰好是实习期间曾经协助处理的某件案件（一审程序）的对方当事人。根据《律师法》《律师执业管理办法》《上海律师执业利益冲突认定和处理规则》等法律规范中规定律师执业利益冲突，李律师的上述行为属于？","options":{"A":"绝对禁止的利益冲突","B":"相对禁止的利益冲突","C":"该类情况不属于法律规范中规定律师执业利益冲突","D":"李律师可在取得当事人豁免后承办该案件"},"answer":"A","sources":["规则第10条第4项"],"note":"规则第10条第4项"},{"id":212,"q":"根据《宪法》的规定，以下机构中，哪个机构可以“选举中华人民共和国主席、副主席”？","options":{"A":"最高人民检察院","B":"最高人民法院","C":"全国人民代表大会","D":"国务院"},"answer":"C","sources":[],"note":""},{"id":213,"q":"如果律师同时在律师事务所和其他法律服务机构执业被发现，他将受到哪个层级的律师协会的处分？","options":{"A":"国家级律师协会","B":"省、自治区、直辖市及设区的市律师协会","C":"县级律师协会","D":"任何级别的律师协会都可以"},"answer":"B","sources":["《律师协会会员违规行为处分规则（试行）》第17、37条"],"note":"《律师协会会员违规行为处分规则（试行）》第17、37条"},{"id":214,"q":"下列关于《宪法》中男女平等原则的说法，正确的是哪一项？","options":{"A":"《宪法》规定，妇女在政治、经济、文化、社会和家庭生活中享有与男子不平等的权利","B":"国家鼓励妇女参与社会活动，但不需要特别保障妇女在劳动中的权益","C":"《宪法》明确禁止对妇女的一切形式的歧视，包括就业、教育、医疗等方面","D":"男女平等原则只适用于城市和发达地区，农村和欠发达地区可以例外"},"answer":"C","sources":[],"note":""}],"duoxuan":[{"id":1,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师“利用提供法律服务的便利牟取当事人争议的权益”的违法行为对应的处罚规定是什么？","options":{"A":"由司法行政机关给予警告，可以处五千元以下的罚款","B":"由司法行政机关给予警告，可以处一万元以下的罚款","C":"有违法所得的，没收违法所得","D":"情节严重的，给予停止执业三个月以上六个月以下的处罚"},"answer":"BCD","sources":["办法第12条，律师法第48条"],"note":"办法第12条，律师法第48条"},{"id":2,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，下列四种情形哪些不属于直接的利益冲突情形？","options":{"A":"在刑事案件中，律师事务、律师担任犯罪嫌疑人（被告人）的辩护人，而同一律师事务所的其他律师是该案件的被害人的近亲属","B":"律师事务所律师在结束代理当事人的对抗性案件或非诉讼业务的半年之内，同一律师事务所其他律师担任该当事人在对抗性案件或者非诉讼案件中对方当事人的代理人","C":"在刑事案件中，同一律师事务所的律师同时担任共同犯罪案件两个或两个以上利益冲突的、罪嫌疑人（被告人）的辩护人","D":"律师事务所律师代理当事人的对抗性案件或非诉讼业务，而该律师的近亲属是对方当事人的高级管理人员、律师，或与对方当事人的高级管理人员、律师有利害关系"},"answer":"ABD","sources":["19年规则第5、6条ABD为间接利冲C选项出自《律师办理刑事案件规范》第13条，同一律师事务所在接受两名或两名以上的同案犯罪嫌疑人、被告人的委托，分别指派不同的律师担任辩护人的，须告知委托人并经其同意。"],"note":"19年规则第5、6条ABD为间接利冲C选项出自《律师办理刑事案件规范》第13条，同一律师事务所在接受两名或两名以上的同案犯罪嫌疑人、被告人的委托，分别指派不同的律师担任辩护人的，须告知委托人并经其同意。"},{"id":3,"q":"根据《宪法》的规定，以下哪些选项是全国人民代表大会设立的专门委员会?","options":{"A":"民族委员会","B":"宪法和法律委员会","C":"财政经济委员会","D":"教育科学文化卫生委员会"},"answer":"ABCD","sources":["宪法第70条"],"note":"宪法第70条"},{"id":4,"q":"根据《律师法》的规定，哪些情形下，司法行政部门会撤销准予执业的决定，并注销被准予执业人员的律师执业证书？","options":{"A":"申请人触犯刑法并接受刑事处罚的","B":"申请人触犯法律并接受行政处罚的","C":"申请人以欺诈、贿赂等不正当手段取得律师执业证书的","D":"对不符合本法规定条件的申请人准予执业的"},"answer":"CD","sources":["律师法第9条"],"note":"律师法第9条"},{"id":5,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，下列哪些行为属于“律师以不正当手段承揽业务”的违法行为：","options":{"A":"以误导、利诱、威胁或者作虚假承诺等方式承揽业务的","B":"以支付介绍费、给予回扣、许诺提供利益等方式承揽业务的","C":"以对本人及所在律师事务所进行宣传等方式承揽业务的","D":"在律师事务所住所以外承揽业务的"},"answer":"AB","sources":["办法第6条"],"note":"办法第6条"},{"id":6,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为哪些属于违规行为？","options":{"A":"律师私自接受委托，私自向委托人收取费用","B":"收取规定、约定之外的费用或者财物","C":"依据风险代理管理规定收取费用的","D":"违反律师服务收费管理规定或者收费协议约定，擅自提高收费的"},"answer":"ABD","sources":["规则第27条"],"note":"规则第27条"},{"id":7,"q":"根据《律师法》的规定，设立个人律师事务所的条件有以下哪些？","options":{"A":"有自己的名称、住所和章程","B":"有符合本法规定的律师","C":"设立人应当是具有一定的执业经历，且三年内未受过停止执业处罚的律师","D":"有符合国务院司法行政部门规定数额的资产，设立人具有五年以上执业经历的律师，设立人对律师事务所的债务承担无限责任"},"answer":"ABCD","sources":["律师法第14条"],"note":"律师法第14条"},{"id":8,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“律师以不正当手段承揽业务”的违法行为对应的处罚规定包括：","options":{"A":"警告，可以处五千元以下的罚款","B":"由律协给予训诫、通报批评、公开谴责、中止会员权利等","C":"有违法所得的，没收违法所得","D":"吊销律师执业证"},"answer":"AC","sources":["办法第6条、律师法第47条"],"note":"办法第6条、律师法第47条"},{"id":9,"q":"王律师担任甲公司的常年法律顾问。后甲公司因拖欠货款被起诉后，要委托王律师作代理人。同时甲公司的主要竞争对手乙公司也想请王律师担任常年法律顾问，该情形下王律师处理正确的是？","options":{"A":"接受其中一家公司的委托","B":"不得接受甲乙公司任意一方的委托","C":"未经甲乙公司授权，不得同时接受两家公司的委托","D":"在征得甲乙公司的书面同意后，接受委托"},"answer":"CD","sources":["19年规则第6条，属于间接利冲，可以豁免"],"note":"19年规则第6条，属于间接利冲，可以豁免"},{"id":10,"q":"根据《律师法》的规定，设立合伙律师事务所的，应当满足以下哪些条件：","options":{"A":"设立人为三人或以上","B":"设立人应当是具有三年以上执业经历的律师","C":"设立人未曾接受过任何性质的行政处罚","D":"设立人应当是具有五年以上执业经历的律师"},"answer":"AB","sources":["律师法第15条"],"note":"律师法第15条"},{"id":11,"q":"根据《律师法》的规定，设立合伙制律师事务所的条件有以下哪些？","options":{"A":"有自己的名称、住所和章程","B":"有符合本法规定的律师","C":"设立人应当是具有一定的执业经历，且三年内未受过停止执业处罚的律师","D":"有符合国务院司法行政部门规定数额的资产，有三名以上合伙人，设立人应当是具有三年以上执业经历的律师"},"answer":"ABCD","sources":["律师法14、15条"],"note":"律师法14、15条"},{"id":12,"q":"下面选项中，哪些不是《宪法》中对于在诉讼中少数民族的语言文字权利保护的表述？","options":{"A":"在少数民族聚居或者多民族共同居住的地区，应当用汉语进行审理","B":"各民族公民都有用本民族语言文字进行诉讼的权利","C":"起诉书、判决书、布告和其他文书只能根据实际需要使用当地的一种文字","D":"人民法院和人民检察院仅针对不通晓当地通用的语言文字的诉讼代理人，才可以为他们翻译"},"answer":"ACD","sources":["宪法第139条"],"note":"宪法第139条"},{"id":13,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，律师以下哪些行为可能被律师协会取消会员资格？","options":{"A":"向法官、检察官、仲裁员及其他有关工作人员行贿，许诺提供利益、介绍贿赂或者指使、诱导当事人行贿的","B":"利用与法官、检察官、仲裁员以及其他有关工作人员的特殊关系，打探办案机关内部对案件的办理意见，承办其介绍的案件，影响依法办理案件的","C":"承办案件期间，为了不正当目的，在非工作期间、非工作场所，会见承办法官、检察官、仲裁员或者其他有关工作人员，或者违反规定单方面会见法官、检察官、仲裁员的","D":"泄漏当事人的商业秘密或者个人隐私的"},"answer":"ABCD","sources":["规则第33、32、31本题答案有问题，应当为A,B,CD选项出自规则第24条，泄露当事人的商业秘密或者个人隐私的，给予警告、通报批评或者公开谴责的纪律处分；情节严重的，给予中止会员权利三个月以上六个月以下的纪律处分。"],"note":"规则第33、32、31本题答案有问题，应当为A,B,CD选项出自规则第24条，泄露当事人的商业秘密或者个人隐私的，给予警告、通报批评或者公开谴责的纪律处分；情节严重的，给予中止会员权利三个月以上六个月以下的纪律处分。"},{"id":14,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，以支付介绍费等不正当手段争揽业务的，将可能会受到哪些处分？","options":{"A":"警告","B":"训诫","C":"通报批评","D":"罚款"},"answer":"ABCD","sources":["规则第29条本题答案有问题，应当为A,B,C律协处分没有罚款"],"note":"规则第29条本题答案有问题，应当为A,B,C律协处分没有罚款"},{"id":15,"q":"根据《律师法》的规定，律师应当保守在执业活动中知悉的国家秘密、商业秘密，不得泄露当事人的隐私。有哪几种例外情况律师可以披露相关信息？","options":{"A":"委托人或者其他人准备或者正在实施危害国家安全的犯罪事实和信息","B":"委托人对生效判决不满，贬低审判人员","C":"委托人或者其他人准备或者正在实施危害公安安全的犯罪事实和信息","D":"委托人或者其他人准备或者正在实施严重危害他人人身安全的犯罪事实和信息","E":"律师为某政府机关法律顾问，而委托人或者其他人针对该政府机关正准备或正在进行行政诉讼的"},"answer":"ACD","sources":["律师法第38条"],"note":"律师法第38条"},{"id":16,"q":"根据《律师法》的规定，专业法律知识人员满足哪些条件可以申请专职律师执业？","options":{"A":"具有高等院校本科以上学历","B":"在法律服务人员紧缺领域从事专业工作满十五年","C":"具有高级职称或者同等专业水平并具有相应的专业法律知识","D":"经国务院司法行政部门考核合格"},"answer":"ABCD","sources":["律师法第8条"],"note":"律师法第8条"},{"id":17,"q":"根据《律师法》《律师执业管理办法》《上海律师执业利益冲突认定和处理规则》等法律规范中规定律师执业利益冲突，下列行为属于法律规定的利益冲突情形的是？","options":{"A":"陈律师系某企业的常年法律顾问，与陈律师同一律师事务所的李律师在某一对抗性案件中担任该企业对方当事人的代理人","B":"陈律师在结束代理当事人的对抗性案件或非诉讼委托业务后半年之内，又担任该当事人在对抗性案件或非诉讼业务中对方当事人的代理人","C":"某企业向李律师发出招标文件，邀请李律师参与投标企业新一年度常年法律顾问。而李律师所在律所的张律师是该企业以往的常年法律顾问","D":"共同犯罪案件中，同一律师事务所的李律师以及张律师分别同时担任两个利益冲突的犯罪嫌疑人（被告人）的辩护人"},"answer":"ABD","sources":["19年规则第5、6条"],"note":"19年规则第5、6条"},{"id":18,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为属于违规行为的是？","options":{"A":"在司法机关、监管场所周边违规设立办公场所、散发广告、举牌等不正当手段争揽业务的","B":"向当事人明示或者暗示与办案机关、政府部门及其工作人员有特殊关系的","C":"以支付介绍费等不正当手段争揽业务","D":"利用媒体、广告或者其他方式进行不真实或者不适当宣传的"},"answer":"ABCD","sources":["规则第29条"],"note":"规则第29条"},{"id":19,"q":"请根据《上海市律师协会律师执业利益冲突认定和处理规则》，下列哪些选项是直接利益冲突的禁止和豁免规定？","options":{"A":"对直接利益冲突，会员在取得利益冲突各方当事人的同意会员担任对方当事人的代理人或辩护人的有效豁免之前，不得接受委托或者实施委托行为","B":"对直接利益冲突，已经接受委托的，应当立即终止委托关系","C":"在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中对方当事人的近亲属，不论当事人是否同意豁免，会员都不得接受委托","D":"在刑事案件中，律师事务所律师担任犯罪嫌疑人(被告人)的辩护人，而同一律师事务所的其他律师是该案件被害人的近亲属，不论当事人是否同意豁免，会员都不得接受委托"},"answer":"ABCD","sources":["19年规则第7、6条本题答案有问题，应当为A,B。C,D为间接利冲。第六条　间接利益冲突有下列情形之一点，为间接利益冲突：1、在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中对方当事人的近亲属。2、在刑事案件中，律师事务所律师担任犯罪嫌疑人（被告人）的辩护人，而同一律师事务所的其他律师是该案件被害人的近亲属。"],"note":"19年规则第7、6条本题答案有问题，应当为A,B。C,D为间接利冲。第六条　间接利益冲突有下列情形之一点，为间接利益冲突：1、在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中对方当事人的近亲属。2、在刑事案件中，律师事务所律师担任犯罪嫌疑人（被告人）的辩护人，而同一律师事务所的其他律师是该案件被害人的近亲属。"},{"id":20,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“同时在两个以上律师事务所执业”的违法行为包括：","options":{"A":"在律师事务所执业的同时又在其他律师事务所执业的","B":"在律师事务所执业的同时又在社会法律服务机构执业的","C":"在获准变更执业机构前以拟变更律师事务所律师的名义承办业务","D":"在获准变更执业机构后仍以原所在律师事务所律师的名义承办业务的"},"answer":"ABCD","sources":["办法第5条"],"note":"办法第5条"},{"id":21,"q":"根据《宪法》的规定，下述哪一项不是中华人民共和国主席的职权?","options":{"A":"根据全国人民代表大会的决定和全国人民代表大会常务委员会的决定，公布法律；","B":"任免国务院总理、副总理、国务委员、各部部长、各委员会主任、审计长、秘书长；","C":"派遣和召回驻外全权代表；","D":"批准和废除同外国缔结的条约和重要协定。"},"answer":"CD","sources":["宪法第80、81条本题答案有问题，应当为B,C,D。A,B均需要全人大和全人常的决定；C,D均需要全人常的决定。"],"note":"宪法第80、81条本题答案有问题，应当为B,C,D。A,B均需要全人大和全人常的决定；C,D均需要全人常的决定。"},{"id":22,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，下列哪些情形属于直接的利益冲突？","options":{"A":"在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中的对方当事人","B":"在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中对方当事人的近亲属","C":"同一律师事务所律师在对抗性案件或非诉讼案件中结束与一方当事人的委托关系后，在同一案件后续审理或处理中又接受对方当事人委托的","D":"同一律师事务所接受正在代理的对抗性案件或非诉案件当事人的对方当事人所委托的其他法律业务"},"answer":"AC","sources":["19年规则第5、6条"],"note":"19年规则第5、6条"},{"id":23,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，泄漏国家秘密的，将可能会受到哪些处分？","options":{"A":"警告、训诫","B":"公开谴责","C":"中止会员权利六个月以上一年以下","D":"取消会员资格"},"answer":"BCD","sources":["规则第26条"],"note":"规则第26条"},{"id":24,"q":"客户委托李律师代理一起房屋买卖纠纷案，在代理过程中，李律师发现客户很难胜诉，并将事实及法律依据告知了客户。客户得知该情况后，表示希望李律师继续为其代理此案件并且答应李律师在取得了该争议房屋所有权后将房屋便宜转卖给李律师。按照《律师执业行为规范》的规定，该情形下李律师做法不正确的是？","options":{"A":"拒绝客户的所有要求","B":"不得向客户保证案件可以胜诉","C":"向客户表示愿意接受房屋","D":"李律师告知客户在执业的过程中，律师不得与委托人争议的权益产生经济上的联系，不得与委托人约定胜诉后将争
