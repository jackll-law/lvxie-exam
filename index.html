    body += '</section>';
  });
  w.document.write('<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><title>' + esc(SUBJECT) + ' · 错题本</title><style>'
    + "body{font-family:'Microsoft YaHei','PingFang SC',sans-serif;max-width:760px;margin:24px auto;color:#222;line-height:1.7;padding:0 16px}"
    + 'h1{font-size:20px;color:#1e3a8a;margin:0 0 4px}.meta{color:#888;font-size:12px;margin-bottom:18px}'
    + '.q{margin:0 0 14px;padding:10px 14px;border:1px solid #e5e8f0;border-radius:8px;page-break-inside:avoid}'
    + '.qt{font-weight:600}.ol2{margin:4px 0 0 18px;color:#444}.ans{margin-top:6px;color:#1a5c38;font-weight:600}'
    + '.exp{color:#666;font-size:12.5px;margin-top:2px}'
    + '.tb{position:fixed;top:12px;right:14px}'
    + '.tb button{padding:8px 16px;border-radius:8px;border:1px solid #1e3a8a;background:#1e3a8a;color:#fff;font-size:13px;cursor:pointer}'
    + '@media print{.tb{display:none}.q{border:none;padding:0 0 12px}}'
    + '</style></head><body>'
    + '<h1>' + esc(SUBJECT) + ' · 错题本</h1><div class="meta">生成于 ' + todayStr() + ' · 共 ' + rows.length + ' 题（含答案与解析）</div>'
    + '<div class="tb"><button onclick="window.print()">打印 / 存 PDF</button></div>' + body + '</body></html>');
  w.document.close();
}
function csvWrongbook(groups) {
  const rows = [['题型', '题号', '题干', '选项', '答案', '解析/依据']];
  groups.forEach(function (g) {
    g.list.forEach(function (q) {
      const opts = q.options ? ORDER.filter(function (L) { return q.options[L]; }).map(function (L) { return L + '. ' + q.options[L]; }).join(' | ') : '';
      const src = (q.sources && q.sources[0]) || '';
      rows.push([g.label, q.id, q.q || '', opts, q.answer || '', src + (q.note ? ' 解析：' + q.note : '')]);
    });
  });
  const csv = '\ufeff' + rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
  downloadBlob(csv, safeName() + '-错题本-' + todayStr() + '.csv', 'text/csv');
}
function fallbackCopy(t, done) {
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { alert('复制失败，请改用「导出 CSV」。'); }
  ta.remove();
}
function copyWrongbook(groups) {
  const t = wrongbookText(groups);
  const n = groups.reduce(function (a, g) { return a + g.list.length; }, 0);
  const done = function () { alert('已复制 ' + n + ' 道错题（含答案与解析），可粘贴到备忘录 / Word。'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { fallbackCopy(t, done); });
  else fallbackCopy(t, done);
}
function openWrong() {
  const groups = wrongbookGroups();
  const n = groups.reduce(function (a, g) { return a + g.list.length; }, 0);
  let h = panelHead('错题本', n ? ('共 ' + n + ' 道 · 可打印成 PDF / 导出 CSV / 复制文本，点击行可跳到该题') : '当前没有错题，继续保持！');
  if (n) {
    h += '<div class="btnrow"><button class="btn primary" id="wrPrint">打印 / 存 PDF</button><button class="btn gray" id="wrCsv">导出 CSV</button><button class="btn gray" id="wrCopy">复制文本</button></div>';
    groups.forEach(function (g) {
      h += '<h4>' + esc(g.label) + '（' + g.list.length + '）</h4><table class="stable">';
      g.list.forEach(function (q, i) {
        const src = q.chap || (q.sources && q.sources[0]) || '';
        h += '<tr class="clk" data-k="' + esc(g.k) + '" data-id="' + esc(q.id) + '"><td class="num">' + (i + 1) + '.</td><td>' + esc(String(q.q || '').slice(0, 48)) + (String(q.q || '').length > 48 ? '…' : '') + '</td><td class="num mutedsrc">' + esc(src) + '</td></tr>';
      });
      h += '</table>';
    });
  }
  openPanel(h);
  bindJumpRows();
  if (!n) return;
  document.getElementById('wrPrint').onclick = function () { printWrongbook(groups); };
  document.getElementById('wrCsv').onclick = function () { csvWrongbook(groups); };
  document.getElementById('wrCopy').onclick = function () { copyWrongbook(groups); };
}
function mergeState(inc) {
  let added = 0, updated = 0;
  Object.keys(state).forEach(function (k) {
    const im = inc[k];
    if (!im || typeof im !== 'object') return;
    Object.keys(im).forEach(function (id) {
      const nv = im[id], ov = state[k][id];
      if (ov === undefined || ov === null) { state[k][id] = nv; added++; return; }
      if (JSON.stringify(ov) === JSON.stringify(nv)) return;
      let better = nv;
      if (k === 'review') {
        better = (((nv && nv.s) || 0) >= ((ov && ov.s) || 0)) ? nv : ov;
      } else if (k === 'wrongcnt') {
        better = Math.max(Number(ov) || 0, Number(nv) || 0);
      } else {
        const rank = function (v) { return (v === 'right' || v === '记得') ? 2 : (v ? 1 : 0); };
        if (rank(nv) < rank(ov)) better = ov;
      }
      state[k][id] = better;
      updated++;
    });
  });
  return { added: added, updated: updated };
}
function exportProgress() {
  const payload = {
    app: 'shuati-bao', subject: SUBJECT, key: KEY, version: 1, date: todayStr(),
    data: Object.assign({}, state, { pomo: { count: pomo.count } })
  };
  downloadBlob(JSON.stringify(payload, null, 1), safeName() + '-进度-' + todayStr() + '.json', 'application/json');
}
function importProgress(file) {
  const r = new FileReader();
  r.onload = function () {
    try {
      const obj = JSON.parse(r.result);
      const inc = obj && typeof obj === 'object' ? (obj.data || (obj.danxuan ? obj : null)) : null;
      if (!inc) throw new Error('不是本系统导出的进度文件');
      const res = mergeState(inc);
      if (inc.pomo && inc.pomo.count > pomo.count) { pomo.count = inc.pomo.count; savePomo(); if (typeof pomoRender === 'function') pomoRender(); }
      save(); cur.filter = 'all'; buildOrder(); cur.index = 0; render();
      alert('导入完成：新增 ' + res.added + ' 条记录，更新 ' + res.updated + ' 条。');
    } catch (e) { alert('导入失败：' + e.message); }
  };
  r.readAsText(file, 'utf-8');
}
function openExp() {
  let doneCnt = 0;
  Object.keys(TABS).forEach(function (k) { const sm = state[k] || {}; Object.keys(sm).forEach(function () { doneCnt++; }); });
  let h = panelHead('进度备份与恢复', '导出本机做题记录、艾宾浩斯复习队列与番茄计数；换浏览器 / 换设备时导入即可无缝续刷。');
  h += '<div class="statgrid">'
    + metricBox('做题记录', doneCnt)
    + metricBox('复习队列', Object.keys(state.review || {}).length)
    + metricBox('番茄累计', pomo.count)
    + '</div>'
    + '<h4>导出</h4><div class="btnrow"><button class="btn primary" id="expBtn">导出进度 JSON</button></div>'
    + '<h4>导入</h4><div class="btnrow"><input type="file" id="impFile" accept=".json,application/json"></div>'
    + '<div class="psub" style="margin-top:8px">导入规则：与当前进度合并；同一题两边都有记录时保留更优结果（答对优先），复习调度取遍数更多的一条，番茄数取较大值。</div>';
  openPanel(h);
  document.getElementById('expBtn').onclick = exportProgress;
  document.getElementById('impFile').onchange = function () { if (this.files && this.files[0]) importProgress(this.files[0]); };
}
function initTools() {
  const top = document.querySelector('.top');
  if (!top || document.getElementById('toolMask')) return;
  const bar = document.createElement('div');
  bar.className = 'tools';
  [['统计', openStats], ['错题本', openWrong], ['进度', openExp]].forEach(function (d) {
    const b = document.createElement('button');
    b.className = 'tbtn'; b.textContent = d[0]; b.onclick = d[1];
    bar.appendChild(b);
  });
  top.appendChild(bar);
  const mask = document.createElement('div');
  mask.className = 'mask'; mask.id = 'toolMask';
  mask.innerHTML = '<div class="panel" id="toolPanel"></div>';
  mask.onclick = function (e) { if (e.target === mask) closePanels(); };
  document.body.appendChild(mask);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanels(); });
}
initTools();

/* ---------- 番茄钟 ---------- */
/* ---------- 番茄钟 ---------- */
const POMO_KEY = KEY + ':pomo';
let pomo = loadPomo();
let pomoTimer = null;
function loadPomo() {
  try { const s = JSON.parse(localStorage.getItem(POMO_KEY)); if (s && typeof s === 'object') return { count: s.count || 0 }; } catch (e) {}
  return { count: 0 };
}
function savePomo() { localStorage.setItem(POMO_KEY, JSON.stringify(pomo)); }
let pomoLeft = 25 * 60, pomoMode = 'focus', pomoRunning = false;
function fmtPomo(sec) { const m = Math.floor(sec / 60), s = sec % 60; return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s); }
function pomoDurations() { return pomoMode === 'focus' ? 25 * 60 : 5 * 60; }
function pomoRender() {
  const ball = document.getElementById('pomoBall'), panel = document.getElementById('pomoPanel');
  if (!ball || !panel) return;
  ball.textContent = pomoRunning ? '🍅 ' + fmtPomo(pomoLeft) : '🍅 番茄钟';
  ball.className = (pomoRunning ? 'run ' : '') + (pomoMode === 'break' ? 'break' : '');
  document.getElementById('pomoTime').textContent = fmtPomo(pomoLeft);
  document.getElementById('pomoState').textContent = pomoRunning ? (pomoMode === 'focus' ? '专注刷题中…' : '休息一下～') : (pomoMode === 'focus' ? '准备专注 25 分钟' : '准备休息 5 分钟');
  document.getElementById('pomoCount').textContent = '今日已完成 ' + pomo.count + ' 个🍅';
  document.getElementById('pomoToggle').textContent = pomoRunning ? '暂停' : '开始';
}
function pomoTick() {
  pomoLeft--;
  if (pomoLeft <= 0) {
    if (pomoMode === 'focus') { pomo.count++; savePomo(); pomoMode = 'break'; alert('🍅 番茄完成！休息 5 分钟'); }
    else { pomoMode = 'focus'; alert('休息结束，开始下一个番茄！'); }
    pomoLeft = pomoDurations();
  }
  pomoRender();
}
function pomoToggle() {
  pomoRunning = !pomoRunning;
  if (pomoRunning) { pomoTimer = setInterval(pomoTick, 1000); document.getElementById('pomoPanel').classList.remove('show'); }
  else { clearInterval(pomoTimer); }
  pomoRender();
}
function pomoReset() { clearInterval(pomoTimer); pomoRunning = false; pomoMode = 'focus'; pomoLeft = 25 * 60; pomoRender(); }
function pomoSkip() { pomoLeft = 1; }
function initPomo() {
  const panel = document.createElement('div');
  panel.id = 'pomoPanel';
  panel.innerHTML = '<div id="pomoTime">25:00</div><div id="pomoState"></div><div id="pomoCount"></div>' +
    '<div class="pomoRow"><button id="pomoToggle" class="pri">开始</button><button id="pomoReset">重置</button><button id="pomoSkip">跳过</button></div>' +
    '<div id="pomoNote">25 分钟专注 + 5 分钟休息</div>';
  document.body.appendChild(panel);
  const ball = document.createElement('button');
  ball.id = 'pomoBall';
  ball.textContent = '🍅 番茄钟';
  ball.onclick = () => { panel.classList.toggle('show'); pomoRender(); };
  const top = document.querySelector('.top');
  (top || document.body).appendChild(ball);
  document.getElementById('pomoToggle').onclick = pomoToggle;
  document.getElementById('pomoReset').onclick = pomoReset;
  document.getElementById('pomoSkip').onclick = pomoSkip;
  pomoRender();
}
initPomo();
</script>
