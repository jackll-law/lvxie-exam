议标的物出售给自己，并表示自己不会接受此房屋的转让"},"answer":"AC","sources":["规范第79、23、59条"],"note":"规范第79、23、59条"},{"id":25,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪些行为属于“向司法行政部门提供虚假材料或者有其他弄虚作假行为”的违法行为？","options":{"A":"在参加律师执业年度考核、执业评价、评先创优活动中，提供不实、虚假、伪造的材料或者有其他弄虚作假行为的","B":"在申请变更执业机构、办理执业终止、注销等手续时，提供不实、虚假、伪造的材料的","C":"在获准变更执业机构前以拟变更律师事务所律师的名义承办业务，或者在获准变更后仍以原所在律师事务所律师的名义承办业务的","D":"在司法行政机关实施检查、监督工作中，向其隐瞒真实情况，拒不提供或者提供不实、虚假材料，或者隐匿、毁灭、伪造证据材料的"},"answer":"AB","sources":["办法第16条本题答案有问题，应当为A,B,D。C选项属于办法第5条的“同时在两个以上律师事务所执业的”"],"note":"办法第16条本题答案有问题，应当为A,B,D。C选项属于办法第5条的“同时在两个以上律师事务所执业的”"},{"id":26,"q":"根据《律师法》的规定，律师接受委托后，无正当理由的，不得拒绝辩护或者代理。下列哪种情形发生，律师可以拒绝辩护或者代理？","options":{"A":"疑难案件败诉风险高的","B":"委托人利用律师提供的服务从事违法活动","C":"委托人客观上无法提供律师要求提供的证据的","D":"委托事项违法","E":"委托人故意隐瞒与案件有关的重要事实的"},"answer":"BD","sources":["律师法第32条本题答案有问题，应当为B,D,E"],"note":"律师法第32条本题答案有问题，应当为B,D,E"},{"id":27,"q":"根据《律师法》的规定，下列哪些情形下律师事务所应当终止？","options":{"A":"不能保持法定设立条件，经限期整改仍不符合条件的","B":"自行决定解散的","C":"律师事务所执业证书被依法吊销的","D":"律师事务所在取得设立许可后，六个月内未开业或者无正当理由停止业务活动满一年的。"},"answer":"ABC","sources":["律师法第22条"],"note":"律师法第22条"},{"id":28,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪些行为属于“泄漏商业秘密或者个人隐私”的违法行为？","options":{"A":"律师未经委托人的授权或者同意，在承办案件的过程中擅自披露、散布在执业中知悉的委托人的商业秘密","B":"律师未经委托人的授权或者同意，在承办案件的过程中擅自披露、散布在执业中知悉的委托人的个人隐私","C":"律师未经委托人或者其他当事人的授权或者同意，在承办案件结束后，擅自披露、散布在执业中知悉的委托人或者其他当事人的商业秘密","D":"律师未经委托人或者其他当事人的授权或者同意，在承办案件结束后，擅自披露、散布在执业中知悉的委托人或者其他当事人不愿泄露的情况和信息的"},"answer":"ABCD","sources":["办法第13条"],"note":"办法第13条"},{"id":29,"q":"根据《律师法》的规定，律师自行调查取证的，应当凭哪些材料可以向有关单位或者个人调查与承办法律事务有关的情况？","options":{"A":"身份证","B":"委托书","C":"律师执业证书","D":"律师事务所证明"},"answer":"CD","sources":["律师法第35条"],"note":"律师法第35条"},{"id":30,"q":"根据《律师法》的规定， 律师接受委托后，无正当理由，拒绝辩护或者代理，可以处以下列何种处罚：","options":{"A":"给予警告，可以处一万元以下的罚款","B":"没收违法所得","C":"给予停止执业三个月以上六个月以下的处罚","D":"追究刑事责任"},"answer":"ABC","sources":["律师法第48条"],"note":"律师法第48条"},{"id":31,"q":"小李是某律师事务所实习律师，以下哪些行为是错误的？","options":{"A":"以律师名义在法庭、仲裁庭上发表辩护或者代理意见","B":"以律师名义印制名片及其他相关资料","C":"以律师名义洽谈、承揽律师业务","D":"在旁听席参加庭审活动，全程记录庭审细节回去学习"},"answer":"ABC","sources":["《中华全国律师协会申请律师执业人员实习管理规则》第23条"],"note":"《中华全国律师协会申请律师执业人员实习管理规则》第23条"},{"id":32,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，为阻挠当事人解除委托关系，威胁、恐吓当事人或者扣留当事人提供的材料，将可能会受到哪些处分？","options":{"A":"训诫、警告、或者通报批评","B":"公开谴责","C":"中止会员权利六个月以上一年以下","D":"取消会员资格"},"answer":"ABD","sources":["规则第23条"],"note":"规则第23条"},{"id":33,"q":"根据《律师法》的规定，申请人有以下哪些情形的，司法行政部门不予颁发律师执业证书？","options":{"A":"无民事行为能力或者限制民事行为能力的","B":"受过刑事处罚的，但过失犯罪的除外","C":"被开除公职或者被吊销律师执业证书的","D":"因轻微违法行为曾接受过行政处罚的"},"answer":"ABC","sources":["律师法第7条"],"note":"律师法第7条"},{"id":34,"q":"根据《律师法》的规定，律师在同一案件中为双方当事人担任代理人，或者代理与本人及其近亲属有利益冲突的法律事务，可以处以下列何种处罚：","options":{"A":"给予警告，可以处五千元以下的罚款","B":"没收违法所得","C":"给予停止执业三个月以下的处罚","D":"追究刑事责任"},"answer":"ABC","sources":["律师法第47条"],"note":"律师法第47条"},{"id":35,"q":"根据《律师法》的规定，律师担任各级人民代表大会常务委员会组成人员的，任职期间不得从事下列哪些业务？","options":{"A":"非诉业务","B":"接受某犯罪嫌疑人家属委托，担任其辩护人","C":"接受客户委托，就一买卖合同纠纷提起民事诉讼","D":"接受客户委托，就一租约纠纷提起国际仲裁"},"answer":"BCD","sources":["律师法第11条"],"note":"律师法第11条"},{"id":36,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪些行为属于“故意提供虚假证据或者威胁、利诱他人提供虚假证据，妨碍对方当事人合法取得证据”的违法行为？","options":{"A":"以对案件进行歪曲、不实、有误导性的宣传或者诋毁有关办案机关和工作人员以及对方当事人声誉等方式，影响依法办理案件的","B":"妨碍对方当事人及其代理人、辩护人合法取证的，或者阻止他人向案件承办机关或者对方当事人提供证据的","C":"在司法行政机关实施检查、监督工作中，向其隐瞒真实情况，拒不提供或者提供不实、虚假材料，或者隐匿、毁灭、伪造证据材料的","D":"指示或者帮助委托人或者他人伪造、隐匿、毁灭证据，指使或者帮助犯罪嫌疑人、被告人串供，威胁、利诱证人不作证或者作伪证的"},"answer":"BD","sources":["A选项出自办法第14条，属于“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办理案件”的行为B、D出自办法第17条C选项出自办法第16条，属于“向司法行政部门提供虚假材料或者有其他弄虚作假行为”"],"note":"A选项出自办法第14条，属于“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办理案件”的行为B、D出自办法第17条C选项出自办法第16条，属于“向司法行政部门提供虚假材料或者有其他弄虚作假行为”"},{"id":37,"q":"下列哪些不是律师协会应当履行的职责？","options":{"A":"为律师提供案源","B":"对设立律所进行行政审批","C":"律师或律所出现违规行为时对其进行罚款","D":"吊销律师执业证书","E":"组织管理申请律师执业人员的实习活动，对实习人员进行考核F.受理对律师的投诉或者举报，调解律师执业活动中发生的纠纷,受理律师的申诉"},"answer":"ABCD","sources":["律师法第46条"],"note":"律师法第46条"},{"id":38,"q":"下列关于律师与委托人、对方当事人的纪律规定，正确的有：","options":{"A":"律师不得从对方当事人处接受利益或向其要求或约定利益","B":"律师不得与对方当事人或第三人恶意串通，侵害委托人的权益","C":"律师不得非法阻止和干预对方当事人及其代理人进行的活动","D":"律师对与委托事项有关的保密信息，委托代理关系结束后仍有保密义务"},"answer":"ABCD","sources":[],"note":""}],"jianda":[{"id":1,"q":"客户为感谢王律师，欲约定在王律师胜诉后，以低于市场价的价格售卖该客户的涉诉房屋，但为免产生不必要的纠纷，王律师想委托自己母亲订立一份房屋买卖协议，请问王律师这样的行为是否违反《律师执业行为规范》？","answer":"王律师的行为违反了《律师执业行为规范》的规定，律师不得违法与委托人就争议的权益产生经济上的联系，不得委托他人为自己或为自己的近亲属收受委托人与他人发生争议的标的物。（《律师执业行为规范》第四十六条）","sources":[],"kw":"王律师的行为违反了《律师执业行为规范》的规定，律师不…","mnem":""},{"id":2,"q":"据《宪法》的规定，“根据中华人民共和国主席的提名，决定国务院总理的人选”属于哪个权力机关的职权？","answer":"全国人民代表大会。","sources":[],"kw":"全国人民代表大会。","mnem":""},{"id":3,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，申请人申请复查必须具备哪些条件？","answer":"根据《律师协会会员违规行为处分规则（试行）》第九十七条规定，申请复查的会员为申请人应当具备以下条件：（一）所申请复查的决定应当是本省、区、直辖市律师协会惩戒委员会或者设区的市律师协会惩戒委员会作出的；（二）复查申请应当包括具体的复查请求、事实和证据；（三）复查申请必须在规定的期限内提出。","sources":[],"kw":"所申请复查的决定应当是本省、区、…；复查申请应当包括具体的复查请求、…；复查申请必须在规定的期限内提出","mnem":"所申/复查/复查"},{"id":4,"q":"根据《宪法》的规定，哪个权力机关具有“监督国务院、中央军事委员会、最高人民法院和最高人民检察院的工作”的职权?","answer":"全国人民代表大会常务委员会。","sources":[],"kw":"全国人民代表大会常务委员会。","mnem":""},{"id":5,"q":"根据《宪法》的规定，我国公民对于任何国家机关和国家工作人员，有哪些权利？对于国家机关和国家工作人员的违法失职行为，有哪些权利？","answer":"我国公民对于任何国家机关和国家工作人员，有提出批评和建议的权利。对于国家机关和国家工作人员的违法失职行为，有向有关国家机关提出申诉、控告或者检举的权利，但是不得捏造或者歪曲事实进行诬告陷害。","sources":[],"kw":"我国公民对于任何国家机关和国家工作人员，有提出批评和…","mnem":""},{"id":6,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，收取规定、约定之外的费用或者财物的，是否属于违规行为？如是，将会受到何种处分？","answer":"给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"给予训诫、警告或者通报批评的纪律…；情节严重的，给予公开谴责、中止会…","mnem":"给予/情节"},{"id":7,"q":"根据《上海市律师协会律师执业行为规范》规定，请阐述律师在接受刑事辩护委托后，哪些情形下应当提出事实不清、证据不足辩护意见？","answer":"根据《上海市律师协会律师执业行为规范》第七十一条规定，律师在接受刑事辩护委托后，刑事辩护证据不足以否认有罪指控，或是不足以证明犯罪情节较轻，应当提出事实不清、证据不足辩护意见。","sources":[],"kw":"，律师在接受刑事辩护委托后，刑事辩护证据不足以否认有…","mnem":""},{"id":8,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，除通过证券交易所进行交易持有某公司股份外，某律师为某公司的股东，又担任该公司在对抗性案件或者非诉讼业务中对方当事人的代理人，属于直接的利益冲突还是间接的利益冲突？","answer":"属于间接的利益冲突。","sources":[],"kw":"属于间接的利益冲突。","mnem":""},{"id":9,"q":"请简述《宪法》中关于人民法院审判制度的基本原则。","answer":"（1）公开审判原则。人民法院审理案件，除法律规定的特别情况外，一律公开进行。被告人有权获得辩护。（2）独立审判原则。人民法院依照法律规定独立行使审判权，不受行政机关、社会团体和个人的干涉。","sources":[],"kw":"公开审判原则。人民法院审理案件，…；独立审判原则。人民法院依照法律规…","mnem":"公开/独立"},{"id":10,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，同一律师事务所律师在对抗性案件或非诉讼案件中结束与一方当事人的委托关系后，在同一案件后续审理或处理中又接受对方当事人委托的，属于直接的利益冲突还是间接的利益冲突？","answer":"属于直接的利益冲突。","sources":[],"kw":"属于直接的利益冲突。","mnem":""},{"id":11,"q":"我国宪法修改由谁提议？由谁通过？","answer":"宪法的修改，由全国人民代表大会常务委员会或者五分之一以上的全国人民代表大会代表提议，并由全国人民代表大会以全体代表的三分之二以上的多数通过。","sources":[],"kw":"宪法的修改，由全国人民代表大会常务委员会或者五分之一…","mnem":""},{"id":12,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，律师会员处分复查机构的人员组成有哪些？","answer":"根据《律师协会会员违规行为处分规则（试行）》第七十五条，复查委员会应当由业内和业外人士组成。业内人士包括：执业律师、律师协会及司法行政机关工作人员；业外人士包括：法学界专家、教授；司法机关或者其他机关、组织的有关人员。","sources":[],"kw":"，复查委员会应当由业内和业外人士…；业外人士包括：法学界专家、教授；司法机关或者其他机关、组织的有关…","mnem":"，复/业外/司法"},{"id":13,"q":"根据宪法的规定，中华人民共和国主席行使哪些宪法职权不需要依据全国人民代表大会的决定和全国人民代表大会常务委员会的决定？请列举至少四项。","answer":"中华人民共和国主席（1）任免国务院总理、副总理、国务委员、各部部长、各委员会主任、审计长、秘书长；（2）授予国家的勋章和荣誉称号；（3）发布特赦令；（4）宣布进入紧急状态；（5）宣布战争状态，发布动员令；（6）代表中华人民共和国，进行国事活动，接受外国使节；（7）批准和废除同外国缔结的条约和重要协定。","sources":[],"kw":"任免国务院总理、副总理、国务委员…；授予国家的勋章和荣誉称号；发布特赦令；宣布进入紧急状态；宣布战争状态，发布动员令；代表中华人民共和国，进行国事活动…","mnem":"任免/授予/发布/宣布/宣布/代表"},{"id":14,"q":"根据《上海市律师协会律师执业行为规范》规定，律师担任代理人参加法庭审理，是否必须按照中华全国律师协会的规定着律师袍。","answer":"是，律师担任代理人参加法庭审理，必须按照中华全国律师协会的规定着律师袍。","sources":[],"kw":"是，律师担任代理人参加法庭审理，必须按照中华全国律师…","mnem":""},{"id":15,"q":"根据《上海市律师协会律师执业行为规范》规定，接受这一聘请会明显妨碍律师开展其他工作的风险，是否属于律师收费应当考虑的合理因素？","answer":"属于律师收费应当考虑的合理因素。","sources":[],"kw":"属于律师收费应当考虑的合理因素。","mnem":""},{"id":16,"q":"根据全国律协《律师职业道德和执业纪律规范》的规定，律师在收费方面，应当避免以怎样的方式进行不正当竞争？","answer":"律师不得以明显低于同业的收费水平竞争某项法律事务。","sources":[],"kw":"律师不得以明显低于同业的收费水平竞争某项法律事务","mnem":""},{"id":17,"q":"宋律师的大学同学因民间借贷纠纷委托宋律师代位诉讼，宋律师碍于情面以个人名义象征性的收取了费用，该费用直接打入了宋律师个人账户。请问宋律师违反了《律师职业道德和执业纪律规范》中的哪条规定？","answer":"违反了全国律协《律师职业道德和执业纪律规范》第十五条的规定：律师不得以个人名义私自接受委托，不得私自收取费用。","sources":[],"kw":"违反了全国律协《律师职业道德和执业纪律规范》第十五条…","mnem":""},{"id":18,"q":"根据《律师职业道德和执业纪律规定》第三十三条规定，律师接受委托后，如存在当事人频繁询问案件进展信息的情形时，是否可以解除委托？","answer":"不可以。根据《律师职业道德和执业纪律规定》第三十三条规定，律师接受委托后无正当理由不得拒绝为委托人代理。","sources":[],"kw":"","mnem":""},{"id":19,"q":"A律师曾任上海市人民代表大会常委会组成人员，卸任后拟接受客户委托，就一起买卖合同纠纷案件向某法院提起民事诉讼，请问A律师的行为是否违反《律师法》的规定？","answer":"不属于违法行为。根据《律师法》的规定，律师担任各级人民代表大会常务委员会组成人员的，任职期间不得从事诉讼代理或者辩护业务。本案中，A律师虽曾就任于上海市人民代表大会常委会，但现已卸任，因此A律师可以接受客户委托从事诉讼代理业务。","sources":[],"kw":"违法行为","mnem":""},{"id":20,"q":"根据《上海律师执业利益冲突认定和处理规则》的规定，在发现自己代理或者将要代理的案件存在利益冲突的，李律师应当如何履行告知义务？","answer":"发现利益冲突后，律师及律师事务所应当立即履行告知义务，告知当事人相关事实和不能接受委托或者接受委托可能产生的后果，并应当自行依据本规则规定的绝对禁止、相对禁止及豁免的情形，予以处理。发现利益冲突后，律师事务所应当设置必要的人员和文本隔离制度。（《上海律师执业利益冲突认定和处理规则》2023版本第十五条）","sources":[],"kw":"发现利益冲突后，律师及律师事务所应当立即履行告知义务…","mnem":""},{"id":21,"q":"律师王某同时在律师事务所和其他法律服务机构执业，根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，是否属于违规行为？如果是，将会受到何种处分？","answer":"属于违规行为，律师王某将会受到省、自治区、直辖市及设区的市律师协会给予的训诫、通报批评、公开谴责的处分。情节严重的，给予中止会员权利1个月以上3个月以下的处分。","sources":[],"kw":"违规行为，律师王某将会受到省、自治区、直辖市及设区的…","mnem":""},{"id":22,"q":"根据《律师协会会员违规行为处分规则（试行）》，分析下述情形。律师李某是A公司的常年法律顾问。在为A公司提供法律服务期间，他得知B公司有意对A公司提起诉讼，并正在寻求法律代理。由于李某与B公司的负责人有私人交情，他决定同时接受B公司的委托，为其在这起诉讼中提供法律代理服务。","answer":"根据全国律协《律师协会会员违规行为处分规则（试行）》，律师在担任法律顾问期间，不能为顾问单位的对方当事人或者有利益冲突的当事人代理、辩护，因为这可能导致利益冲突，损害顾问单位的利益，破坏律师与客户之间的信任关系。如果律师违反这一规定，将会受到省、自治区、直辖市及设区的市律师协会给予的训诫、通报批评、公开谴责等处分。这些处分旨在维护律师行业的职业道德和公众信任，确保律师为客户提供忠诚、专业的服务。","sources":[],"kw":"根据全国律协《律师协会会员违规行为处分规则（试行）》…","mnem":""},{"id":23,"q":"请根据宪法规定判断，中央军事委员会是否享有领导和管理国防建设事业的职权？","answer":"不享有，依据宪法规定，领导和管理国防建设事业属于国务院的职权。","sources":[],"kw":"不享有，依据宪法规定，领导和管理国防建设事业属于国务…","mnem":""},{"id":24,"q":"根据司法部《律师和律师事务所违法行为处罚办法》，请简述律师因非执业事由受到刑事处罚时的处罚规定？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第四十二条的规定，律师因违法执业构成故意犯罪或者因非执业事由构成故意犯罪受到刑事处罚的，司法行政机关应当吊销其律师执业证书；因过失犯罪受到刑事处罚的，在其服刑或者执行缓刑期间应当停止履行律师职务，刑期届满后可再申请恢复执业。","sources":[],"kw":"根据司法部《律师和律师事务所违法…；因过失犯罪受到刑事处罚的，在其服…","mnem":"根据/因过"},{"id":25,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，复查委员会自收到申请复查书之日起十个工作日内应当作出什么处理？","answer":"根据《律师协会会员违规行为处分规则（试行）》第八十一条，对于符合申请复查条件的，复查委员会应当作出受理决定，并通知申请人；对于不符合复查条件的，不予复查。","sources":[],"kw":"，对于符合申请复查条件的，复查委…；对于不符合复查条件的，不予复查","mnem":"，对/对于"},{"id":26,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，律师不按规定与委托人签订书面委托合同的行为是否属于违规行为？如是，将会受到何种处分？","answer":"给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"给予训诫、警告或者通报批评的纪律…；情节严重的，给予公开谴责、中止会…","mnem":"给予/情节"},{"id":27,"q":"根据《律师法》的规定，律师在法庭上发表的代理、辩护意见会受到法律追究的情况有哪些？","answer":"律师在法庭上发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序的言论或意见的，会受到法律追究。（第三十七条）","sources":[],"kw":"律师在法庭上发表危害国家安全、恶意诽谤他人、严重扰乱…","mnem":""},{"id":28,"q":"简述全国律协《律师职业道德和执业纪律规范》规定的律师职业道德的基本准则中，关于律师应当如何处理与委托人的关系的内容。","answer":"（1）应当诚实守信，勤勉尽责，尽职尽责地维护委托人的合法利益；（2）应当保守委托人的商业秘密及委托人的隐私。","sources":[],"kw":"应当保守委托人的商业秘密及委托人的隐私。","mnem":""},{"id":29,"q":"根据《上海市律师协会律师执业行为规范》规定，声称或暗示自己是某一领域的专家的，是否属于采用不正当手段与同行进行业务竞争？","answer":"属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":30,"q":"简述《宪法》中关于男女平等原则在政治参与方面的具体体现。","answer":"《宪法》规定中华人民共和国妇女在政治的、经济的、文化的、社会的和家庭的生活等各方面享有同男子平等的权利。在政治参与方面，这包括妇女有权依法参与国家事务的管理，如选举和被选举为各级人民代表大会代表，参与国家政策的制定和决策过程，以及担任国家公职等。此外，国家还积极培养和选拔妇女干部。","sources":[],"kw":"规定中华人民共和国妇女在政治的、经济的、文化的、社会…","mnem":""},{"id":31,"q":"某律师在代理一起执行案件的过程中，妨碍执法人员对其代理的被执行人名下的财产依法进行查封。该律师违反了《上海市律师协会律师执业行为规范》规定的“律师在执业活动中不得从事，或者协助、诱使他人从事”的哪一行为？","answer":"妨碍国家司法、行政机关依法行使权力的行为。","sources":[],"kw":"妨碍国家司法、行政机关依法行使权力的行为。","mnem":""},{"id":32,"q":"根据司法部《律师和律师事务所违法行为处罚办法》，列举出司法行政机关可以从轻或减轻对违法律师的行政处罚的几种情形。","answer":"(一)主动消除或者减轻违法行为危害后果的；(二)主动报告，积极配合司法行政机关查处违法行为的；(三)受他人胁迫实施违法行为的；(四)其他依法应当从轻或者减轻处罚的。","sources":[],"kw":"主动消除或者减轻违法行为危害后果…；主动报告，积极配合司法行政机关查…；受他人胁迫实施违法行为的；其他依法应当从轻或者减轻处罚的","mnem":"主动/主动/受他/其他"},{"id":33,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，利用提供法律服务的便利，为阻挠当事人解除委托关系，威胁、恐吓当事人或者扣留当事人提供的材料，是否属于违规行为？如是，将会受到何种处分？","answer":"属于违规行为。给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利三个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"属于违规行为。给予训诫、警告或者…；情节严重的，给予公开谴责、中止会…","mnem":"属于/情节"},{"id":34,"q":"据《宪法》的规定，全国人民代表大会有哪些职权？（列举三个即可）。","answer":"（一）修改宪法；（二）监督宪法的实施；（三）制定和修改刑事、民事、国家机构的和其他的基本法律；（四）选举中华人民共和国主席、副主席；（五）根据中华人民共和国主席的提名，决定国务院总理的人选；根据国务院总理的提名，决定国务院副总理、国务委员、各部部长、各委员会主任、审计长、秘书长的人选；（六）选举中央军事委员会主席；根据中央军事委员会主席的提名，决定中央军事委员会其他组成人员的人选；（七）选举国家监察委员会主任；（八）选举最高人民法院院长；（九）选举最高人民检察院检察长；（十）审查和批准国民经济和社会发展计划和计划执行情况的报告；（十一）审查和批准国家的预算和预算执行情况的报告；（十二）改变或者撤销全国人民代表大会常务委员会不适当的决定；（十三）批准省、自治区和直辖市的建置；（十四）决定特别行政区的设立及其制度；（十五）决定战争和和平的问题；（十六）应当由最高国家权力机关行使的其他职权。","sources":[],"kw":"选举中华人民共和国主席、副主席；根据中华人民共和国主席的提名，决…；选举中央军事委员会主席；根据中央…；选举国家监察委员会主任；选举最高人民法院院长；选举最高人民检察院检察长","mnem":"选举/根据/选举/选举/选举/选举"},{"id":35,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》，请简述利益冲突的定义？","answer":"利益冲突是指上海律师协会会员在执行当事人委托事务时，因自身利益(即直接利益冲突)或者受当事人之间利害关系影响（即间接利益冲突），可能损害当事人权益的情形。（本题答案存疑，因为该法条已于2023年修改，当前上海律协已无“直接利冲”和“间接利冲”的概念，但新法条中未对利益冲突做定义。）","sources":[],"kw":"利益冲突是指上海律师协会会员在执行当事人委托事务时，…","mnem":""},{"id":36,"q":"律师为某刑事案件中犯罪嫌疑人担任辩护人，现该犯罪嫌疑人因涉嫌贩卖毒品罪被公安机关抓捕并羁押在看守所。根据《律师法》的规定，目前阶段律师是否有权查阅、摘抄、复制案件的案卷材料？若没有，那么何时起有权查阅、摘抄、复制案件的案卷材料？","answer":"没有权利。根据《律师法》的规定，律师担任辩护人的，自人民检察院对案件审查起诉之日起，有权查阅、摘抄、复制案件的案卷材料。","sources":[],"kw":"没有权利","mnem":""},{"id":37,"q":"司法部能否干涉审计机关？请根据宪法规定简述理由。","answer":"依照《宪法》规定，审计机关依照法律规定独立行使审计监督权，不受其他行政机关、社会团体和个人的干涉。司法部属于行政机关，依法不得干涉审计机关立行使审计监督权。","sources":[],"kw":"依照《宪法》规定，审计机关依照法律规定独立行使审计监…","mnem":""},{"id":38,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪些行为属于律师“拒绝履行法律援助义务”的违法行为？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第九条规定：有下列情形之一的，属于律师“拒绝履行法律援助义务的”违法行为：（一）无正当理由拒绝接受律师事务所或者法律援助机构指派的法律援助案件的；（二）接受指派后，懈怠履行或者擅自停止履行法律援助职责的。","sources":[],"kw":"无正当理由拒绝接受律师事务所或者…；接受指派后，懈怠履行或者擅自停止…","mnem":"无正/接受"},{"id":39,"q":"根据《上海市律师协会律师执业行为规范》规定，散布炫耀自己，贬低、排斥同行的言论的，是否属于采用不正当手段与同行进行业务竞争？","answer":"属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":40,"q":"根据《上海市律师协会律师执业行为规范》规定，与司法人员交换电话、电子邮箱或微信联系方式的，是否属于采用不正当手段与同行进行业务竞争？","answer":"不属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"不属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":41,"q":"张律师接受某刑事案件犯罪嫌疑人陈某的委托，在侦查阶段为陈某提供法律咨询和帮助。在为陈某提供法律帮助过程中，张律师从陈某处获知了其还犯有公安机关尚未掌握的另一起刑事案件的情况，便向公安机关举报陈某该起案件的事实，请问张律师的行为是否符合相关规定？","answer":"张律师的行为严重损害了委托人的合法权益。根据《律师法》第三十八条，律师应当保守在执业活动中知悉的国家秘密、商业秘密，不得泄露当事人的隐私。律师对在执业活动中知悉的委托人和其他人不愿泄露的有关情况和信息，应当予以保密。但是，委托人或者其他人准备或者正在实施危害国家安全、公共安全以及严重危害他人人身安全的犯罪事实和信息除外。本题中的陈某所犯罪行如不属于以上三种，则张律师不应向公安机关报案。（《律师法》第三十八条）","sources":[],"kw":"张律师的行为严重损害了委托人的合法权益","mnem":""},{"id":42,"q":"根据《律师法》的规定，律师在法庭上发表的代理、辩护意见不受法律追究。但有哪几种情况除外？","answer":"律师发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序的言论除外。（《律师法》第三十七条）","sources":[],"kw":"律师发表危害国家安全、恶意诽谤他人、严重扰乱法庭秩序…","mnem":""},{"id":43,"q":"在一借款合同诉讼案件中，王律师代理原告。因担心原告诉求已丧失诉讼时效，王律师通过委托人联系，要求曾为被告公司副总现已离职的张先生出具一份原告曾在张先生在职时原告向其催讨借款的虚假说明。问:根据全国律协《律师协会会员违规行为处分规则》，王律师会受到哪几种处分?","answer":"王律师的行为会受到省、自治区、直辖市或设区的市律师协会的1）训诫；2）警告；3）通报批评；4）公开谴责；5）中止会员权利1个月以上,1年以下的处分。（本题答案疑似有问题，系参照老法条）","sources":[],"kw":"训诫；警告；通报批评；公开谴责；中止会员权利1个月以上,1年以下…","mnem":"训诫/警告/通报/公开/中止"},{"id":44,"q":"根据《上海市律师协会律师执业行为规范》规定，对于当事人在相当程度上没有履行委托合同义务，并且已经合理催告的，律师可否拒绝辩护、代理？","answer":"可以。","sources":[],"kw":"可以。","mnem":""},{"id":45,"q":"根据全国律协《律师职业道德和执业纪律规范》，律师在收费方面应当注意遵循哪些在执业机构中的纪律？","answer":"（1）律师不得以个人名义私自接受委托，不得私自收取费用；（2）律师不得违反律师事务所收费制度和财务纪律，挪用、私分、侵占业务收费。","sources":[],"kw":"律师不得违反律师事务所收费制度和财务纪律，挪用、私分…","mnem":""},{"id":46,"q":"我国《宪法》规定：“国家维护社会主义法制的统一和尊严，一切法律、行政法规和地方性法规都不得同宪法相抵触。”这体现了《宪法》的什么原则？","answer":"依法治国原则。","sources":[],"kw":"依法治国原则。","mnem":""},{"id":47,"q":"根据《律师法》的规定，律师事务所不能满足法定设立条件，是否即属于律师事务所应当终止的情形？","answer":"不属于。律师事务不能保持法定设立条件，经限期整改仍不符合条件的，方属应当终止的情形。","sources":[],"kw":"","mnem":""},{"id":48,"q":"据《宪法》的规定，“选举国家监察委员会主任”属于哪个权力机关的职权？","answer":"全国人民代表大会。","sources":[],"kw":"全国人民代表大会。","mnem":""},{"id":49,"q":"李律师受当事人张某委托保管其价值千万的画册，因张某的画册正涉权属纠纷诉讼，张某赢得官司以后，李律师却想将画册据为己有，便告知张某画册已被法院拿去进行权属登记，请问李律师的行为是否符合相关规定？","answer":"李律师的做法违反《律师职业道德和执业纪律规定》第三十五条第二款，律师不得挪用或者侵占代委托人保管的财物。李律师应当立即将画册归还给当事人。（《律师职业道德和执业纪律规定》第三十五条）","sources":[],"kw":"李律师的做法违反《律师职业道德和执业纪律规定》第三十…","mnem":""},{"id":50,"q":"王律师在被处以停止执业期间，私自接受委托，承办法律事务，请问王律师该行为有无违法？如有，应该受到何种处罚？","answer":"王律师的行为属于违法情况。根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处一万元以下的罚款;有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚。","sources":[],"kw":"王律师的行为属于违法情况。根据司…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"王律/有违/情节"},{"id":51,"q":"根据《律师法》的规定，律师违法执业给当事人造成损失的，如何承担赔偿责任？","answer":"由其所在的律师事务所承担赔偿责任。律师事务所赔偿后，可以向有故意或者重大过失行为的律师追偿。（第五十四条）","sources":[],"kw":"由其所在的律师事务所承担赔偿责任","mnem":""},{"id":52,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十一条的规定，司法行政机关对律师的违法行为给予吊销执业证书处罚的，具体应由律师执业机构所在地的哪一级司法行政机关来负责实施？","answer":"由许可该律师执业的省、自治区、直辖市司法行政机关实施。","sources":[],"kw":"由许可该律师执业的省、自治区、直辖市司法行政机关实施","mnem":""},{"id":53,"q":"根据《宪法》的规定，我国国家机构的运行实行什么原则？并请对该原则进行说明。","answer":"民主集中制。全国人民代表大会和地方各级人民代表大会都由民主选举产生，对人民负责，受人民监督。国家行政机关、监察机关、审判机关、检察机关都由人民代表大会产生，对它负责，受它监督。中央和地方的国家机构职权的划分，遵循在中央的统一领导下，充分发挥地方的主动性、积极性的原则。","sources":[],"kw":"民主集中制","mnem":""},{"id":54,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，律师事务所与当事人存在法律服务关系，在某一对抗性案件中该当事人未要求该律师事务所担任其代理人，而该律师事务所其他律师担任该当事人在该案件中对方当事人的代理人，是否属于直接的利益冲突情形？","answer":"不是，此种情形构成间接的利益冲突。（本题法条已经更改，目前上海律协无直接/间接利冲这一概念）","sources":[],"kw":"不是，此种情形构成间接的利益冲突","mnem":""},{"id":55,"q":"根据《律师法》的规定，律师担任辩护人的，若持身份证、律师执业证书、法律援助公函，能否会见在押或者被监视居住的犯罪嫌疑人、被告人？若不能，那应该持哪些材料？","answer":"不能。应当持律师执业证书、律师事务所证明和委托书或者法律援助公函。","sources":[],"kw":"不能","mnem":""},{"id":56,"q":"某律师在代理一起仲裁案件过程中，协助当事人向仲裁员行贿，怂恿仲裁员作出有利于己方的裁决。该律师违反了《上海市律师协会律师执业行为规范》规定的“律师在执业活动中不得从事，或者协助、诱使他人从事”的哪一行为？","answer":"协助或纵恿司法人员或仲裁人员进行违反法律的行为。","sources":[],"kw":"协助或纵恿司法人员或仲裁人员进行违反法律的行为","mnem":""},{"id":57,"q":"王先生因民间借贷合同纠纷找到杨律师咨询，杨律师经过分析发现缺少一项重要证据，导致证据链不完整，但为了拿到委托，杨律师故意忽略该风险，承诺王先生肯定胜诉。请问杨律师违反了全国律协《律师职业道德和执业纪律规范》中的哪条规定？","answer":"违反《律师职业道德和执业纪律规范》中第26条规定：律师应当遵循诚实守信的原则，客观地告知委托人所委托事项可能出现的法律风险，不得故意对可能出现的风险做不恰当的表述或做虚假承诺。","sources":[],"kw":"违反《律师职业道德和执业纪律规范》中第26条规定：律…","mnem":""},{"id":58,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，对于惩戒委员会不予立案的，律师协会应当如何告知投诉人？","answer":"根据《律师协会会员违规行为处分规则（试行）》第五十条规定，对不予立案的，律师协会应当在惩戒委员会决定作出之日起七个工作日内向投诉人书面说明不予立案的理由，但匿名投诉的除外。","sources":[],"kw":"，对不予立案的，律师协会应当在惩戒委员会决定作出之日…","mnem":""},{"id":59,"q":"简述民族自治地方人民代表大会在制定自治条例和单行条例方面的权限和程序。","answer":"民族自治地方的人民代表大会有权依照当地民族的政治、经济和文化的特点，制定自治条例和单行条例。自治区的自治条例和单行条例，报全国人民代表大会常务委员会批准后生效。自治州、自治县的自治条例和单行条例，报省或者自治区的人民代表大会常务委员会批准后生效，并报全国人民代表大会常务委员会备案。","sources":[],"kw":"民族自治地方的人民代表大会有权依照当地民族的政治、经…","mnem":""},{"id":60,"q":"在公共交通上，如果司机怀疑乘客携带了危险品，直接搜查乘客的行李，是否属于违法行为？","answer":"属于违法行为。根据《中华人民共和国宪法》的规定，中华人民共和国公民的人身自由不受侵犯。任何公民，非经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，不受逮捕。禁止非法拘禁和以其他方法非法剥夺或者限制公民的人身自由，禁止非法搜查公民的身体。","sources":[],"kw":"违法行为","mnem":""},{"id":61,"q":"据《宪法》的规定，“改变或者撤销全国人民代表大会常务委员会不适当的决定”属于哪个权力机关的职权？","answer":"全国人民代表大会。","sources":[],"kw":"全国人民代表大会。","mnem":""},{"id":62,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，投诉人可以采用哪些方式对律师及律师事务所进行投诉？","answer":"根据《律师协会会员违规行为处分规则（试行）》第四十三条规定，投诉人可以采用信函、邮件和直接来访等方式投诉，也可以委托他人代为投诉。","sources":[],"kw":"，投诉人可以采用信函、邮件和直接来访等方式投诉，也可…","mnem":""},{"id":63,"q":"据《律师法》《律师执业管理办法》《上海市律师执业利益冲突认定和处理规则》等规定律师事务所应当如何进行利益冲突审查？","answer":"律师事务所应当根据本所业务状况制定利益冲突的审查流程或制度，配备人员负责利益冲突的查证评估。在接受委托前，律师事务所应当审查是否存在利益冲突的情形，律师应当配合律师事务所对利益冲突进行审查，并主动申报或者说明自身知晓的存在利益冲突的情形。律师就利益冲突情形主动申报或者作出说明的，律师事务所应就申报或者说明内容再次审查。","sources":[],"kw":"律师事务所应当根据本所业务状况制定利益冲突的审查流程…","mnem":""},{"id":64,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，申请人申请复查应当以书面形式提出，内容应当包括哪些？","answer":"根据《律师协会会员违规行为处分规则（试行）》第八十条规定：复查申请应当以书面形式提出，内容包括：（一）申请人的姓名或者单位名称、地址、执业证书号码及电话等；（二）作出原决定的律师协会惩戒委员会名称；（三）复查申请的具体事实、理由、证据和要求等；（四）提起复查申请的日期；（五）惩戒委员处分决定书。","sources":[],"kw":"申请人的姓名或者单位名称、地址、…；作出原决定的律师协会惩戒委员会名…；复查申请的具体事实、理由、证据和…；提起复查申请的日期；惩戒委员处分决定书","mnem":"申请/作出/复查/提起/惩戒"},{"id":65,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，律师事务所无正当理由拒绝接受法律援助机构指派的法律援助案件；或者接受指派后，不按规定及时安排本所律师承办法律援助案件或者拒绝为法律援助案件的办理提供条件和便利的，将会受到何种处分？","answer":"给予警告、通报批评或者公开谴责的纪律处分；情节严重的，给予中止会员权利一个月以上六个月以下的纪律处分；情节特别严重的，给予取消会员资格的纪律处分。【注意是律师事务所】","sources":[],"kw":"给予警告、通报批评或者公开谴责的…；情节严重的，给予中止会员权利一个…；情节特别严重的，给予取消会员资格…","mnem":"给予/情节/情节"},{"id":66,"q":"根据《律师法》第四十条的规定，请列举至少五项律师在执业活动中有哪些不得进行的行为。","answer":"（一）私自接受委托、收取费用，接受委托人的财物或者其他利益；（二）利用提供法律服务的便利牟取当事人争议的权益；（三）接受对方当事人的财物或者其他利益，与对方当事人或者第三人恶意串通，侵害委托人的权益；（四）违反规定会见法官、检察官、仲裁员以及其他有关工作人员；（五）向法官、检察官、仲裁员以及其他有关工作人员行贿，介绍贿赂或者指使、诱导当事人行贿，或者以其他不正当方式影响法官、检察官、仲裁员以及其他有关工作人员依法办理案件；（六）故意提供虚假证据或者威胁、利诱他人提供虚假证据，妨碍对方当事人合法取得证据；","sources":[],"kw":"接受对方当事人的财物或者其他利益…；违反规定会见法官、检察官、仲裁员…；向法官、检察官、仲裁员以及其他有…；故意提供虚假证据或者威胁、利诱他…","mnem":"接受/违反/向法/故意"},{"id":67,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，哪种情况下复查庭应当作出维持原处分决定？","answer":"根据《律师协会会员违规行为处分规则（试行）》第八十四条规定，复查庭认为原处分决定认定事实清楚，责任区分适当，适用依据正确，程序合法的，应当作出维持原处分决定。","sources":[],"kw":"，复查庭认为原处分决定认定事实清楚，责任区分适当，适…","mnem":""},{"id":68,"q":"根据《上海市律师协会律师执业行为规范》规定，采用承诺给予客户回扣方式争揽业务的，是否属于采用不正当手段与同行进行业务竞争？","answer":"属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":69,"q":"根据《律师法》的规定，律师在同一案件中为双方当事人担任代理人，应处以怎样的处罚？","answer":"设区的市级或者直辖市的区人民政府司法行政部门给予警告，可以处五千元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以下的处罚。（第四十七条）","sources":[],"kw":"设区的市级或者直辖市的区人民政府…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"设区/有违/情节"},{"id":70,"q":"市级人民代表大会的代表是否可以直接选举，并列举三个可以直接选举人大代表的行政区域请依据宪法作答。","answer":"依据宪法规定，不设区的市可以直接选举人大代表，设区的市不可以直接选举。依据宪法规定，县、不设区的市、市辖区、乡、民族乡、镇的人民代表大会代表由选民直接选举。","sources":[],"kw":"依据宪法规定，不设区的市可以直接选举人大代表，设区的…","mnem":""},{"id":71,"q":"在哪些情形下，律师应不予见证，拒绝出具《律师见证书》？","answer":"委托人权利能力/行为能力有瑕疵；委托人无权委托；委托人在委托见证事项中的意思表示不真实；委托见证事项的内容或所涉标的违反法律的禁止性或强制性规定，且委托人不同意纠正或补救的；委托见证事项的事实不清或有其他重大瑕疵；发现委托人有违法动机或目的。（《上海市律师见证业务操作指引》第5.1条）","sources":[],"kw":"委托人权利能力/行为能力有瑕疵；委托人无权委托；委托人在委托见证事项中的意思表示…；委托见证事项的内容或所涉标的违反…；委托见证事项的事实不清或有其他重…；发现委托人有违法动机或目的","mnem":"委托/委托/委托/委托/委托/发现"},{"id":72,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师在承办代理、辩护业务期间，以影响案件办理结果为目的，在非工作时间、非工作场所会见法官、检察官、仲裁员或者其他有关工作人员的，属于《律师法》规定的何种违法行为？","answer":"属于《律师法》规定的律师“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案”的违法行为。","sources":[],"kw":"《律师法》规定的律师“违反规定会见法官、检察官、仲裁…","mnem":""},{"id":73,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，律师事务所律师在结束代理当事人的对抗性案件或非诉讼业务的一年之内，同一律师事务所其他律师担任该当事人在对抗性案件或者非诉讼业务中对方当事人的代理人，是否属于间接的利益冲突情形？","answer":"答：此种情形如果超过半年，则不属于。根据规定，律师事务所律师在结束代理当事人的对抗性案件或非诉讼业务的半年之内，同一律师事务所其他律师担任该当事人在对抗性案件或者非诉讼业务中对方当事人的代理人，属于间接的利益冲突情形。","sources":[],"kw":"此种情形如果超过半年，则不属于","mnem":""},{"id":74,"q":"根据《律师法》的规定，律师自行调查取证的，可否凭当事人的委托书向有关单位或者个人调查与承办法律事务有关的情况？若不能，需要哪些材料？","answer":"不能。需要凭律师执业证书和律师事务所证明。","sources":[],"kw":"不能。需要凭律师执业证书和律师事务所证明。","mnem":""},{"id":75,"q":"律师面对与同行竞争时，应当遵循全国律协《律师职业道德和执业纪律规范》规定的哪一律师职业道德的基本准则？","answer":"应当尊重同行，同业互助，公平竞争，共同提高执业水平。","sources":[],"kw":"尊重同行，同业互助，公平竞争，共同提高执业水平","mnem":""},{"id":76,"q":"某律师在代理一起诉讼案件的过程中，由于一审败诉，便暗示委托人其能通过权势影响二审法院，使委托人在二审时获得有利判决。该律师违反了《上海市律师协会律师执业行为规范》规定的“律师在执业活动中不得从事，或者协助、诱使他人从事”的哪一行为？","answer":"声明或暗示具有某种能力，可能不恰当地影响国家司法、行政机关改变既定意见的行为。","sources":[],"kw":"声明或暗示具有某种能力，可能不恰当地影响国家司法、行…","mnem":""},{"id":77,"q":"根据《宪法》的规定，我国公民对于任何国家机关和国家工作人员，有哪些权利？","answer":"有提出批评和建议的权利。","sources":[],"kw":"有提出批评和建议的权利。","mnem":""},{"id":78,"q":"根据《上海市律师协会律师执业行为规范》规定，非法泄露收费报价或者其他提供法律服务的条件等暂未公开的信息，是否属于律师和律师事务所相互之间采用手段排挤竞争对手的公平竞争，损害当事人的利益或者社会公共利益?","answer":"属于律师和律师事务所相互之间采用手段排挤竞争对手的公平竞争，损害当事人的利益或者社会公共利益。","sources":[],"kw":"律师和律师事务所相互之间采用手段排挤竞争对手的公平竞…","mnem":""},{"id":79,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，对于不能提供相关证据材料或证据材料不足的，惩戒委员会应当作出何种决定？","answer":"根据《律师协会会员违规行为处分规则（试行）》第四十九条规定，投诉人不能提供相关证据材料或证据材料不足的，应当不予立案。","sources":[],"kw":"，投诉人不能提供相关证据材料或证据材料不足的，应当不…","mnem":""},{"id":80,"q":"根据中华全国律师协会《律师协会会员违规行为处分规则（试行）》律师参与诉讼或者仲裁，在调查取证环节的行为规范有哪些？","answer":"律师行为规范有1）律师应当依法调查取证；2）律师不得向司法机关或者仲裁机构提交明知是虚假的证据；3）律师作为证人出庭作证的，不得再接受委托担任该案的辩护人或者代理人出庭。","sources":[],"kw":"律师应当依法调查取证；律师不得向司法机关或者仲裁机构提…；律师作为证人出庭作证的，不得再接…","mnem":"律师/律师/律师"},{"id":81,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第十七条规定，律师“妨碍对方当事人及其代理人、辩护人合法取证的，或者阻止他人向案件承办机关或者对方当事人提供证据的”，属于哪种违法行为？","answer":"“故意提供虚假证据或者威胁、利诱他人提供虚假证据，妨碍对方当事人合法取得证据”的违法行为。","sources":[],"kw":"“故意提供虚假证据或者威胁、利诱他人提供虚假证据，妨…","mnem":""},{"id":82,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，律师违反律师服务收费管理规定或者收费协议约定，擅自提高收费的，是否属于违规行为？如是，将会受到何种处分？","answer":"属于违规行为。将会受到省、自治区、直辖市及设区的市律师协会给予的训诫、通报批评、公开谴责的处分。","sources":[],"kw":"违规行为","mnem":""},{"id":83,"q":"根据《律师法》的规定，律师自行调查取证的，可否凭身份证、律师执业证书向有关单位或者个人调查与承办法律事务有关的情况？若不能，则需要的材料有哪些？","answer":"不能。需要凭律师执业证书和律师事务所证明。","sources":[],"kw":"不能。需要凭律师执业证书和律师事务所证明。","mnem":""},{"id":84,"q":"简述全国人民代表大会代表在全国人民代表大会各种会议上的发言和表决的法律保障。","answer":"全国人民代表大会代表在全国人民代表大会各种会议上的发言和表决，不受法律追究。这是为了保障全国人民代表大会代表能够充分、自由地表达他们的观点和意见，从而更好地履行他们的职责和代表人民的利益。这一法律保障体现了我国宪法和法律对全国人民代表大会代表言论和表决自由的尊重和保护。","sources":[],"kw":"全国人民代表大会代表在全国人民代表大会各种会议上的发…","mnem":""},{"id":85,"q":"在当事人豁免后，与李律师同一律师事务所的陈律师接受了当事人的委托，该案对方当事人系李律师的近亲属，陈律师是否能够就该案的情况与李律师进行交流？","answer":"不能。律师及律师事务所因取得豁免而接受委托的，在办理案件的过程中应当对当事人的案件信息予以保密，有利害关系的律师及律师事务所之间不得交流、披露与承办案件的相关信息。（上海市律师协会律师执业利益冲突认定和处理规则第十六条（2023修订） ）","sources":[],"kw":"不能","mnem":""},{"id":86,"q":"请依据宪法规定，简述宪法赋予国务院的外交职权。","answer":"依据宪法规定，国务院负责管理对外事务，同外国缔结条约和协定。","sources":[],"kw":"依据宪法规定，国务院负责管理对外事务，同外国缔结条约…","mnem":""},{"id":87,"q":"根据《律师法》的规定，律师根据事实和法律，提出犯罪嫌疑人、被告人无罪、罪轻或者减轻、免除其刑事责任的材料和意见是否属于律师担任辩护人的职责？除此之外，律师担任辩护人还有哪些职责？","answer":"属于律师担任辩护人的职责。此外，律师还应当根据事实和法律维护犯罪嫌疑人、被告人的诉讼权利和其他合法权益。","sources":[],"kw":"律师担任辩护人的职责","mnem":""},{"id":88,"q":"A律师现任某市某区人大代表，现其拟代表客户就一起买卖合同纠纷案件向某法院提起民事诉讼，请问A律师的行为是否违反《律师法》的规定？","answer":"不属于违法行为。根据《律师法》的规定，律师担任各级人民代表大会常务委员会组成人员的，任职期间不得从事诉讼代理或者辩护业务。本案中，A律师的身份为人大代表，而非人民代表大会常务委员会的组成人员，可以在任职期间从事诉讼业务。","sources":[],"kw":"违法行为","mnem":""},{"id":89,"q":"根据《宪法》的规定，中华人民共和国公民对于任何国家机关和国家工作人员，享有什么权利？由于国家机关和国家工作人员侵犯公民权利而受到损失的公民，拥有什么权利？","answer":"中华人民共和国公民对于任何国家机关和国家工作人员，有提出批评和建议的权利。由于国家机关和国家工作人员侵犯公民权利而受到损失的人，有依照法律规定取得赔偿的权利。","sources":[],"kw":"中华人民共和国公民对于任何国家机关和国家工作人员，有…","mnem":""},{"id":90,"q":"普法行为不仅有良好的社会效益，也是律师宣传自己的专业领域的途径之一。根据全国律协《律师职业道德和执业纪律规范》的规定，律师可以通过哪些方式普及法律，从而介绍自己的业务领域和专业特长？","answer":"可以通过文字作品、研讨会、简介等方式以普及法律，宣传自己的专业领域，推荐自己的专业特长","sources":[],"kw":"通过文字作品、研讨会、简介等方式以普及法律，宣传自己…","mnem":""},{"id":91,"q":"民族自治地方的自治机关在财政管理方面享有哪些自治权？","answer":"民族自治地方的自治机关有管理地方财政的自治权。凡是依照国家财政体制属于民族自治地方的财政收入，都应当由民族自治地方的自治机关自主地安排使用。","sources":[],"kw":"民族自治地方的自治机关有管理地方财政的自治权","mnem":""},{"id":92,"q":"属于《律师法》第四十七条第一项规定的律师“同时在两个以上律师事务所执业的”违法行为有哪些？","answer":"根据《律师法》第四十七条第一项规定，属于同时在两个以上律师事务所执业的违法行为有：（一）在律师事务所执业的同时又在其他律师事务所或者社会法律服务机构执业的；（二）在获准变更执业机构前以拟变更律师事务所律师的名义承办业务，或者在获准变更后仍以原所在律师事务所律师的名义承办业务的。","sources":[],"kw":"在律师事务所执业的同时又在其他律…；在获准变更执业机构前以拟变更律师…","mnem":"在律/在获"},{"id":93,"q":"《宪法》对宗教团体和宗教活动有何保护规定？","answer":"国家保护正常的宗教活动。任何人不得利用宗教进行破坏社会秩序、损害公民身体健康、妨碍国家教育制度的活动。宗教团体和宗教事务不受外国势力的支配。","sources":[],"kw":"国家保护正常的宗教活动","mnem":""},{"id":94,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，同一律师在结束代理当事人的对抗性案件或非诉讼委托业务后半年之后，又担任当事人在对抗性案件或非诉讼业务中对方当事人的代理人，是否构成直接的利益冲突情形？","answer":"不构成，结束代理后半年内又担任才构成。","sources":[],"kw":"不构成，结束代理后半年内又担任才构成。","mnem":""},{"id":95,"q":"根据全国律协《律师协会会员违规行为处分规则(试行)》的规定，复查程序中投诉人谅解违规会员的违规行为，复査庭应该作出何种决定?","answer":"根据《律师协会会员违规行为处分规则(试行)》第九十条规定，复查程序中，复查庭不进行调解，但投诉人谅解违规会员的违规行为的，复查庭可以予以认可，并作为变更原处分决定，从轻、减轻或者免除处分的依据。","sources":[],"kw":"，复查程序中，复查庭不进行调解，但投诉人谅解违规会员…","mnem":""},{"id":96,"q":"如我国要同外国缔结条约和协定，由哪个国家机关负责？请结合宪法作答","answer":"国务院。","sources":[],"kw":"国务院。","mnem":""},{"id":97,"q":"根据《上海市律师协会律师执业利益沖突认定和处理规则》规定，在间接利益冲突情形中，如果当事人拒绝豁免，但会员已经实施委托的（或绝大部分委托业务），（如果终止委托关系将造成委托人重大损失的）应如何处理？","answer":"会员已经实施委托的，应当停止实施，但是会员在收到拒绝豁免通知时已经完成了绝大部分委托业务，如果终止委托关系将造成委托人重大损失的，会员可以实施完毕委托业务，同时应当确保不发生损害利益冲突当事人的后果。","sources":[],"kw":"会员已经实施委托的，应当停止实施，但是会员在收到拒绝…","mnem":""},{"id":98,"q":"律师可以承办哪些见证业务？","answer":"各类经济合同的签订与履行行为：企少童程、董事会决议、转股协议等法律文书：继承、赠与、转让、侵書等民事行为;各种委托代理关系。（《律师见证业务工作细则》第十二条）","sources":[],"kw":"各类经济合同的签订与履行行为：企…；各种委托代理关系","mnem":"各类/各种"},{"id":99,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，如何获得间接利益冲突的豁免？","answer":"根据《上海市律师协会律师执业利益冲突认定和处理规则》第八条规定，应当立即将利益，中突的事实和可能产生的后果通知利益冲突的各方当事人，提请利益冲突的各方当事人在合理时间内给予豁免。在取得当事人的有效豁免前，会员不得接受委托应当谨慎接受委托或者实施委托。","sources":[],"kw":"，应当立即将利益，中突的事实和可能产生的后果通知利益…","mnem":""},{"id":100,"q":"2014年至2015年期间，李律师在本市A律师事务所实习，并顺利取得了律师执业证。2016年，李律师跳槽到本市B律师事务所工作，并办理完毕了全部转所手续。此时，李律师发现合伙人交办的一件案件（执行程序）的委托人恰好是实习期间曾经协助处理的某件案件（一审程序）的对方当事人。该情形是否属于是否利益冲突？如是，对于该情况李律师应当如何处理？","answer":"属于绝对禁止的利益冲中突。律师及律师事务所不得接受委托或者实施委托行为;已经接受委托的，停止实施委托行为，但需紧急处理的法律事务除外。李律师应当自觉向合伙人告知该情形，并征求合伙人的处理意见。（《上海律师执业利益冲突认定和处理规则》》2023版第十条四款、第十二条）","sources":[],"kw":"属于绝对禁止的利益冲中突。律师及…；已经接受委托的，停止实施委托行为…","mnem":"属于/已经"},{"id":101,"q":"律师私分业务收费的行为，违反了全国律协《律师职业道德和执业纪律规范》规定的哪一纪律？","answer":"律师不得违反律师事务所收费制度和财务纪律，挪用、私分、侵占业务收费。","sources":[],"kw":"律师不得违反律师事务所收费制度和财务纪律，挪用、私分…","mnem":""},{"id":102,"q":"根据《律师法》的规定，全国律师协会和地方律师协会章程的制定流程是怎样的？","answer":"全国律师协会章程由全国会员代表大会制定，报国务院司法行政部门备案。地方律师协会章程由地方会员代表大会制定，报同级司法行政部门备案。","sources":[],"kw":"全国律师协会章程由全国会员代表大会制定，报国务院司法…","mnem":""},{"id":103,"q":"根据《上海市律师协会律师执业行为规范》规定，律师的庭审发言用词是否必须使用普通话？","answer":"不必须，律师的庭审发言用词应当文明、得体，表达意见应当选用规范语言尽可能使用普通话。","sources":[],"kw":"不必须，律师的庭审发言用词应当文明、得体，表达意见应…","mnem":""},{"id":104,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，遇到下列情形，惩戒委员会应当作出什么决定？对律师协会已经处理过的违规行为，没有新的事由和证据而重复投诉的。","answer":"根据《律师协会会员违规行为处分规则（试行）》第四十九条规定，“对律师协会已经处理过的违规行为，没有新的事由和证据而重复投诉的\"属于不予立案的情形之一，应当不予立案。","sources":[],"kw":"，“对律师协会已经处理过的违规行为，没有新的事由和证…","mnem":""},{"id":105,"q":"结合全国律协《律师执业道德基本准则》的规定，简述律师应当如何实现其执业的根本宗旨？","answer":"律师应当始终把执业为民作为根本宗旨，全心全意为人民群众服务，通过执业活动努力维护人民群众的根本利益，维护公民、法人和其他组织的合法权益。认真履行法律援助义务，积极参加社会公益活动，自觉承担社会责任。","sources":[],"kw":"律师应当始终把执业为民作为根本宗旨，全心全意为人民群…","mnem":""},{"id":106,"q":"根据司法部《律师和律师事务所违法行为处罚办法》，关于律师违法行为违法行为性质、情节恶劣，严重损害律师行业形象，造成恶劣社会影响的处罚规定是什么？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第三十九条的规定，律师的违法行为有上述情形的，属千《律师法》规定的违法情节严重或者情节特别严重，应当在法定的行政处罚种类及幅度的范围内从重处罚。","sources":[],"kw":"根据司法部《律师和律师事务所违法行为处罚办法》第三十…","mnem":""},{"id":107,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，哪种情况下可以作为对违规会员从轻，减轻或者免除处分的依据？","answer":"根据《律师协会会员违规行为处分规则（试行）》第八十八条规定，经济争议达成和解，或者违规行为受到投诉人谅解的，可以作为从轻、减轻或者免除处分的依据。","sources":[],"kw":"，经济争议达成和解，或者违规行为受到投诉人谅解的，可…","mnem":""},{"id":108,"q":"根据《上海市律师协会律师执业行为规范》规定，对于当事人利用律师提供的法律服务从事犯罪活动的，律师可否拒绝辩护、代理？","answer":"可以。","sources":[],"kw":"可以。","mnem":""},{"id":109,"q":"企业对同岗位不同性别的员工支付不同工资，此举是否合法？","answer":"不合法。我国《宪法》规定，国家保护妇女的权利和利益，实行男女同工同酬，培养和选拔妇女干部。","sources":[],"kw":"不合法","mnem":""},{"id":110,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定， 利用提供法律服务的便利，接受对方当事人的财物及其他利益，与对方当事人、第三人恶意串通，向对方当事人、第三人提供不利于委托人的信息、证据材料，侵害委托人的权益，是否属于违规行为？如是，将会受到何种处分？","answer":"属于违规行为。给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利三个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"属于违规行为。给予训诫、警告或者…；情节严重的，给予公开谴责、中止会…","mnem":"属于/情节"},{"id":111,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，会员有以下哪些情况，应当对其违法行为进行从重处分？","answer":"（一）违规行为造成严重后果的；（二）逃避、抵制和阻挠调查的；（三）对投诉人、证人和有关人员打击报复的；（四）曾因违规行为受过行业处分或受过司法行政机关行政处罚的。","sources":[],"kw":"对投诉人、证人和有关人员打击报复的；（四）曾因违规行…","mnem":""},{"id":112,"q":"为什么说宪法具有最高法律效力","answer":"一切法律、行政法规和地方性法规都不得同宪法相抵触；一切国家机关和武装力量、各政党和各社会团体、各企业事业组织都必须遵守宪法和法律；一切违反宪法和法律的行为，必须予以追究；任何组织或者个人都不得有超越宪法和法律的特权。","sources":[],"kw":"一切法律、行政法规和地方性法规都…；一切国家机关和武装力量、各政党和…；一切违反宪法和法律的行为，必须予…；任何组织或者个人都不得有超越宪法…","mnem":"一切/一切/一切/任何"},{"id":113,"q":"律师在诉讼、仲裁活动中收集与提供证据，应注意遵循《律师职业道德和执业纪律规范》规定的哪一纪律？","answer":"律师应依法取证，不得伪造证据，不得怂恿委托人伪造证据、提供虚假证词，不得暗示、诱导、威胁他人提供虚假证据。","sources":[],"kw":"律师应依法取证，不得伪造证据，不得怂恿委托人伪造证据…","mnem":""},{"id":114,"q":"根据《律师执业行为规范》的规定律师是否能够保管委托人财产？如果可以，需要注意哪些事项？","answer":"律师事务所可以与委托人签订书面保管协议，妥善保管委托人财产，严格履行保管协议。律师事务所受委托保管委托人财产时，应当将委托人财产与律师事务所的财产、律师个人财产严格分离。 （《律师执业行为规范》第五十三条、五十四条）","sources":[],"kw":"律师事务所可以与委托人签订书面保管协议，妥善保管委托…","mnem":""},{"id":115,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，各省、自治区、直辖市律师协会及设区的市律师协议设立惩戒委员会主要负责的事项？","answer":"根据《律师协会会员违规行为处分规则（试行）》第九条规定：各省、自治区、直辖市律师协会及设区的市律师协会设立惩戒委员会，负责对违规会员进行处分。","sources":[],"kw":"各省、自治区、直辖市律师协会及设区的市律师协会设立惩…","mnem":""},{"id":116,"q":"根据《律师法》的规定， 律师接受委托后，无正当理由，不按时出庭参加诉讼或者仲裁，应处以怎样的处罚？","answer":"由设区的市级或者直辖市的区人民政府司法行政部门给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚。（第四十八条）","sources":[],"kw":"由设区的市级或者直辖市的区人民政…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"由/有违/情节"},{"id":117,"q":"某律师利用与司法机关、行政机关或其他具有社会管理职能组织的关系，进行不正当竞争的，依据全国律协《律师协会会员违规行为处分规则》，会受到哪几种处分？","answer":"1）给予通报批评 2）公开谴责 3）中止会员权利一个月以上一年以下4）情节严重的，给予取消会员资格的纪律处分。（《律师协会会员违规行为处分规则》第30条，第34条第2项）","sources":[],"kw":"给予通报批评；公开谴责；中止会员权利一个月以上一年以下；情节严重的，给予取消会员资格的纪…","mnem":"给予/公开/中止/情节"},{"id":118,"q":"根据《宪法》的规定，哪个权力机关具有“撤销国务院制定的同宪法、法律相抵触的行政法规、决定和命令”的职权?","answer":"全国人民代表大会常务委员会。","sources":[],"kw":"全国人民代表大会常务委员会。","mnem":""},{"id":119,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，在民事诉讼仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中的对方当事人，属于直接的利益冲突还是间接的利益冲突？","answer":"属于直接的利益冲突。","sources":[],"kw":"属于直接的利益冲突。","mnem":""},{"id":120,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，向当事人明示或者暗示与办案机关、政府部门及其工作人员有特殊关系的，是否属于违规行为？如是，将会受到何种处分？","answer":"属于违规行为。根据《律师协会会员违规行为处分规则（试行）》第二十九条规定：给予训诫、警告或通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"属于违规行为。根据《律师协会会员…；情节严重的，给予公开谴责、中止会…","mnem":"属于/情节"},{"id":121,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为是否构成违规行为？如是，将会受到何种处分？不及时收集、申请保全证据材料，或者无故延误参与诉讼、申请执行的。","answer":"属于违规行为，将由省、自治区、直辖市及设区的市律师协会给予训诫、通报批评、公开谴责。","sources":[],"kw":"违规行为，将由省、自治区、直辖市及设区的市律师协会给…","mnem":""},{"id":122,"q":"我国宪法如何保护公民的私有财产?","answer":"（1）公民的合法的私有财产不受侵犯。（2）国家依照法律规定保护公民的私有财产权和继承权。（3）国家为了公共利益的需要，可以依照法律规定对公民的私有财产实行征收或者征用并给予补偿。","sources":[],"kw":"国家依照法律规定保护公民的私有财产权和继承权","mnem":""},{"id":123,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，因律师违法行为造成律师事务所承担赔偿责任的，律师事务所在赔偿后可以采取的行动是？","answer":"如果律师事务所因律师的违法行为而先行承担了赔偿责任，律师事务所赔偿后可以向有故意或者重大过失行为的律师追偿。","sources":[],"kw":"如果律师事务所因律师的违法行为而先行承担了赔偿责任，…","mnem":""},{"id":124,"q":"根据《律师法》的规定，律师向法官助理赠送礼物的，是否违法？如是，将会受到何种处分？","answer":"属于违反《律师法》的行为。给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任。","sources":[],"kw":"属于违反《律师法》的行为。给予停…；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任","mnem":"属于/有违/情节/构成"},{"id":125,"q":"根据《律师执业行为规范》的相关规定，律师在接受委托后如何正确处理知悉的委托人和其他人不愿泄露的情况和信息？","answer":"律师对在执业活动中知悉的委托人和其他人不愿泄露的情况和信息，应当予以保密。但是，委托人或者其他人准备或者正在实施的危害国家安全、公共安全以及其他严重危害他人人身、财产安全的犯罪事实和信息除外。（《律师执业行为规范》第八条）","sources":[],"kw":"律师对在执业活动中知悉的委托人和其他人不愿泄露的情况…","mnem":""},{"id":126,"q":"根据《上海律师执业利益冲突认定和处理规则》的规定，在未取得有效豁免的情况下，在非诉讼业务中委托关系终止之日起一年内，律师又就同一法律事务接受与原委托人有利害关系的对方当事人的委托，该情况是否违反相关规定？如是，将会受到何种处分？","answer":"该行为属于相对禁止的利益冲突，未取得当事人豁免接受委托的，属于违规行为。律师及律师事务所违反本规则，由本会分别给予训诫、警告、通报批评、公开谴责、中止会员权利三个月以下的纪律处分，本会还可以责令律师及律师事务所公开澄清事实、消除影响。 （《上海律师执业利益冲突认定和处理规则》2023版第十条第五款、第十八条 ）","sources":[],"kw":"该行为属于相对禁止的利益冲突，未取得当事人豁免接受委…","mnem":""},{"id":127,"q":"根据《律师法》的规定，因过失犯罪而受刑事处罚的能否申请律师执业？律师申请律师职业，应当具备哪些条件？","answer":"可以申请。律师申请律师执业应当拥护中华人民共和国宪法；通过国家统一法律职业资格考试取得法律职业资格；在律师事务所实习满一年；品行良好。","sources":[],"kw":"可以申请。律师申请律师执业应当拥…；通过国家统一法律职业资格考试取得…；在律师事务所实习满一年；品行良好","mnem":"可以/通过/在律/品行"},{"id":128,"q":"周律师在帮当事人李老板代理诉讼案件的过程中，出门便坐出租车，吃饭也选择五星级酒店，之后找李老板报销。对此李老板颇有微词，但周律师却觉得这些都是应该的，请问周律师的行为是否符合相关规定？","answer":"《律师职业道德和执业纪律规范》第二十九条规定律师应当合理开支办案费用，注意节约。周律师不应过度开销，而应视情况选择合适的交通工具，吃饭也不应过于奢侈，而是要考虑当事人的状况。（《律师职业道德和执业纪律规范》第二十九条）","sources":[],"kw":"律师应当合理开支办案费用，注意节约","mnem":""},{"id":129,"q":"请阐述《宪法》中我国公民的政治权利。","answer":"公民政治权利指公民依法享有的参与国家政治生活的权利，包括选举权、被选举权、言论、出版、集会、结社、游行、示威等自由。","sources":[],"kw":"公民政治权利指公民依法享有的参与国家政治生活的权利，…","mnem":""},{"id":130,"q":"李先生委托了A律师事务所的王律师作为其房屋买卖纠纷的代理律师，由于房屋所涉及款项较大，且李先生很信任王律师，李先生欲委托王律师个人，在案件胜诉后，作为其房屋款项的保管人，王律师也表示愿意代李先生保管该款项，请问王律师的行为是否违反了《律师执业行为规范》？","answer":"违反了。律师不能以个人名义保管客户的财产，王律师应告知李先生，让其与A律师事务所签订保管协议。A律师事务所可以与委托人签订书面保管协议，妥善保管委托人财产，严格履行保管协议。律师事务所受委托保管委托人财产时，应当将委托人财产与律师事务所的财产、律师个人财产严格分离。（《律师执业行为规范》第五十三条、五十四条）","sources":[],"kw":"违反了","mnem":""},{"id":131,"q":"律师行业监督措施中，外部监督由哪些机关、团体或者群体开展？","answer":"司法行政机关、社会公众。","sources":[],"kw":"司法行政机关、社会公众。","mnem":""},{"id":132,"q":"杨律师接受委托后代理诉讼，在法庭主持调解下，双方达成了一致调解意见。杨律师在未经王先生同意的情况下，就将王先生出具的一般代理委托书上的代理权限改成了特别授权，并签署了调解协议，法院亦据此出具了《民事调解书》。问：杨律师的行为违反了全国律协 《律师职业道德和执业纪律规范》中的哪条规定？","answer":"杨律师违反《律师职业道德和执业纪律规范》中第32条规定：律师应当在委托授权范围内从事代理活动，如需特别授权，应当事先取得委托人的书面确认。","sources":[],"kw":"杨律师违反《律师职业道德和执业纪律规范》中第32条规…","mnem":""},{"id":133,"q":"《律师见证书》主要内容包括？","answer":"客户委托见证事项；律师见证的过程；律师见证的法律依据；律师见证的结论；见证律师的签字，并由律师事务所盖章；律师见证的时间。（《律师见证业务工作细则》第二十条）","sources":[],"kw":"客户委托见证事项；律师见证的过程；律师见证的法律依据；律师见证的结论；见证律师的签字，并由律师事务所盖…；律师见证的时间","mnem":"客户/律师/律师/律师/见证/律师"},{"id":134,"q":"根据《律师法》的规定，律师申请律师执业，是否对申请者的实习期有所要求，具体要求是什么？","answer":"是的。申请人应当在通过国家统一法律职业资格考试取得法律职业资格后在律师事务所实习满一年。","sources":[],"kw":"是的","mnem":""},{"id":135,"q":"根据宪法规定，国务院可以批准哪些行政区域的划分？","answer":"国务院有权根据《宪法》的规定，批准省、自治区、直辖市的区域划分，批准自治州、县、自治县、市的建置和区域划分。","sources":[],"kw":"国务院有权根据《宪法》的规定，批准省、自治区、直辖市…","mnem":""},{"id":136,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，同一律师事务所接受正在代理的对抗性案件或非诉案件当事人的对方当事人所委托的其他法律业务，是否构成直接的利益冲突？","answer":"不是，此种情形构成间接的利益冲突。","sources":[],"kw":"不是，此种情形构成间接的利益冲突。","mnem":""},{"id":137,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，律师事务所允许或者默许受到停止执业处罚的本所律师继续执业的，将会受到何种处分？","answer":"给予警告、通报批评或者公开谴责的纪律处分；情节严重的，给予中止会员权利一个月以上六个月以下的纪律处分；情节特别严重的，给予取消会员资格的纪律处分。","sources":[],"kw":"给予警告、通报批评或者公开谴责的…；情节严重的，给予中止会员权利一个…；情节特别严重的，给予取消会员资格…","mnem":"给予/情节/情节"},{"id":138,"q":"律师“利用提供法律服务的便利牟取当事人争议的权益”应该受到何种处罚？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚。","sources":[],"kw":"根据司法部《律师和律师事务所违法…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"根据/有违/情节"},{"id":139,"q":"根据司法部《律师和律师事务所违法行为处罚办法》，关于律师因故意犯罪、过失犯罪受到刑事处罚的相关执业规定是什么？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第四十二条规定律师因违法执业构成故意犯罪或者因非执业事由构成故意犯罪受到刑事处罚的，司法行政机关应当吊销其律师执业证书；因过失犯罪受到刑事处罚的，在其服刑或者执行缓刑期间应当停止履行律师职务，刑期届满后可再申请恢复执业。","sources":[],"kw":"根据司法部《律师和律师事务所违法…；因过失犯罪受到刑事处罚的，在其服…","mnem":"根据/因过"},{"id":140,"q":"简述人民代表大会和其他国家机关的关系。","answer":"全国人民代表大会和地方各级人民代表大会都由民主选举产生，对人民负责，受人民监督。国家行政机关、监察机关、审判机关、检察机关都由人民代表大会产生，对它负责，受它监督。","sources":[],"kw":"全国人民代表大会和地方各级人民代表大会都由民主选举产…","mnem":""},{"id":141,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师拒绝履行法律援助义务”的违法行为对应的处罚规定是什么？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处五千元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以下的处罚。","sources":[],"kw":"根据司法部《律师和律师事务所违法…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"根据/有违/情节"},{"id":142,"q":"王律师在接受委托后，让委托人将律师费支付给其个人，请问王律师该行为有无违法？如有，应该受到何种处罚？","answer":"王律师的行为属于违法情况。根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处一万元以下的罚款;有违法所得的，没收违法所得;情节严重的，给予停止执业三个月以上六个月以下的处罚。","sources":[],"kw":"王律师的行为属于违法情况。根据司…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"王律/有违/情节"},{"id":143,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，对于达成和解或投诉人撤销投诉的，惩戒委员会是否仍要继续进行处分程序？","answer":"根据《律师协会会员违规行为处分规则（试行）》第六十六条规定，达成和解或者投诉人撤销投诉，但是涉嫌违规的行为应当予以处分的，可以继续进行处分程序，必要时应当依照第四十四条的规定启动调查程序。","sources":[],"kw":"，达成和解或者投诉人撤销投诉，但是涉嫌违规的行为应当…","mnem":""},{"id":144,"q":"简述如何召集临时全国人民代表大会会议。","answer":"临时全国人民代表大会会议的召集主要有两种方式：一是由全国人民代表大会常务委员会认为必要而召集；二是由五分之一以上的全国人民代表大会代表提议召集。","sources":[],"kw":"临时全国人民代表大会会议的召集主…；二是由五分之一以上的全国人民代表…","mnem":"临时/二是"},{"id":145,"q":"律师为某刑事案件中犯罪嫌疑人担任辩护人，现人民检察院以证据不足为由将案件退回公安机关补充侦查，请问根据《律师法》的规定，目前阶段是否有权查阅、摘抄、复制案件的案卷材料？若没有，那么何时起有权查阅、摘抄、复制案件的案卷材料？","answer":"案件尚处于侦查阶段，律师无权查阅、摘抄、复制案件的案卷材料。根据《律师法》的规定，律师担任辩护人的，自人民检察院对案件审查起诉之日起，方才有权查阅、摘抄、复制案件的案卷材料。","sources":[],"kw":"案件尚处于侦查阶段，律师无权查阅、摘抄、复制案件的案…","mnem":""},{"id":146,"q":"依据宪法规定，请判断国务院是否有权批准直辖市的设置？请至少再列举3项国务院可以批准的行政区域划分。","answer":"有权，国务院有权根据《宪法》的规定，批准省、自治区、直辖市的区域划分，批准自治州、县、自治县、市的建置和区域划分。","sources":[],"kw":"有权，国务院有权根据《宪法》的规定，批准省、自治区、…","mnem":""},{"id":147,"q":"如果李律师在接受某案件委托后，发现该案存在相对禁止的利益冲突，在征询当事人意见后，当事人表示同意豁免，该豁免应当以何种方式作出？","answer":"豁免应当采取豁免函、邮件、电子数据等书面形式。豁免应当表明签发人已经知悉存在利益冲突的基 本事实和可能产生的后果，以及签发人明确同意律师事务所或律师继续代理，不向律师事务所或律师追究相关责任等内容。 （《上海律师执业利益冲突认定和处理规则》2023版第十三条）","sources":[],"kw":"豁免应当采取豁免函、邮件、电子数据等书面形式","mnem":""},{"id":148,"q":"根据《律师法》的规定，如果律师事务所的执业证书被依法吊销，会有什么后果？","answer":"如果律师事务所的执业证书被依法吊销，根据《律师法》相关规定律师事务所应当终止。","sources":[],"kw":"如果律师事务所的执业证书被依法吊销，根据《律师法》相…","mnem":""},{"id":149,"q":"根据《律师法》的规定，受到哪种处罚的律师不得担任合伙人？","answer":"答：受到六个月以上停止执业处罚的律师，处罚期满未逾三年的，不得担任合伙人。（第五十三条）","sources":[],"kw":"受到六个月以上停止执业处罚的律师，处罚期满未逾三年的…","mnem":""},{"id":150,"q":"胡律师在招揽业务时，向客户宣传自己和与案件相关的法院工作人员是多年朋友关系。该行为违反了《律师职业道德和执业纪律规范》规定的哪一纪律？","answer":"律师不得向委托人宣传自己与有管辖权的执法人员及有关人员有亲朋关系，不能利用这种关系招揽业务。","sources":[],"kw":"律师不得向委托人宣传自己与有管辖权的执法人员及有关人…","mnem":""},{"id":151,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，经处理或审理过某一案件的政府官员、审判员、仲裁员，成为律师后又代理同一案件的诉讼、仲裁、执行、申诉、再审，是否构成直接的利益冲突？","answer":"是的，构成直接利益冲突。","sources":[],"kw":"是的，构成直接利益冲突。","mnem":""},{"id":152,"q":"根据《上海市律师协会律师执业行为规范》规定，请阐述律师在接受刑事辩护委托后，什么情形不得提出无罪的辩护意见？","answer":"根据《上海市律师协会律师执业行为规范》第七十一条规定，律师在接受刑事辩护委托后，不得没有任何依据地提出无罪的辩护意见。","sources":[],"kw":"，律师在接受刑事辩护委托后，不得没有任何依据地提出无…","mnem":""},{"id":153,"q":"若张律师有事需长期出国，无法继续承办已接受委托的案件，张律师该如何处理？","answer":"张律师应当向委托人详细说明情况，望其谅解并同意更换律师，并及时办妥各项手续转委托他人代理。","sources":[],"kw":"张律师应当向委托人详细说明情况，望其谅解并同意更换律…","mnem":""},{"id":154,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师在接受委托后，遇哪些情况可以拒绝辩护或代理，可以不按时出庭参加诉讼或者仲裁？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第十一条规定：律师接受委托后，下列情形可拒绝辩护或者代理，不按时出庭参加诉讼或者仲裁：（一）委托事项违法，或者委托人利用律师提供的法律服务从事违法活动的；（二）委托人故意隐瞒与案件有关的重要事实或者提供虚假、伪造的证据材料；（三）委托人不履行委托合同约定义务的；（四）律师因患严重疾病或者受到停止执业以上行政处罚的；（五）其他依法可以拒绝辩护、代理的。","sources":[],"kw":"委托事项违法，或者委托人利用律师…；委托人故意隐瞒与案件有关的重要事…；委托人不履行委托合同约定义务的；律师因患严重疾病或者受到停止执业…；其他依法可以拒绝辩护、代理的","mnem":"委托/委托/委托/律师/其他"},{"id":155,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“在同一案件中为双方当事人担任代理人，或者代理与本人及其近亲属有利益冲突的法律事务”的违法行为对应的处罚规定是什么？","answer":"答：根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处五千元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以下的处罚。","sources":[],"kw":"根据司法部《律师和律师事务所违法…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"根据/有违/情节"},{"id":156,"q":"律师接受委托后，无正当理由，拒绝辩护或者代理，不按时出庭参加诉讼或者仲裁的，将受到何种处罚？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚。","sources":[],"kw":"根据司法部《律师和律师事务所违法…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"根据/有违/情节"},{"id":157,"q":"据《宪法》的规定，“监督宪法的实施”属于哪个权力机关的职权？","answer":"答：全国人民代表大会。","sources":[],"kw":"全国人民代表大会。","mnem":""},{"id":158,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，省、自治区、直辖市律师协会秘书长办公会议或者复查委员会主任、副主任在何种情况下可以提请复查委员会启动复查程序？","answer":"根据《律师协会会员违规行为处分规则（试行）》第七十八条规定，省、自治区、直辖市律师协会秘书长办公会议或者复查委员会主任、副主任集体认为本地区各律师协会惩戒委员会所做出的处分决定可能存在事实认定不清，或者适用法律、法规、规范错误，或调查、做出决定的程序不当的，有权在该处分决定做出后一年内提请复查委员会启动复查程序。","sources":[],"kw":"，省、自治区、直辖市律师协会秘书长办公会议或者复查委…","mnem":""},{"id":159,"q":"根据《上海市律师协会律师执业行为规范》规定，客观环境所施加的法律服务时间限制，是否属于律师收费应当考虑的合理因素？","answer":"属于律师收费应当考虑的合理因素。","sources":[],"kw":"属于律师收费应当考虑的合理因素。","mnem":""},{"id":160,"q":"根据《宪法》的规定，哪个权力机关具有“决定战争和和平的问题”的职权?","answer":"全国人民代表大会。","sources":[],"kw":"全国人民代表大会。","mnem":""},{"id":161,"q":"林律师接受某案件的委托后，考虑到近期工作繁忙，未经委托人同意便转委托其他律师代理。该行为违反了全国律协《律师职业道德和执业纪律规范》规定的哪一纪律？","answer":"律师接受委托后未经委托人同意，不得擅自转委托他人代理。","sources":[],"kw":"律师接受委托后未经委托人同意，不得擅自转委托他人代理","mnem":""},{"id":162,"q":"根据《上海市律师协会律师执业行为规范》规定，请阐述律师在接受刑事辩护委托后，应当提出哪些辩护意见？","answer":"根据《上海市律师协会律师执业行为规范》第七十一条规定，律师在接受刑事辩护委托后，应当依据事实和法律提出无罪、罪轻或从轻处罚的辩护意见。","sources":[],"kw":"，律师在接受刑事辩护委托后，应当依据事实和法律提出无…","mnem":""},{"id":163,"q":"董律师在办理刑事案件的过程中，应被告人家属的强烈要求，为被告人暗中传递家信。该行为违反了《律师职业道德和执业纪律规范》规定的哪一纪律？","answer":"律师不得与犯罪嫌疑人、被告人的亲属或者其他人会见在押犯罪嫌疑人、被告人，或者借职务之便违反规定为被告人传递信件、钱物或与案情有关的信息。","sources":[],"kw":"律师不得与犯罪嫌疑人、被告人的亲属或者其他人会见在押…","mnem":""},{"id":164,"q":"根据司法部《律师和律师事务所违法行为处罚办法》，关于在司法行政机关查处违法行为期间，拒不纠正或者继续实施违法行为，拒绝提交、隐匿、毁灭证据或者提供虚假、伪造的证据的处罚规定是什么？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第三十九条的规定，律师的违法行为有上述情形的，属于《律师法》规定的违法情节严重或者情节特别严重，应当在法定的行政处罚种类及幅度的范围内从重处罚。","sources":[],"kw":"根据司法部《律师和律师事务所违法行为处罚办法》第三十…","mnem":""},{"id":165,"q":"王律师故意向司法机关提交虚假证据，应当受到什么处分？","answer":"根据中华全国律师协会《律师协会会员违规行为处分规则（试行）》第36条规定：故意向司法机关、仲裁机构或者行政机关提供虚假证据或者威胁、利诱他人提供虚假证据，妨碍对方当事人合法取得证据的，（律师禁止做的事） 给予中止会员权利六个月以上一年以下的纪律处分；情节严重的给予取消会员资格的纪律处分。","sources":[],"kw":"根据中华全国律师协会《律师协会会…；情节严重的给予取消会员资格的纪律…","mnem":"根据/情节"},{"id":166,"q":"承办律师在出具《律师见证书》前应先审查什么内容？","answer":"客户是否具有民事权利能力和民事行为能力；客户的意思表示是否真实；客户所要求见证的事项是否合法；客户提供的证明材料和其他文件是否具有真实性、合法性、完整性和有效性。（《律师见证业务工作细则》第十八条）","sources":[],"kw":"客户是否具有民事权利能力和民事行…；客户的意思表示是否真实；客户所要求见证的事项是否合法；客户提供的证明材料和其他文件是否…","mnem":"客户/客户/客户/客户"},{"id":167,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，下述行为是否构成违规行为？如是，团体会员将会受到何种处分？不向委托人开具律师服务收费合法票据，或者不向委托人提交办案费用开支有效凭证的","answer":"属于违规行为，团体将由省、自治区、直辖市及设区的市律师协会给予训诫、通报批评、公开谴责。","sources":[],"kw":"违规行为，团体将由省、自治区、直辖市及设区的市律师协…","mnem":""},{"id":168,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》，利益冲突的分类有哪些？（至少回答4种）","answer":"利益冲突的分类有：（一）与律师本人或其近亲属有利益冲突的；（二）律师与所在律师事务所人员产生利益冲突的；（三）律师因自身履历产生利益冲突的；（四）律师因不同委托方之间产生利益冲突的；（五）律师事务所因不同委托方之间产生利益冲突的；（六）其他依据律师执业经验和行业常识能够判断为利益冲突的情形。","sources":[],"kw":"与律师本人或其近亲属有利益冲突的；律师与所在律师事务所人员产生利益…；律师因自身履历产生利益冲突的；律师因不同委托方之间产生利益冲突…；律师事务所因不同委托方之间产生利…；其他依据律师执业经验和行业常识能…","mnem":"与律/律师/律师/律师/律师/其他"},{"id":169,"q":"根据《律师法》的规定，律师代理与本人及其近亲属有利益冲突的法律事务，应处以怎样的处罚？","answer":"设区的市级或者直辖市的区人民政府司法行政部门给予警告，可以处五千元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以下的处罚。（第四十七条）","sources":[],"kw":"设区的市级或者直辖市的区人民政府…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"设区/有违/情节"},{"id":170,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师利用与法官、检察官、仲裁员或者其他有关工作人员的特殊关系，影响依法办理案件的，属于《律师法》规定的何种违法行为？","answer":"属于《律师法》规定的律师“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案”的违法行为。","sources":[],"kw":"《律师法》规定的律师“违反规定会见法官、检察官、仲裁…","mnem":""},{"id":171,"q":"某律师事务所近期开展了一项新业务，除了提供传统的法律服务外，还开始涉足房地产投资领域。该所以独资方式成立了一家房地产开发公司，并委派所内一名资深律师担任该公司的法定代表人。请问，根据司法部《律师和律师事务所违法行为处罚办法》，该律师事务所的此项行为是否构成违法行为？如果构成，请说明理由。","answer":"该律师事务所的行为构成违法行为。根据司法部《律师和律师事务所违法行为处罚办法》第二十五条的规定，律师事务所不得以独资方式兴办企业，并委派律师担任企业法定代表人。此举违反了律师和律师事务所应专注于提供法律服务的原则，因此构成违法行为。","sources":[],"kw":"该律师事务所的行为构成违法行为","mnem":""},{"id":172,"q":"简述《宪法》中关于保障各民族公民在诉讼中使用本民族语言文字权利的规定。","answer":"各民族公民都有用本民族语言文字进行诉讼的权利。人民法院和人民检察院对于不通晓当地通用的语言文字的诉讼参与人，应当为他们翻译。在少数民族聚居或者多民族共同居住的地区，应当用当地通用的语言进行审理；起诉书、判决书、布告和其他文书应当根据实际需要使用当地通用的一种或者几种文字。","sources":[],"kw":"各民族公民都有用本民族语言文字进…；起诉书、判决书、布告和其他文书应…","mnem":"各民/起诉"},{"id":173,"q":"请根据宪法规定，列举国务院常委会议的组成人员。","answer":"答：总理、副总理、国务委员、秘书长组成国务院常务会议。","sources":[],"kw":"总理、副总理、国务委员、秘书长组成国务院常务会议","mnem":""},{"id":174,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，以下不属于律师协会作出的处分种类的是","answer":"依据宪法规定，任何公民，必须经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，方可逮捕。","sources":[],"kw":"依据宪法规定，任何公民，必须经人民检察院批准或者决定…","mnem":""},{"id":175,"q":"简述我国《宪法》中关于人民行使国家权力的主要途径和形式。","answer":"中华人民共和国的一切权力属于人民。人民行使国家权力的机关是全国人民代表大会和地方各级人民代表大会。人民依照法律规定，通过各种途径和形式，管理国家事务，管理经济和文化事业，管理社会事务。","sources":[],"kw":"中华人民共和国的一切权力属于人民","mnem":""},{"id":176,"q":"根据《律师法》的规定，律师承办案件时提示当事人向法官送礼的，是否违法？如是，将会受到何种处分？","answer":"属于违反《律师法》的行为。给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任。","sources":[],"kw":"属于违反《律师法》的行为。给予停…；有违法所得的，没收违法所得；情节严重的，吊销其律师执业证书；构成犯罪的，依法追究刑事责任","mnem":"属于/有违/情节/构成"},{"id":177,"q":"哪些行政区域的人大代表可以由选民直接选举？请依据宪法作答。","answer":"依据宪法规定，县、不设区的市、市辖区、乡、民族乡、镇的人民代表大会代表由选民直接选举。","sources":[],"kw":"依据宪法规定，县、不设区的市、市辖区、乡、民族乡、镇…","mnem":""},{"id":178,"q":"客户向李律师咨询某诉讼案件，李律师看过基本材料后判断胜诉几率很低，而客户想了解该案是否可以胜诉，该情形李律师应该如何处理？","answer":"律师应当遵循诚实守信的原则，客观地告知委托人所委托事项可能出现的法律风险，不得故意对可能出现的风险做不恰当的表述或做虚假承诺；可以进一步委婉的告知客户无法做出肯定胜诉的承诺，但必定会尽力让案件受到最公正的判决，在合法的范围内争取最大权益。（《律师职业道德和执业纪律规定》第二十六条）","sources":[],"kw":"律师应当遵循诚实守信的原则，客观…；可以进一步委婉的告知客户无法做出…","mnem":"律师/可以"},{"id":179,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，执业期间以非律师身份从事有偿法律服务，将会受到何种处分？","answer":"给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"给予训诫、警告或者通报批评的纪律…；情节严重的，给予公开谴责、中止会…","mnem":"给予/情节"},{"id":180,"q":"根据《律师法》的规定，就某正在审理的案件，律师在周末通过私人关系约见法官并当面陈述其对案件中某法律问题的观点，是否违法？应处以怎样的处罚？","answer":"属于违法行为。应当由设区的市级或者直辖市的区人民政府司法行政部门给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，由省、自治区、直辖市人民政府司法行政部门吊销其律师执业证书；构成犯罪的，依法追究刑事责任。","sources":[],"kw":"属于违法行为。应当由设区的市级或…；有违法所得的，没收违法所得；情节严重的，由省、自治区、直辖市…；构成犯罪的，依法追究刑事责任","mnem":"属于/有违/情节/构成"},{"id":181,"q":"利益冲突调整的顺序是什么？","answer":"调整顺序，除会员与有关当事人协商调整外，一般为已成立的委托优于拟进行的委托，先成立的委托优先于后成立的委托。委托关系的成立时间，以会员和当事人签订委托合同的时间，或者虽未签订委托合同但当事人实际支付委托费用的时间，或者会员和当事人的函件足以证明委托关系成立的时间为准。","sources":[],"kw":"调整顺序，除会员与有关当事人协商调整外，一般为已成立…","mnem":""},{"id":182,"q":"根据《律师法》的规定，律师根据事实和法律，维护被害人的诉讼权利和其他合法权利是否属于律师担任辩护人的职责？若不是，那律师担任辩护人都有哪些职责？","answer":"不属于律师担任辩护人的职责。律师担任辩护人的，应当根据事实和法律，提出犯罪嫌疑人、被告人无罪、罪轻或者减轻、免除其刑事责任的材料和意见，维护犯罪嫌疑人、被告人的诉讼权利和其他合法权益。","sources":[],"kw":"律师担任辩护人的职责","mnem":""},{"id":183,"q":"某大型律师事务所为了扩大业务范围，决定开设一家与法律服务无关的咨询公司，提供市场营销策划和企业管理咨询服务。该律师事务所的部分律师被安排到这家咨询公司兼职，负责提供与法律服务无关的咨询建议。请问，这种行为是否违反了司法部《律师和律师事务所违法行为处罚办法》的规定？请结合相关规定进行分析。","answer":"该律师事务所的行为违反了司法部《律师和律师事务所违法行为处罚办法》的规定。根据该办法第二十五条，律师事务所不得从事与法律服务无关的中介服务或者其他经营性活动。开设与法律服务无关的咨询公司，并提供市场营销策划和企业管理咨询服务，显然超出了法律服务的范畴，因此构成违法行为。","sources":[],"kw":"该律师事务所的行为违反了司法部《律师和律师事务所违法…","mnem":""},{"id":184,"q":"某合同纠纷案件中，王律师接受被告委托代理该案后，因突然查出疾病需住院治疗，无法继续工作，王律师无奈将该案件委托给另一位律师代理。请问这种行为是否正确，为什么？","answer":"不正确。该行为违反了《律师职业道德和执业纪律规范》中第34条规定：律师接受委托后未经委托人同意，不得擅自转委托他人代理。","sources":[],"kw":"不正确","mnem":""},{"id":185,"q":"某一法律人才稀缺的偏远地区仅有一家律师事务所。根据全国律协《律师职业道德和执业纪律规范》的规定，在当地产生法律纠纷的双方当事人能否同时选择该律所代理诉讼案件？","answer":"能。同一律师事务所不得代理诉讼案件的双方当事人，偏远地区只有一律师事务所的除外。","sources":[],"kw":"能","mnem":""},{"id":186,"q":"根据司法部《律师和律师事务所违法行为处罚办法》第三十一条的规定，司法行政机关对律师的违法行为给予警告、罚款、没收违法所得、停止执业处罚的，具体应由律师执业机构所在地的哪一级司法行政机关来负责实施？","answer":"由律师执业机构所在地的设区的市级或者直辖市区（县）司法行政机关实施。","sources":[],"kw":"由律师执业机构所在地的设区的市级或者直辖市区（县）司…","mnem":""},{"id":187,"q":"为抵制法院对其房屋的强制执行，客户要求李律师提起一个确认房屋所有权的虚假诉讼，李律师拒绝了客户的请求，李律师的做法是否恰当？","answer":"恰当。因为虚假诉讼最后并不能达到不强制执行的目的，且已经违反了律师执业规范。根据全国律协《律师职业道德和执业纪律规范》第四十条规定：律师应当恪守独立履行职责的原则，不因迎合委托人或满足委托人的不当要求，丧失客观、公正的立场，不得协助委托人实施非法的或具有欺诈性的行为。","sources":[],"kw":"恰当","mnem":""},{"id":188,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，以支付介绍费等不正当手段争揽业务的，是否属于违规行为？如是，将会受到何种处分？","answer":"属于违规行为。给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"属于违规行为。给予训诫、警告或者…；情节严重的，给予公开谴责、中止会…","mnem":"属于/情节"},{"id":189,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，中华全国律师协会设立惩戒委员会主要负责事项？","answer":"根据《律师协会会员违规行为处分规则（试行）》第八条规定：中华全国律师协会设立惩戒委员会，负责律师行业处分相关规则的制定及对地方律师协会处分工作的指导与监督。","sources":[],"kw":"中华全国律师协会设立惩戒委员会，负责律师行业处分相关…","mnem":""},{"id":190,"q":"简述宗教信仰自由的主要内容。","answer":"宗教信仰自由的主要内容包括：公民有信仰宗教的自由，也有不信仰宗教的自由；有信仰这种宗教的自由，也有信仰那种宗教的自由；在同一宗教里，有信仰这个教派的自由，也有信仰那个教派的自由；有过去不信教而现在信教的自由，也有过去信教而现在不信教的自由。","sources":[],"kw":"宗教信仰自由的主要内容包括：公民…；有信仰这种宗教的自由，也有信仰那…；在同一宗教里，有信仰这个教派的自…；有过去不信教而现在信教的自由，也…","mnem":"宗教/有信/在同/有过"},{"id":191,"q":"外国人取得中国国籍并放弃外国籍后可否被选为中华人民共和国主席？请根据《宪法》规定进行判断简析。","answer":"根据宪法规定，有选举权和被选举权的年满四十五周岁的中华人民共和国公民可以被选为中华人民共和国主席、副主席。因此，外国人入籍并放弃外国籍后，如果符合宪法规定的条件，即具备被选为中华人民共和国主席、副主席的资格。","sources":[],"kw":"根据宪法规定，有选举权和被选举权的年满四十五周岁的中…","mnem":""},{"id":192,"q":"小王律师在处理某案件时，不慎将含有保密信息的文件遗忘在公共区域，但很快被同事发现并归还，信息未泄露。事发后，小王律师首先向律所的管理层报告了自己的失误，主动提出了补救和改进措施，同时立即加强了自己对案件材料的保密管理，增加了文件加密和访问权限等安全措施，确保类似事件不再发生。根据司法部《律师和律师事务所违法行为处罚办法》，司法行政机关对小王律师的违法行为如何处罚？","answer":"此案例提醒律师要严守保密义务。由于小王律师违法行为轻微且及时纠正，未造成实际危害，司法行政机关决定不予行政处罚。","sources":[],"kw":"此案例提醒律师要严守保密义务","mnem":""},{"id":193,"q":"根据《律师执业行为规范》的相关规定，李律师在接受客户委托后，突患疾病需要进行手术，可能短时间无法继续为客户提供法律服务，在该种情况下委托协议时应如何处理？","answer":"受委托律师遇有突患疾病、工作调动等紧急情况不能履行委托协议时，应当及时报告律师事务所，由律师事务所另行指定其他律师继续承办，并及时告知委托人。（《律师执业行为规范》第五十六条）","sources":[],"kw":"受委托律师遇有突患疾病、工作调动等紧急情况不能履行委…","mnem":""},{"id":194,"q":"根据《上海市律师协会律师执业行为规范》规定，通过与某行业协会进行合作，对某一类的法律服务事务进行垄断的方式争揽业务的，是否属于采用不正当手段与同行进行业务竞争？","answer":"属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":195,"q":"苏律师与委托人签订的授权委托书上，关于代理权限只笼统写为“代理诉讼”，而在诉讼中代替其委托人变更了诉讼请求和提起反诉。该行为违反了全国律协《律师职业道德和执业纪律规范》规定的哪一纪律？","answer":"律师不得超越委托人委托的代理权限。","sources":[],"kw":"律师不得超越委托人委托的代理权限。","mnem":""},{"id":196,"q":"国务院有权规定行政措施，制定行政法规，发布决定和命令，行使这些职权的前提条件是什么？请依据宪法作答。","answer":"依据宪法规定，国务院行使这些职权必须根据宪法和法律。","sources":[],"kw":"依据宪法规定，国务院行使这些职权必须根据宪法和法律","mnem":""},{"id":197,"q":"据《宪法》的规定，“选举中央军事委员会主席”属于哪个权力机关的职权？","answer":"全国人民代表大会。","sources":[],"kw":"全国人民代表大会。","mnem":""},{"id":198,"q":"在全国人民代表大会闭会期间，公安机关可以直接逮捕全国人大代表。该说法是否正确？","answer":"该说法错误。全国人民代表大会代表，非经全国人民代表大会会议主席团许可，在全国人民代表大会闭会期间非经全国人民代表大会常务委员会许可，不受逮捕或者刑事审判。","sources":[],"kw":"该说法错误","mnem":""},{"id":199,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，哪些行为属于“利用提供法律服务的便利牟取当事人争议的权益”的违法行为？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第十二条规定：有下列情形之一的，属于律师“利用提供法律服务的便利牟取当事人争议的权益的”违法行为：（一）采用诱导、欺骗、胁迫、敲诈等手段获取当事人与他人争议的财物、权益的；（二）指使、诱导当事人将争议的财物、权益转让、出售、租赁给他人，并从中获取利益的。","sources":[],"kw":"采用诱导、欺骗、胁迫、敲诈等手段…；指使、诱导当事人将争议的财物、权…","mnem":"采用/指使"},{"id":200,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，在间接利益冲突情形中，如果当事人拒绝豁免，但会员已经实施委托的，应如何处理？","answer":"会员已经实施委托的，应当停止实施。但是会员在收到拒绝豁免通知时已经完成了绝大部分委托业务，如果终止委托关系将造成委托人重大损失的，会员可以实施完毕委托业务，同时应当确保不发生损害利益冲突当事人的后果。","sources":[],"kw":"会员已经实施委托的，应当停止实施","mnem":""},{"id":201,"q":"一合同纠纷当事人在向李律师咨询时说，曾就该合同纠纷也咨询过另一律师事务所的何律师。 李律师为争取当事人的委托，对当事人讲了一些何律师业务能力没有自己强等贬低何律师的话。问：依据全国律协《律师协会会员违规行为处分规则》，李律师的行为属于违规行为吗？为什么？","answer":"属于违规行为。因为李律师捏造、散布虚假事实，损害、诋毁其他律师声誉，属于《违规行为处分规则》禁止的不正当竞争行为。","sources":[],"kw":"违规行为","mnem":""},{"id":202,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，不按规定统一接受委托、签订书面委托合同和收费合同，统一收取委托人支付的各项费用的，或者不按规定统一保管、使用律师服务专用文书、财务票据、业务档案的的行为是否属于违规行为？如是，将会受到何种处分？","answer":"给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"给予训诫、警告或者通报批评的纪律…；情节严重的，给予公开谴责、中止会…","mnem":"给予/情节"},{"id":203,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，律师事务所律师代理当事人的对抗性案件或非诉讼业务，而该律师的近亲属是对方当事人的高级管理人员、律师，或与对方当事人的高级管理人员、律师有利害关系，是否属于直接的利益冲突情形？","answer":"不是，此种情形构成间接的利益冲突。","sources":[],"kw":"不是，此种情形构成间接的利益冲突。","mnem":""},{"id":204,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师以对案件进行歪曲、不实、有误导性的宣传或者诋毁有关办案机关和工作人员以及对方当事人声誉等方式，影响依法办理案件的，属于《律师法》规定的何种违法行为？","answer":"属于《律师法》规定的律师“违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办案”的违法行为。","sources":[],"kw":"《律师法》规定的律师“违反规定会见法官、检察官、仲裁…","mnem":""},{"id":205,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，利用承办案件的法官、检察官、仲裁员以及其他工作人员或者其近亲属举办婚丧喜庆事宜等时机，以向其馈赠礼品、金钱、有价证券等方式行贿的，属于《律师法》规定的何种违法行为？","answer":"属于“向法官、检察官、仲裁员以及其他有关工作人员行贿，介绍贿赂或者指使、诱导当事人行贿”的违法行为。","sources":[],"kw":"“向法官、检察官、仲裁员以及其他有关工作人员行贿，介…","mnem":""},{"id":206,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，律师未经委托人或者其他当事人的授权或者同意，在承办案件的过程中或者结束后，擅自披露、散布在执业中知悉的委托人或者其他当事人的商业秘密、个人隐私或者其他不愿泄露的情况和信息的，属于《律师法》规定的何种违法行为？","answer":"属于《律师法》规定的“泄露商业秘密或个人隐私的”违法行为。","sources":[],"kw":"《律师法》规定的“泄露商业秘密或个人隐私的”违法行为","mnem":""},{"id":207,"q":"司机认为乘客支付的车费偏少，将其锁在车里近4小时，此行为是否合法？","answer":"不合法。禁止非法拘禁和以其他方法非法剥夺或者限制公民的人身自由。","sources":[],"kw":"不合法","mnem":""},{"id":208,"q":"王律师在办理法律援助案件时，因案件在郊区出行距离较远，向受援人索要交通费1000元，请问王律师该行为有无违法？如有，应该受到何种处罚？","answer":"王律师的行为属于违法情况。根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处一万元以下的罚款;有违法所得的，没收违法所得;情节严重的，给予停止执业三个月以上六个月以下的处罚。","sources":[],"kw":"王律师的行为属于违法情况。根据司…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"王律/有违/情节"},{"id":209,"q":"根据《上海市律师协会律师执业行为规范》规定，律师的庭审发言用词是否禁止使用社会流行用词？","answer":"不禁止，但不得随意使用黑话、脏话或社会流行的切口话。","sources":[],"kw":"不禁止，但不得随意使用黑话、脏话或社会流行的切口话","mnem":""},{"id":210,"q":"小李作为实习律师独自接待客户，并以李律师自居，为客户的问题提供法律意见，请问小李的行为是否违反相关法律的规定?","answer":"小李的行为违反《律师法》第十三条之规定，即没有取得律师执业证书的人员，不得以律师名义从事法律服务业务。除法律另有规定外，不得从事诉讼代理或者辩护业务。","sources":[],"kw":"小李的行为违反《律师法》第十三条之规定，即没有取得律…","mnem":""},{"id":211,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，会员有以下哪些情况，可以对其从轻、减轻或免予处分？","answer":"（一）初次违规并且情节显著轻微或轻微的；（二）承认违规并作出诚恳书面反省的；（三）自觉改正不规范执业行为的；（四）及时采取有效措施，防止不良后果发生或减轻不良后果的。","sources":[],"kw":"自觉改正不规范执业行为的；（四）及时采取有效措施，防…","mnem":""},{"id":212,"q":"饭店与顾客就结账金额产生争议，遂将顾客关在包厢近5小时，此行为是否合法？","answer":"不合法。禁止非法拘禁和以其他方法非法剥夺或者限制公民的人身自由。","sources":[],"kw":"不合法","mnem":""},{"id":213,"q":"根据《上海市律师协会律师执业行为规范》规定，就法律服务结果或司法诉讼的结果作出具有事实及法律根据的承诺的，是否属于采用不正当手段与同行进行业务竞争？","answer":"不属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"不属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":214,"q":"根据《上海律师执业利益冲突认定和处理规则》的规定，在民事诉讼、仲裁案件中，律师事务所律师担任一方当事人的代理人，而同一律师事务所的其他律师是该案件中对方当事人的近亲属，是否利益冲突？如是，应当如何豁免利益冲突？","answer":"属于相对禁止的利益冲突。发现相对禁止的利益冲突，律师及律师事务所应当立即将利益冲突的事实和可能产生的后果通知利益冲突的当事人，提请当事人按照本规则的要求给予豁免。在取得豁免前，不得接受委托；已经接受委托的，中止委托行为，但需紧急处理法律事务的除外。《上海律师执业利益冲突认定和处理规则》2023版第八条第五款、第十二条 。","sources":[],"kw":"属于相对禁止的利益冲突。发现相对…；已经接受委托的，中止委托行为，但…","mnem":"属于/已经"},{"id":215,"q":"据司法部《律师和律师事务所违法行为处罚办法》规定，哪些行为属于“私自接受委托、收取费用，接受委托人财物或其他利益”的违法行为？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第十条规定：有下列情形之一的，属于律师“私自接受委托、收取费用，接受委托人财物或者其他利益的”违法行为：（一）违反统一接受委托规定或者在被处以停止执业期间，私自接受委托，承办法律事务的；（二）违反收费管理规定，私自收取、使用、侵占律师服务费以及律师异地办案差旅费用的；（三）在律师事务所统一收费外又向委托人索要其他费用、财物或者获取其他利益的；（四）向法律援助受援人索要费用或者接受受援人的财物或者其他利益的。","sources":[],"kw":"违反统一接受委托规定或者在被处以…；违反收费管理规定，私自收取、使用…；在律师事务所统一收费外又向委托人…；向法律援助受援人索要费用或者接受…","mnem":"违反/违反/在律/向法"},{"id":216,"q":"根据《律师法》的规定，律师担任辩护人的，忘带律师执业证书的情况下，能否会见在押或者被监视居住的犯罪嫌疑人、被告人？若想要会见在押或者被监视居住的犯罪嫌疑人、被告人的，需要持哪些材料？","answer":"无法会见。若想要会见在押或者被监视居住的犯罪嫌疑人、被告人的，需要持律师执业证书、律师事务所证明和委托书或者法律援助公函。","sources":[],"kw":"无法会见","mnem":""},{"id":217,"q":"利益冲突调整的方法是什么？","answer":"根据《上海市律师协会律师执业利益冲突认定和处理规则》第十一条规定，发生利益冲突后，会员应当自行调整，消除利益冲突。","sources":[],"kw":"，发生利益冲突后，会员应当自行调整，消除利益冲突","mnem":""},{"id":218,"q":"依据宪法规定，除人民检察院批准或决定外，还有哪些国家机关有权决定逮捕公民？逮捕由哪个国家机关执行？","answer":"依据宪法规定，任何公民，必须经人民检察院批准或者决定或者人民法院决定，并由公安机关执行，方可逮捕。","sources":[],"kw":"依据宪法规定，任何公民，必须经人民检察院批准或者决定…","mnem":""},{"id":219,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，在司法机关、监管场所周边违规设立办公场所、散发广告、举牌等不正当手段争揽业务的，是否属于违规行为？如是，将会受到何种处分？","answer":"属于违规行为。根据《律师协会会员违规行为处分规则（试行）》第二十九条规定：给予训诫、警告或通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"属于违规行为。根据《律师协会会员…；情节严重的，给予公开谴责、中止会…","mnem":"属于/情节"},{"id":220,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，哄骗、唆使当事人提起诉讼，制造、扩大矛盾，影响社会稳定的？如是，将会受到何种处分？","answer":"属于违规行为。应给予通报批评、公开谴责或者中止会员权利一个月以上一年以下的纪律处分；情节严重的，给予取消会员资格的纪律处分。","sources":[],"kw":"属于违规行为。应给予通报批评、公…；情节严重的，给予取消会员资格的纪…","mnem":"属于/情节"},{"id":221,"q":"根据《宪法》的规定，哪个权力机关具有“决定特别行政区的设立及其制度”的职权?","answer":"全国人民代表大会。","sources":[],"kw":"全国人民代表大会。","mnem":""},{"id":222,"q":"根据全国律协《律师协会会员违规行为处分规则(试行)》的规定，利用提供法律服务的便利牟取当事人利益;接受委托后，故意损害委托人利益的，是否属于违规行为?如是，将会受到何种处分?","answer":"答:属于违规行为。给予训诫、警告或者通报批评的纪律处分;情节严重的，给予公开谴责、中止会员权利三个月以上一年以下或者取消会员资格的纪律处分","sources":[],"kw":"属于违规行为。给予训诫、警告或者…；情节严重的，给予公开谴责、中止会…","mnem":"属于/情节"},{"id":223,"q":"根据《上海市律师协会律师执业行为规范》规定，出于保护当事人权益的目的，限定当事人接受其指定的律师或律师事务所提供的法律服务的，是否属于采用不正当手段与同行进行业务竞争?","answer":"答:属于采用不正当手段与同行进行业务竞争","sources":[],"kw":"属于采用不正当手段与同行进行业务竞争","mnem":""},{"id":224,"q":"实习律师小李以律师自居，对外洽谈案件、承揽律师业务，律师协会应作出何种考核决定?","answer":"答:小李以律师名义洽谈、承揽律师业务，律师协会应当对其做出考核不合格的决定。","sources":[],"kw":"小李以律师名义洽谈、承揽律师业务，律师协会应当对其做…","mnem":""},{"id":225,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，律师在代理某当事人的对抗性案件或非诉讼业务期间，转所至另一律师事务所，但该当事人仍为原律师事务所的客户，该律师在转入的律师事务所担任该当事人在同一对抗性案件或非诉讼业务中对方当事人的代理人，或者在半年内该律师在转入的律师事务所担任该当事人在对抗性案件或非诉讼业务中对方当事人的代理人，是否属干直接的利益冲突?","answer":"答:是的，构成直接的利益冲突。","sources":[],"kw":"是的，构成直接的利益冲突。","mnem":""},{"id":226,"q":"根据《上海市律师协会律师执业行为规范》规定，与其他律师或律师事务所的法律服务质量和收费进行比较的，是否属于采用不正当手段与同行进行业务竞争？","answer":"答:属于采用不正当手段与同行进行业务竞争","sources":[],"kw":"属于采用不正当手段与同行进行业务竞争","mnem":""},{"id":227,"q":"根据《上海市律师协会律师执业行为规范》规定，在律师协会附近200米范围内设立律师广告牌和其他宣传媒介的，是否属于采用不正当手段与同行进行业务竞争？","answer":"不属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"不属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":228,"q":"请阐述《宪法》中关于物质帮助的规定.","answer":"中华人民共和国公民在年老、疾病或者丧失劳动能力的情况下，有从国家和社会获得物质帮助的权利。国家发展为公民享受这些权利所需要的社会保险、社会救济和医疗卫生事业。国家和社会保障残废军人的生活，抚恤烈士家属，优待军人家属。国家和社会帮助安排盲、聋、哑和其他有残疾的公民的劳动、生活和教育。","sources":[],"kw":"中华人民共和国公民在年老、疾病或者丧失劳动能力的情况…","mnem":""},{"id":229,"q":"根据全国律协《律师职业道德和执业纪律规范》的规定，简述“同一律师事务所不得代理诉讼案件的双方当事人”的例外情形。","answer":"偏远地区只有一律师事务所的除外。","sources":[],"kw":"偏远地区只有一律师事务所的除外。","mnem":""},{"id":230,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，律师事务所聘用律师或者其他工作人员，不按规定与应聘者签订聘用合同，不为其办理社会统筹保险，将会受到何种处分？","answer":"给予警告、通报批评或者公开谴责的纪律处分；情节严重的，给予中止会员权利一个月以上六个月以下的纪律处分；情节特别严重的，给予取消会员资格的纪律处分。","sources":[],"kw":"给予警告、通报批评或者公开谴责的…；情节严重的，给予中止会员权利一个…；情节特别严重的，给予取消会员资格…","mnem":"给予/情节/情节"},{"id":231,"q":"某一房地产买卖诉讼纠纷中，张律师接受委托代理该案后，经过分析案情认为李律师在房地产领域经验更加丰富，将该案转委托给李律师代理。这种做法是否正确？为什么？","answer":"错误。律师接受委托后未经委托人同意，不得擅自转委托他人代理。","sources":[],"kw":"错误","mnem":""},{"id":232,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》的规定如果陈律师在接受某案件委托后，发现该案存在绝对禁止的利益冲突，应当如何处理？","answer":"发现本条第一款情形之一的，律师及律师事务所不得接受委托或者实施委托行为；已经接受委托的，停止实施委托行为，但需紧急处理的法律事务除外。（上海市律师协会律师执业利益冲突认定和处理规则第十二条（2023修订） ）","sources":[],"kw":"发现本条第一款情形之一的，律师及…；已经接受委托的，停止实施委托行为…","mnem":"发现/已经"},{"id":233,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，律师私自接受委托，私自向委托人收取费用，是否属于违规行为？如是，将会受到何种处分？","answer":"给予训诫、警告或者通报批评的纪律处分；情节严重的，给予公开谴责、中止会员权利一个月以上一年以下或者取消会员资格的纪律处分。","sources":[],"kw":"给予训诫、警告或者通报批评的纪律…；情节严重的，给予公开谴责、中止会…","mnem":"给予/情节"},{"id":234,"q":"王律师在某律师事务所执业，同时在某法律服务咨询公司兼职，请问王律师违反了《律师职业道德和执业纪律规范》中的哪条规定？","answer":"违反了全国律协《律师职业道德和执业纪律规范》第十四条的规定：律师不得同时在两个或两个以上律师事务所执业。同时在一个律师事务所和一个法律服务所执业的视同在两个律师事务所执业。","sources":[],"kw":"违反了全国律协《律师职业道德和执业纪律规范》第十四条…","mnem":""},{"id":235,"q":"同一诉讼案件的双方当事人均有意向找某一律师事务所代理案件。根据全国律协《律师职业道德和执业纪律规范》的规定，该律所能否同时委派所内的两名律师分别作为原、被告的代理人？","answer":"不能。同一律师事务所不得代理诉讼案件的双方当事人，偏远地区只有一律师事务所的除外。","sources":[],"kw":"不能","mnem":""},{"id":236,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，本案被调查会员对省、自治区、直辖市律师协会或者设区的市律师协会惩戒委员会作出的处分决定不服的，应当如何申请复查？","answer":"根据《律师协会会员违规行为处分规则（试行）》第七十八条规定，本案被调查会员对省、自治区、直辖市律师协会或者设区的市律师协会惩戒委员会作出的处分决定不服的，可以在决定书送达之次日起的十五个工作日内向所在省、自治区、直辖市律师协会复查委员会申请复查。","sources":[],"kw":"，本案被调查会员对省、自治区、直辖市律师协会或者设区…","mnem":""},{"id":237,"q":"某诉讼中，李律师收到一审判决后发现自己代理的一方败诉，同时客户来电询问判决结果，该情形李律师应该怎么做？","answer":"李律师应根据生效法律文书确定的内容及时行使权利、履行义务以及告知当事人上诉权利、上诉期限、上诉法院。如需上诉，是否继续委托及后续服务写上诉状等等。《律师职业道德和执业纪律规定》第三十一条规定，律师应及时告知委托人有关代理工作的情况，对委托人了解委托事项情况的正当要求，应当尽快给予答复。","sources":[],"kw":"李律师应根据生效法律文书确定的内容及时行使权利、履行…","mnem":""},{"id":238,"q":"根据司法部《律师和律师事务所违法行为处罚办法》规定，“私自接受委托、收取费用，接受委托人财物或其他利益”的违法行为对应的处罚规定是什么？","answer":"根据司法部《律师和律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处一万元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以上六个月以下的处罚。","sources":[],"kw":"根据司法部《律师和律师事务所违法…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"根据/有违/情节"},{"id":239,"q":"在诉讼过程中王先生非常关心诉讼过程，经常询问杨律师关于诉讼的进展，杨律师认为王先生干扰了其独立履行职责，因此拒绝继续为王先生代理。请问杨律师这一行为是否正确。为什么。","answer":"不正确。该行为违反了《律师职业道德和执业纪律规范》中第33条规定：律师接受委托后无正当理由不得拒绝为委托人代理。","sources":[],"kw":"不正确","mnem":""},{"id":240,"q":"根据《上海市律师协会律师执业行为规范》规定，对于当事人坚持追求律师认为无法实现的或不合理的目标的，律师可否拒绝辩护、代理？","answer":"可以。","sources":[],"kw":"可以。","mnem":""},{"id":241,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，间接利益冲突取得豁免前，会员应当如何?","answer":"答:根据《上海市律师协会律师执业利益,冲突认定和处理规则》第八条规定，在取得当事人的有效豁免前，会员应当谨慎接受委托或者实施委托。","sources":[],"kw":"根据《上海市律师协会律师执业利益,冲突认定和处理规则…","mnem":""},{"id":242,"q":"根据《上海市律师协会律师执业行为规范》规定，对于当事人提供的证据材料不具有客观真实性、关联性与合法性，或经司法机关审查认为存在伪证嫌疑的，律师可否拒绝辩护、代理？答：可以。","answer":"可以。","sources":[],"kw":"可以。","mnem":""},{"id":243,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，律师对间接利益冲突的情形是否可以接受委托？","answer":"根据《上海市律师协会律师执业利益冲突认定和处理规则》第八条规定：对间接利益冲突，会员可以接受委托，但应当立即将利益冲突的事实和可能产生的后果通知利益冲突的各方当事人，提请利益冲突的各方当事人在合理时间内给予豁免。在取得当事人的有效豁免前，会员应当谨慎接受委托或者实施委托。","sources":[],"kw":"对间接利益冲突，会员可以接受委托，但应当立即将利益冲…","mnem":""},{"id":244,"q":"简述宪法修改的一般程序包括哪几个步骤。","answer":"宪法修改的一般程序通常包括提议、审议、通过和公布四个步骤。","sources":[],"kw":"宪法修改的一般程序通常包括提议、审议、通过和公布四个…","mnem":""},{"id":245,"q":"根据《宪法》规定，要当选中华人民共和国主席、副主席，需要什么法定资格条件？","answer":"有选举权和被选举权的年满四十五周岁的中华人民共和国公民可以被选为中华人民共和国主席、副主席。","sources":[],"kw":"有选举权和被选举权的年满四十五周岁的中华人民共和国公…","mnem":""},{"id":246,"q":"李先生想请A律师事务所的律师代理其房屋争议案件，欲与A律师事务所签订一份以收回涉案房屋为前提，按照一定比例收取货币作为律师费用的协议，请问A律师事务所签署这份协议是否符合《律师执业行为规范》的规定？","answer":"符合。律师事务所可以依法与当事人或委托人签订以回收款项或标的物为前提按照一定比例收取货币或实物作为律师费用的协议。（《律师执业行为规范》第四十七条）","sources":[],"kw":"符合","mnem":""},{"id":247,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》规定，被调查人员不参加听证是否影响惩戒委员会作出决定？","answer":"不影响。根据《律师协会会员违规行为处分规则（试行）》第六十条规定，被调查会员不陈述、不申辩、或者不参加听证的视为放弃，不影响惩戒委员会作出决定。","sources":[],"kw":"","mnem":""},{"id":248,"q":"根据《上海市律师协会律师执业利益冲突认定和处理规则》规定，在刑事案件中，律师事务所律师担任犯罪嫌疑人（被告人）的辩护人，而同一律师事务所的其他律师是该案件被害人的近亲属的，是否构成直接的利益冲突？","answer":"不构成，此种情形构成间接的利益冲突。如果同一律师事务所的其他律师是该案件的被害人才构成直接利益冲突。","sources":[],"kw":"，此种情形构成间接的利益冲突","mnem":""},{"id":249,"q":"张律师作为年轻律师，希望宣传自己的专业特长以取得更多成长机会。根据全国律协《律师职业道德和执业纪律规范》，她可以采取哪些方式？","answer":"（1）可以通过文字作品、研讨会、简介等方式以普及法律，宣传自己的专业领域，推荐自己的专业特长。（2）提倡、鼓励律师、律师事务所参加社会公益活动。","sources":[],"kw":"可以通过文字作品、研讨会、简介等…；提倡、鼓励律师、律师事务所参加社…","mnem":"可以/提倡"},{"id":250,"q":"根据全国律协《律师协会会员违规行为处分规则（试行）》的规定，律师同时在两个以上律师事务所执业是否属于违规行为？如是，将会受到何种处分？","answer":"属于违规行为。根据《律师及律师事务所违法行为处罚办法》第三十二条规定：律师有上述违法行为的，由司法行政机关给予警告，可以处五千元以下的罚款；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以下的处罚。","sources":[],"kw":"属于违规行为。根据《律师及律师事…；有违法所得的，没收违法所得；情节严重的，给予停止执业三个月以…","mnem":"属于/有违/情节"},{"id":251,"q":"金律师为赢得委托人的信任，对委托人作出案件必能胜诉的承诺，故意不提可能的风险。该行为违反了全国律协《律师职业道德和执业纪律规范》规定的哪一纪律？","answer":"律师应当遵循诚实守信的原则，客观地告知委托人所委托事项可能出现的法律风险，不得故意对可能出现的风险做不恰当的表述或做虚假承诺。","sources":[],"kw":"律师应当遵循诚实守信的原则，客观地告知委托人所委托事…","mnem":""},{"id":252,"q":"简述全国人民代表大会的组成。","answer":"全国人民代表大会由省、自治区、直辖市、特别行政区和军队选出的代表组成。各少数民族都应当有适当名额的代表。","sources":[],"kw":"全国人民代表大会由省、自治区、直辖市、特别行政区和军…","mnem":""},{"id":253,"q":"根据《上海市律师协会律师执业行为规范》规定，承诺或采用给介绍人或委托方具体办事人员提取案件介绍费或其它好处的方式争揽业务的，是否属于采用不正当手段与同行进行业务竞争？","answer":"属于采用不正当手段与同行进行业务竞争。","sources":[],"kw":"属于采用不正当手段与同行进行业务竞争。","mnem":""},{"id":254,"q":"根据《上海市律师协会律师执业行为规范》规定，以律师与当事人关系的性质以及交往时间的长短考虑收费标准的，是否属于律师和律师事务所相互之间采用手段排挤竞争对手的公平竞争，损害当事人的利益或者社会公共利益?","answer":"不属于律师和律师事务所相互之间采用手段排挤竞争对手的公平竞争，损害当事人的利益或者社会公共利益。","sources":[],"kw":"律师和律师事务所相互之间采用手段排挤竞争对手的公平竞…","mnem":""},{"id":255,"q":"根据《宪法》的规定，对于任何国家机关和国家工作人员的违法失职行为，我国公民享有哪些权利？由于国家机关和国家工作人员侵犯公民权利而受到损失的公民，拥有什么权利？","answer":"对于任何国家机关和国家工作人员的违法失职行为，有向有关国家机关提出申诉、控告或者检举的权利，但是不得捏造或者歪曲事实进行诬告陷害。由于国家机关和国家工作人员侵犯公民权利而受到损失的人，有依照法律规定取得赔偿的权利。","sources":[],"kw":"对于任何国家机关和国家工作人员的违法失职行为，有向有…","mnem":""},{"id":256,"q":"根据《上海市律师协会律师执业行为规范》规定，对于向当事人提供的法律服务将会给律师带来不合理的费用负担，或给律师造成难以承受的、不合理的困难的情况，律师可否拒绝辩护、代理？","answer":"可以。","sources":[],"kw":"可以。","mnem":""},{"id":257,"q":"学校在没有得到学生同意的情况下，查看学生的私人电子邮件或手机信息，是否属于违法行为？","answer":"属于违法行为。中华人民共和国公民的通信自由和通信秘密受法律的保护；除因国家安全或者追查刑事犯罪的需要，由公安机关或者检察机关依照法律规定的程序对通信进行检查外，任何组织或者个人不得以任何理由侵犯公民的通信自由和通信秘密。","sources":[],"kw":"属于违法行为。中华人民共和国公民…；除因国家安全或者追查刑事犯罪的需…","mnem":"属于/除因"},{"id":258,"q":"王律师因病住院无法继续工作，对于被告委托代理的案件，应当如何处理？","answer":"王律师应向委托人详细说明情况，望其理解并同意更换律师，然后及时办妥转委托他人代理的各项手续。","sources":[],"kw":"王律师应向委托人详细说明情况，望其理解并同意更换律师…","mnem":""},{"id":259,"q":"律师担任犯罪嫌疑人的辩护人，现公安机关已将相关材料移送人民检察院，该律师通过私人关系联系到承办检察官欲向其打探案情，请问该律师的行为是否违反《律师法》的规定？若违法，将受到什么处罚？","answer":"属于违法行为。律师违反规定会见法官、检察官、仲裁员以及其他有关工作人员，或者以其他不正当方式影响依法办理案件的，由设区的市级或者直辖市的区人民政府司法行政部门给予停止执业六个月以上一年以下的处罚，可以处五万元以下的罚款；有违法所得的，没收违法所得；情节严重的，由省、自治区、直辖市人民政府司法行政部门吊销其律师执业证书；构成犯罪的，依法追究刑事责任。","sources":[],"kw":"属于违法行为。律师违反规定会见法…；有违法所得的，没收违法所得；情节严重的，由省、自治区、直辖市…；构成犯罪的，依法追究刑事责任","mnem":"属于/有违/情节/构成"}]};
const KEY = 'lyx_skxt_v1';
const OFFSETS = [0, 1, 2, 4, 7, 11, 14]; // 艾宾浩斯复习节点（距出错天数）

let state = load();
let cur = { k: 'danxuan', filter: 'all', index: 0, order: [] }; // k 可为 danxuan/duoxuan/jianda/today
/* 刷新后接着上次位置刷题（2026-09-29）：恢复题型/筛选/题号 */
(function(){ try { const s = JSON.parse(localStorage.getItem(KEY + ':cur')); if (s && s.k) { cur.k = s.k; cur.filter = s.filter || 'all'; cur.index = s.index || 0; } } catch (e) {} })();
function saveCur(){ try { localStorage.setItem(KEY + ':cur', JSON.stringify({ k: cur.k, filter: cur.filter, index: cur.index })); } catch (e) {} }

/* ---------- 本地存储 ---------- */
function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  const base = { danxuan: {}, duoxuan: {}, jianda: {}, review: {}, wrongcnt: {} };
  if (s && typeof s === 'object') {
    base.danxuan = s.danxuan || {};
    base.duoxuan = s.duoxuan || {};
    base.jianda = s.jianda || {};
    base.review = s.review || {};
    base.wrongcnt = s.wrongcnt || {};
  }
  return base;
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

/* ---------- 日期工具 ---------- */
function pad(n) { return n < 10 ? '0' + n : '' + n; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function dayDiff(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }

/* ---------- 复习调度（键 = 题型:题号，避免跨题型串号） ---------- */
function markWrong(k, id) {
  state.review[k + ':' + id] = { d: todayStr(), s: 0, last: '' };
  if (!state.wrongcnt) state.wrongcnt = {};
  state.wrongcnt[k + ':' + id] = (state.wrongcnt[k + ':' + id] || 0) + 1;
}
function markRight(k, id) {
  const r = state.review[k + ':' + id];
  if (!r) return;
  r.s++;
  r.last = todayStr();
  if (r.s >= 2) delete state.review[k + ':' + id]; // 连续2次对=过关
}
function isDue(k, id) {
  const r = state.review[k + ':' + id];
  if (!r) return false;
  const diff = dayDiff(r.d, todayStr());
  if (diff > 14) return r.last !== todayStr(); // 超14天仍未过，兜底每日提醒
  return OFFSETS.includes(diff) && r.last !== todayStr();
}
function todayCount() {
  let n = 0;
  for (const tk of Object.keys(TABS)) for (const q of DATA[tk]) if (isDue(tk, q.id)) n++;
  return n;
}

/* ---------- 顺序 ---------- */
const TABS = { danxuan: '单选', duoxuan: '多选', jianda: '简答' };
const ORDER = ['A', 'B', 'C', 'D', 'E'];

function statusMap() { return cur.k === 'today' ? {} : (cur.k === 'jianda' ? state.jianda : state[cur.k]); }

function buildOrder() {
  if (cur.k === 'today') {
    const arr = [];
    for (const tk of Object.keys(TABS)) for (const q of DATA[tk]) if (isDue(tk, q.id)) arr.push({ type: tk, id: q.id });
    cur.order = arr;
    if (cur.index >= cur.order.length) cur.index = 0;
    return;
  }
  const k = cur.k, f = cur.filter;
  let ids = DATA[k].map(q => q.id);
  if (f === 'wrong') {
    ids = ids.filter(id => cur.k === 'jianda' ? state.jianda[id] && state.jianda[id] !== '记得' : state[k][id] === 'wrong');
  } else if (f === 'todo') {
    ids = ids.filter(id => cur.k === 'jianda' ? !state.jianda[id] : !state[k][id]);
  } else if (f === 'random') {
    for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  }
  cur.order = ids;
  if (cur.order.length === 0) cur.index = 0;
  else if (cur.index >= cur.order.length) cur.index = 0;
}

function currentItem() {
  if (cur.k === 'today') return cur.order[cur.index] || null;
  const id = cur.order[cur.index];
  return { type: cur.k, id };
}

/* ---------- 渲染 ---------- */
function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.k === cur.k);
  });
  const td = document.querySelector('.tab[data-k="today"] .cnt');
  if (td) td.textContent = todayCount() ? '(' + todayCount() + ')' : '';
}

function renderProg() {
  const total = todayCount();
  document.getElementById('pToday').textContent = total;
  if (cur.k === 'today') {
    document.getElementById('pTotal').textContent = total;
    document.getElementById('pDone').textContent = '—';
    document.getElementById('pAcc').textContent = '—';
    document.getElementById('pWrong').textContent = '—';
    document.getElementById('pEssay').style.display = 'none';
    return;
  }
  const k = cur.k, sm = statusMap();
  let done = 0, right = 0, wrong = 0, review = 0;
  for (const q of DATA[k]) {
    const st = sm[q.id];
    if (!st) continue;
    done++;
    if (k === 'jianda') { if (st !== '记得') review++; }
    else if (st === 'right') right++; else wrong++;
  }
  document.getElementById('pTotal').textContent = DATA[k].length;
  document.getElementById('pDone').textContent = done;
  document.getElementById('pAcc').textContent = done ? Math.round(right / done * 100) + '%' : '--';
  document.getElementById('pWrong').textContent = wrong;
  const pe = document.getElementById('pEssay');
  if (k === 'jianda') { pe.style.display = ''; document.getElementById('pReview').textContent = review; }
  else pe.style.display = 'none';
}

function renderQ() {
  const item = currentItem();

  document.getElementById('qtag').textContent = (q && q.sources && q.sources[0] ? q.sources[0] + ' · ' : '') + TABS[k] + (cur.k === 'today' ? '·今日复习' : '');

  function submitChoice() {
    if (!q || sel.size === 0) return;
    const ans = q.answer.split('').sort().join('');
    const mine = [...sel].sort().join('');
    const ok = ans === mine;
    statusMap()[q.id] = ok ? 'right' : 'wrong';
    if (ok) markRight(k, q.id); else markWrong(k, q.id);
    save();
    buttons.forEach(b => {
      const L = b.querySelector('.ol').textContent;
      if (ans.includes(L)) b.classList.add('right');

      b.classList.add('dim');
    });

    fb.className = 'fb show ' + (ok ? 'correct' : 'wrong');

    const src = (q.sources && q.sources[0]) || '';
    if (src) h += '<div class="src">来源：' + src + '</div>';
    if (q.note) h += '<div class="src expl">【解析】' + q.note + '</div>';
    fb.innerHTML = h;
    if (ok) addGuessBtn(fb, k, q);
    renderProg(); renderStrip();
    if (cur.k === 'today') {
      const nb = document.createElement('button'); nb.className = 'btn primary'; nb.style.marginTop = '10px';
      nb.textContent = ok ? '复习过关 → 下一题' : '下一题';
      nb.onclick = () => advance();
      box.appendChild(nb);
    }
  }
  ORDER.forEach(L => {
    if (!q.options[L]) return;
    const d = document.createElement('div');
    d.className = 'opt';
    const ol = document.createElement('span'); ol.className = 'ol'; ol.textContent = L;
    const tx = document.createElement('span'); tx.textContent = q.options[L];
    d.appendChild(ol); d.appendChild(tx);
    d.onclick = () => {
      if (statusMap()[q.id]) return;
      if (isSingle) {
        // 单选：点选即自动判对错，无需点提交
        sel = new Set([L]);
        buttons.forEach(b => b.classList.remove('selected'));
        d.classList.add('selected');
        submitChoice();
      } else {
        if (sel.has(L)) { sel.delete(L); d.classList.remove('selected'); } else { sel.add(L); d.classList.add('selected'); }
      }
    };
    buttons.push(d); box.appendChild(d);
  });
  if (statusMap()[q.id]) {
    // 已作答：重新打开直接展示判题结果，不可再改
    const ans = q.answer.split('').sort().join('');
    buttons.forEach(b => {
      const L = b.querySelector('.ol').textContent;
      if (ans.includes(L)) b.classList.add('right');
      b.classList.add('dim');
    });
    const ok = statusMap()[q.id] === 'right';
    const fb = document.getElementById('fb');
    fb.className = 'fb show ' + (ok ? 'correct' : 'wrong');
    let h = (ok ? '✓ 回答正确！' : '✗ 回答错误') + '　正确答案：<span class="ans">' + q.answer + '</span>';
    const src = (q.sources && q.sources[0]) || '';
    if (src) h += '<div class="src">来源：' + src + '</div>';
    if (q.note) h += '<div class="src expl">【解析】' + q.note + '</div>';
    fb.innerHTML = h;
    if (ok) addGuessBtn(fb, k, q);
  } else if (!isSingle) {
    const submit = document.createElement('div');
    submit.innerHTML = '<button class="btn primary" id="submitBtn">提交</button>';
    box.appendChild(submit);
    document.getElementById('submitBtn').onclick = () => submitChoice();
  }
  document.getElementById('pos').textContent = cur.order.length ? (cur.index + 1) + ' / ' + cur.order.length : '0 / 0';
  document.getElementById('hint').textContent = cur.k === 'today'
    ? '今日到期错题：做对累计2次即过关，做错明天/节点再刷。'
    : (k === 'jianda' ? '先默答，再看答案并自评。'
        : (isSingle ? '点选答案即自动判对错。' : '多选：勾选答案后点提交判对错。'));
}

function advance() {
  if (cur.index < cur.order.length - 1) { cur.index++; render(); }
  else { cur.index = 0; render(); }
}

function renderStrip() {
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  if (cur.k === 'today') {
    cur.order.forEach((item, i) => {
      const c = document.createElement('div');
      c.className = 'cell';
      c.textContent = item.id;
      if (i === cur.index) c.classList.add('cur');
      else c.classList.add('done');
      c.onclick = () => { cur.index = i; render(); };
      strip.appendChild(c);
    });
    return;
  }
  const k = cur.k, sm = statusMap();
  cur.order.forEach((id, i) => {
    const c = document.createElement('div');
    c.className = 'cell';
    c.textContent = id;
    const st = sm[id];
    if (i === cur.index) c.classList.add('cur');
    else if (k === 'jianda') {
      if (st === '记得') c.classList.add('jdone');
      else if (st) c.classList.add('jreview');
      else c.classList.add('done');
    } else {
      if (st === 'right') c.classList.add('right');
      else if (st === 'wrong') c.classList.add('wrong');
      else c.classList.add('done');
    }
    c.onclick = () => { cur.index = i; render(); };
    strip.appendChild(c);
  });
}

function render() {
  renderTabs(); renderProg(); renderFilters(); renderQ(); renderStrip();
}

const SUBJECT = document.title;
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function safeName() { return SUBJECT.replace(/[\\/:*?"<>|]/g, ''); }
function panelHead(title, sub) {

function metricBox(label, v) { return '<div class="smetric"><b>' + v + '</b><span>' + label + '</span></div>'; }
function barClassOf(acc) { return acc >= 80 ? 'g' : (acc < 50 ? 'r' : ''); }
function downloadBlob(content, name, mime) {
  const blob = new Blob([content], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
}
function statData() {
  const perType = Object.keys(TABS).map(function (k) {
    const arr = DATA[k] || [], sm = state[k] || {};
    let done = 0, right = 0, wrong = 0;
    for (const q of arr) {
      const st = sm[q.id];
      if (!st) continue;
      done++;
      if (k === 'jianda') { if (st === '记得') right++; else wrong++; }
      else if (st === 'right') right++; else wrong++;
    }
    return { k: k, label: TABS[k], total: arr.length, done: done, right: right, wrong: wrong, acc: done ? Math.round(right / done * 100) : null };
  });
  const total = perType.reduce(function (a, b) { return a + b.total; }, 0);
  const done = perType.reduce(function (a, b) { return a + b.done; }, 0);
  const right = perType.reduce(function (a, b) { return a + b.right; }, 0);
  return {
    perType: perType, total: total, done: done, right: right, wrong: done - right,
    acc: done ? Math.round(right / done * 100) : null,
    due: todayCount(), queue: Object.keys(state.review || {}).length, pomo: pomo.count
  };
}
function chapStats() {
  const rows = {};
  Object.keys(TABS).forEach(function (k) {
    (DATA[k] || []).forEach(function (q) {
      if (!q.chap) return;
      const st = (state[k] || {})[q.id];
      const r = rows[q.chap] || (rows[q.chap] = { total: 0, done: 0, right: 0, wrong: 0 });
      r.total++;
      if (st) {
        r.done++;
        if ((k === 'jianda' && st === '记得') || (k !== 'jianda' && st === 'right')) r.right++; else r.wrong++;
      }
    });
  });
  return Object.keys(rows).map(function (c) { const v = rows[c]; return { chap: c, total: v.total, done: v.done, right: v.right, wrong: v.wrong }; })
    .filter(function (r) { return r.done > 0; })
    .sort(function (a, b) { return (b.wrong / b.done) - (a.wrong / a.done) || b.wrong - a.wrong; });
}
function stubbornList() {
  const out = [];
  Object.keys(TABS).forEach(function (k) {
    const sm = state[k] || {};
    (DATA[k] || []).forEach(function (q) {
      const st = sm[q.id];
      if (!st) return;
      const bad = (k === 'jianda') ? st !== '记得' : st === 'wrong';
      if (!bad) return;
      out.push({
        k: k, id: q.id,
        wc: (state.wrongcnt && state.wrongcnt[k + ':' + q.id]) || 0,
        inQ: !!state.review[k + ':' + q.id],
        text: String(q.q || '').slice(0, 42),
        src: q.chap || (q.sources && q.sources[0]) || ''
      });
    });
  });
  out.sort(function (a, b) { return b.wc - a.wc; });
  return out;
}
function jumpToQuestion(k, id) {

  if (idx < 0) { cur.k = k; cur.filter = 'wrong'; buildOrder(); idx = cur.order.findIndex(function (x) { return String(x) === String(id); }); }
  if (idx < 0) { cur.k = k; cur.filter = 'all'; buildOrder(); idx = cur.order.findIndex(function (x) { return String(x) === String(id); }); }

        + '<td>' + (r.wc >= 3 ? '<span class="tagw">顽固·错' + r.wc + '次</span>' : (r.wc ? '<span class="tagq">错' + r.wc + '次</span>' : ''))
        + (r.inQ ? ' <span class="tagq">复习中</span>' : '') + '</td></tr>';
    });
